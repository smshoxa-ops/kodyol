name: Build FION APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        run: npm install
      - name: Add Android
        run: npx cap add android
      - name: App icons
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          R=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; z=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert www/icon-512.png -resize ${z}x${z} $R/mipmap-$n/$f.png
            done
          done
          rm -f $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FION-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
