/* v155: сворачивание шапки профиля при прокрутке (баннер -> компактная полоса, аватар/кнопки плавно гаснут) */
.pcard.pcol{display:contents}
.pcard.pcol .pban,.pcard.pcol .pbody{width:100vw;margin-left:calc(50% - 50vw);box-sizing:border-box}
.pcard.pcol .pban{position:sticky;top:calc(var(--pcs,200px)*-1);z-index:4;overflow:hidden;--p:0}
.pcard.pcol .pban>img{transform:translate3d(0,calc(var(--p)*var(--pcs,200px)*.5),0) scale(calc(1 + var(--p)*.08));will-change:transform}
.pcard.pcol .pban::before{opacity:calc(1 - var(--p))}
.pcard.pcol .pban::after{opacity:calc(1 - var(--p))}
.pcard.pcol .pbshade{position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(10,6,14,.62);opacity:var(--p);-webkit-backdrop-filter:blur(calc(var(--p)*14px));backdrop-filter:blur(calc(var(--p)*14px))}
.pcard.pcol .pbn{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:3;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font:700 16px Poppins,system-ui,sans-serif;pointer-events:none;opacity:calc((var(--p) - .6)*2.5);transform:translate3d(0,calc((1 - var(--p))*14px),0)}
.pcard.pcol .pbc{opacity:calc(1 - var(--p)*2.2);transform:translate3d(0,calc(var(--p)*-20px),0) scale(calc(1 - var(--p)*.2));pointer-events:auto}
.pcard.pcol .pbody{position:relative;z-index:auto;--q:0;margin-bottom:6px;background:var(--bg)}
.pcard.pcol .pf{z-index:5;transform-origin:0 100%;transform:translate3d(0,calc(var(--q)*-24px),0) scale(calc(1 - var(--q)*.35));opacity:calc(1 - var(--q)*1.15);will-change:transform,opacity}
.pcard.pcol .prow{transform-origin:50% 0;transform:translate3d(0,calc(var(--q)*-16px),0) scale(calc(1 - var(--q)*.1));opacity:calc(1 - var(--q)*1.25);will-change:transform,opacity}
.pcard.pcol .pbio{opacity:calc(1 - var(--q)*1.4)}
.pcard.pcol.cl .pf,.pcard.pcol.cl .prow{pointer-events:none}
#c-me:has(.pcol)>.hd,#c-user:has(.pcol)>.hd{position:fixed;left:0;top:0;width:100%;margin:0}
#c-me:has(.pcol),#c-user:has(.pcol){min-height:calc(100vh + var(--pcs,200px) + 140px)}
#c-me:has(.pcol)>.ptb,#c-user:has(.pcol)>.ptb{position:sticky;top:calc(var(--pcb2,58px) + env(safe-area-inset-top,0px) - 1px);z-index:5;background:var(--bg);margin-top:0}

#dr .dwb{width:100%;max-width:none;margin:auto 0 0;flex:none;min-height:56px;padding:8px 16px;gap:10px;border-radius:18px;box-shadow:0 8px 22px rgba(139,0,220,.22),inset 0 1px 0 rgba(255,255,255,.3)}
#dr .dwb b{font-size:clamp(13px,3.8vw,15px);letter-spacing:1.3px}
#dr .dwb+.aiL{margin-top:10px}

{k:["boxmodel","boxsizing"],t:"Box Model (quti modeli)",d:"Brauzer har bir HTML elementni to'rtburchak quti deb hisoblaydi. Quti 4 qatlamdan iborat:\n\n1) Content — haqiqiy mazmun (matn, rasm); o'lchami width va height bilan beriladi.\n2) Padding — mazmun va ramka orasidagi ichki bo'shliq; fon rangi shu joyni ham bo'yaydi.\n3) Border — padding atrofidagi ramka.\n4) Margin — ramkadan tashqaridagi shaffof bo'shliq, qo'shni elementlarni itaradi.\n\nMuhim tuzoq: standart holatda width faqat mazmun enini bildiradi, padding va border unga qo'shiladi. Masalan 300px + 40px padding + 4px border = 344px. Shuning uchun deyarli har bir loyihada box-sizing: border-box yoziladi, shunda width ichiga padding va border ham kiradi.\n\nKo'p uchraydigan xatolar: margin va padding ni adashtirish; margin: 0 auto faqat block elementda va aniq width bo'lganda o'rtaga qo'yadi; vertikal margin lar ba'zan qo'shilmaydi, kattasi olinadi (margin collapse).\n\nTekshirish: sahifada o'ng tugma → Inspect → Computed bo'limida rangli quti chizmasi ko'rinadi.",c:"* { box-sizing: border-box; }\n.card {\n width: 300px;\n padding: 20px;\n border: 2px solid #670a9d;\n margin: 16px auto;\n}"},
{k:["margin","padding"],t:"Margin va Padding farqi",d:"Margin — elementdan TASHQARIDAGI bo'shliq, padding — elementning ICHIDAGI bo'shliq. O'xshatish: rasm ramkasi. Rasm — content, rasm bilan ramka orasidagi oq qog'oz — padding, ramka — border, ramkalar orasidagi devor — margin.\n\nYozish usullari: margin: 10px — to'rt tomonga; margin: 10px 20px — tepa-past 10, chap-o'ng 20; margin: 5px 10px 15px 20px — soat mili bo'yicha (tepa, o'ng, past, chap). Bitta tomon uchun margin-top, padding-left va hokazo.\n\nQachon nimani ishlatish: elementlarni bir-biridan uzoqlashtirish kerak bo'lsa — margin; tugma yoki karta ichidagi matn ramkaga yopishib qolmasin desangiz — padding. Fon rangi faqat padding gacha bo'yaydi, margin doim shaffof.",c:"margin: 10px 20px;\npadding: 8px 16px;\nmargin-top: 30px;\npadding-left: 12px;"},
{k:["input"],t:"input — kiritish maydoni",d:"input — foydalanuvchi ma'lumot kiritadigan maydon. Bu yopuvchi tegsiz teg, xatti-harakatini type atributi belgilaydi.\n\nEng muhim turlari: text — oddiy matn; password — belgilar yashirin; email — pochta formatini tekshiradi; number — faqat raqam; checkbox — belgilash katagi; radio — bir nechtadan bittasini tanlash; date — sana; file — fayl yuklash.\n\nFoydali atributlar: placeholder — maydon ichidagi maslahat; required — to'ldirish majburiy; name — serverga yuboriladigan nom; value — boshlang'ich qiymat; id — label bilan bog'lash uchun.\n\nHar bir input yoniga label qo'shing: label for va input id bir xil bo'lsa, yorliq bosilganda maydon faollashadi. Inputlar odatda form ichida bo'ladi va button type=\"submit\" bilan yuboriladi.",c:"<form>\n <label for=\"em\">Email</label>\n <input id=\"em\" type=\"email\" name=\"email\" placeholder=\"you@mail.com\" required>\n <input type=\"password\" placeholder=\"Password\">\n <button type=\"submit\">Sign in</button>\n</form>"},
{k:["flex","justifycontent","alignitems"],t:"Flexbox",d:"Flexbox — elementlarni bir o'lchamda (qator yoki ustun) tizish va tekislash tizimi. Ota elementga display: flex beriladi, shundan so'ng bolalari avtomatik yonma-yon turadi.\n\nIkki o'q: asosiy o'q (standartda gorizontal) va ko'ndalang o'q (vertikal). justify-content asosiy o'q bo'yicha, align-items ko'ndalang o'q bo'yicha tekislaydi. flex-direction: column qilsangiz o'qlar almashadi.\n\nQiymatlar: center — o'rtaga; space-between — chetlarga, orasi teng; flex-end — oxiriga. flex-wrap: wrap — joy yetmasa yangi qatorga o'tkazadi. gap — elementlar orasidagi masofa.\n\nMashhur retsept: elementni o'rtaga qo'yish — display:flex; justify-content:center; align-items:center; va height berish. Moslashuvchan sayt uchun flex va @media birga ishlatiladi.",c:".row {\n display: flex;\n justify-content: space-between;\n align-items: center;\n flex-wrap: wrap;\n gap: 16px;\n}\n@media (max-width: 600px) {\n .row { flex-direction: column; }\n}"},
{k:["class","sinf","selektor","id"],t:"Selektorlar: teg, class, id",d:"Selektor — CSS ga qaysi elementni bezash kerakligini aytadi.\n\n1) Teg selektori (p, h1) — shu turdagi hamma elementga ta'sir qiladi.\n2) Class (sinf) — nuqta bilan yoziladi (.card). Bir class ni istalgancha elementga berish mumkin, bitta elementga bir nechta class ham mumkin: class=\"card big\". Eng ko'p ishlatiladigani shu.\n3) Id — # bilan yoziladi (#logo). Bitta id sahifada faqat bir marta bo'ladi.\n\nQoida: stil uchun asosan class ishlating, id ni havola yoki JavaScript uchun qoldiring. Ustuvorlik: id > class > teg. Nomlarni kichik harf va chiziqcha bilan yozing: .main-menu.",c:"p { color: gray; }\n.card { padding: 12px; }\n#logo { width: 80px; }\n\n<div id=\"logo\" class=\"card big\">"},
{k:["display","inline","block"],t:"display",d:"display elementning sahifada qanday joylashishini belgilaydi.\n\nblock — yangi qatordan boshlanadi, butun kenglikni egallaydi (div, p, h1). width, height, margin to'liq ishlaydi.\ninline — matn ichida turadi, faqat o'z mazmuni qadar joy oladi (span, a). width va height ishlamaydi.\ninline-block — qator ichida turadi, lekin width, height va padding ishlaydi; tugma va menyu bandlari uchun qulay.\nnone — element butunlay yashiriladi.\n\nEsda tuting: block — g'isht (ustma-ust), inline — so'z (yonma-yon), inline-block — o'lchamli so'z.",c:"span { display: block; }\na { display: inline-block; padding: 8px 14px; }\n.hidden { display: none; }"}];

ется (fit), затем предсказывает (predict) и оценивается."],"141":["Оценка модели","В классификации — точность (accuracy), precision и recall. В регрессии — MAE, RMSE. Не полагайтесь только на accuracy."],"142":["Overfitting (переобучение)","Модель заучивает обучающие данные и плохо работает на новых. Решение: больше данных, модель попроще, кросс-валидация."],"143":["Проект и портфолио","Возьмите открытые данные с Kaggle, проанализируйте и выложите результат с объяснением в Jupyter или на GitHub. Этика: защищайте личные данные."]},"en":{"0":["Browser","A program that loads and displays websites (Chrome, Safari). It reads HTML, CSS and JS."],"1":["Server","A computer that stores a website and sends it when the browser asks."],"2":["VS Code","A code editor. Useful extensions: Live Server, Prettier."],"3":["Files and folders","A website is a folder: index.html, style.css and an img/ folder."],"55":["Variables: let, const","Store data under a name. let can change, const cannot."],"56":["Function","A reusable block of code: name, parameters and return."],"57":["DOM and addEventListener","Find a page element with JS and react to an event (click)."],"58":["Array","Stores several values as a list. Indexing starts at 0."],"59":["if / else","Choose which code runs depending on a condition."],"4":["DOCTYPE","First line: tells the browser this is HTML5."],"5":["html","The main (root) tag; everything else goes inside it."],"6":["head","Service part: title, meta, CSS link. Not visible on the page."],"7":["body","The visible part of the page: text, images, buttons."],"8":["h1–h6","Headings. h1 is the main one (one per page), h6 is the smallest."],"9":["p","A paragraph of text."],"10":["strong","Bold, important text."],"11":["em","Italic text for emphasis."],"12":["br","Line break. No closing tag needed."],"13":["ul li","A bulleted list (ul) and its items (li)."],"14":["ol","Numbered list: 1, 2, 3…"],"15":["Leave a comment","A comment in code, not visible on the page. Shortcut: Ctrl+/"],"16":["a href","A link. href says where it leads."],"17":["img src alt","An image. src is the file address, alt is the description shown if the image fails to load."],"18":["table tr td th","A table. table is the whole table, tr a row, th a header cell, td a normal cell."],"19":["form","A form is a container for input fields; it sends data to the server."],"20":["input","An input field. The type is set with type: text, password, email, number, checkbox. placeholder is the hint inside the field. No closing tag needed."],"21":["button","A button. Inside a form it submits it (type=\"submit\")."],"22":["label","A field label. Clicking it activates the field (linked via for and id)."],"23":["Semantic tags","Tags that show the meaning of a block (not just a div). They help SEO and accessibility."],"24":["header","The top part of a site or section: logo, heading."],"25":["nav","A navigation block: a menu with links."],"26":["main","The main content of the page (only one per page)."],"27":["section","A thematic section of the page."],"28":["footer","The bottom part: contacts, copyright."],"29":["Linking CSS to HTML","Three ways: an external file (best), a style tag, a style attribute."],"30":["Selector: tag","Styles all tags of the same type."],"31":["Selector: class","Written with a dot in CSS. Can be applied to many elements."],"32":["Selector: id","A unique identifier, written with # in CSS. Only one per page."],"33":["color","Text color. Given by name, HEX or rgb."],"34":["font-size","Font size: px, rem, em."],"35":["font-family","The typeface, with fallback options."],"36":["font-weight","Font weight: 400 normal, 700 bold."],"37":["text-align","Text alignment: left, center, right."],"38":["line-height","Line height (the distance between lines)."],"39":["text-decoration","Underline or strikethrough. none removes the underline from a link."],"40":["Box model","Every element has 4 layers: content → padding → border → margin."],"41":["margin","Outer space: the distance to neighboring elements."],"42":["padding","Inner space: between the content and the border."],"43":["border","A border: thickness, style, color. border-radius rounds the corners."],"44":["width height","The width and height of an element."],"45":["display","Display type: block (full width), inline (within a line), inline-block (within a line, but with a size)."],"46":["background-color","Background color."],"47":["background-image","An image as the background. You will also need background-size: cover."],"48":["Flexbox","Give the parent display:flex; the children line up in a row and are easy to align."],"49":["justify-content","Alignment along the main (horizontal) axis: center, space-between, flex-end."],"50":["align-items","Alignment along the cross (vertical) axis: center, stretch."],"51":["flex-wrap","Allows elements to wrap onto a new line."],"52":["gap","The space between flex items."],"53":["Media queries @media","Styles that apply only when a condition is met, such as screen width. The basis of a responsive site."],"54":["Responsive page","A site that looks good on both phone and computer. The meta viewport tag is required."],"60":["git init","Creates a Git repository in the folder."],"61":["git add and commit","Stages your changes and saves them with a message."],"62":["git push and GitHub","Sends your code to GitHub (git pull downloads it)."],"63":["Node.js","An environment that runs JavaScript outside the browser, on a server."],"64":["npm","Node's package manager: installs libraries; settings live in package.json."],"65":["Express server","A popular web framework for Node: it creates routes."],"66":["Database","Data is stored in tables (rows and columns). Examples: PostgreSQL, MySQL, SQLite."],"67":["SQL SELECT","Reading data from a table. WHERE is the filter."],"68":["SQL INSERT","Adding a new row to a table."],"69":["React component","A reusable piece of the interface: a function that returns JSX."],"70":["useState","Stores a component's state; when it changes, the page updates."],"71":["props","Data passed into a component from outside."],"72":["What is Backend","The part of a site that runs on the server and that users don't see: logic, database, security."],"73":["Backend languages","Backend can be written in JavaScript (Node.js), Python, Java, PHP, Go and other languages."],"74":["Backend project structure","A project is split into folders: routes, controllers, models. This keeps code tidy."],"75":["HTTP methods","GET reads, POST creates, PUT/PATCH updates, DELETE deletes."],"76":["Status codes","The result of a server response: 200 OK, 201 Created, 400 bad request, 401 unauthorized, 404 not found, 500 server error."],"77":["REST API","Clear rules of URLs and methods for resources (users, posts). The response usually comes back as JSON."],"78":["Route parameters","The variable part of a URL (:id) and query parameters (?page=2)."],"79":["Middleware","A function that runs between request and response: logging, checks, reading JSON. next() passes control on."],"80":["JSON response and body","Data sent with POST is in req.body; res.json() returns JSON."],"81":["SQL UPDATE and DELETE","UPDATE changes an existing row, DELETE removes it. Don't forget WHERE, or every row will change!"],"82":["JOIN","Combines two tables by a shared column."],"83":["Working with a database from Node.js","Queries are sent to PostgreSQL through the pg library. Always use parameters like $1 for values."],"84":["Hashing a password","A password is never stored in plain form. bcrypt turns it into an irreversible hash."],"85":["JWT token","After login the server issues a signed token; the client sends it with every request."],"86":["Protected route","Auth middleware checks the token; if it's invalid it returns 401."],"87":["CORS","Browsers usually block requests coming from another domain. CORS defines which sites are allowed."],"88":[".env and secrets","Don't put passwords and keys in code: keep them in a .env file and add it to .gitignore."],"89":["SQL injection and validation","Never put user input directly into a query: validate it and use parameterized queries."],"90":["try/catch and async errors","Catch errors in async functions with try/catch and pass them to next(err)."],"91":["Error middleware","A function with 4 parameters catches all errors in one place."],"92":["API testing","With Jest and supertest you can test endpoints automatically."],"93":["Deploy","Putting the backend on a server on the internet: Render, Railway, VPS. Take the port from an environment variable."],"94":["Docker","Packs the app and its environment into a container, so it runs the same everywhere."],"95":["CI/CD and logs","On push to Git, tests and deploy run automatically (GitHub Actions). Watch errors through logs."],"96":["What is cybersecurity","The field of protecting data, systems and networks from unauthorized access, theft and damage."],"97":["Types of threats","The most common threats: malware, phishing, password theft, DDoS and insider mistakes."],"98":["Risk and layers of defense","Risk = threat × vulnerability × impact. Protection is not a single layer but many (defense in depth)."],"99":["Strong password","A long (12+ characters), unique password is best. Use a separate one for each site."],"100":["Password manager","Keeps all passwords in an encrypted vault and generates unique ones. You only remember one master password."],"101":["2FA and passkey","Two-step verification protects your account even if the password is stolen. An app or key is better than SMS."],"102":["Phishing","A fraudster tries to get your password and card details through a fake email, SMS or website."],"103":["Social engineering","Tricking the person, not the technology: gaining trust so the victim reveals the needed information themselves."],"104":["Checking links and files","Check the address before you click. Don't open suspicious files; if needed, scan them on VirusTotal."],"105":["Network basics","An IP address identifies a device, a port identifies a service. HTTP → 80, HTTPS → 443, SSH → 22."],"106":["Firewall and VPN","A firewall filters incoming and outgoing traffic with rules. A VPN encrypts traffic and protects you on open Wi-Fi."],"107":["HTTPS and TLS","TLS encrypts data and verifies the server with a certificate. Data over plain HTTP can be intercepted."],"108":["Types of encryption","Symmetric uses one key (AES). Asymmetric uses a public and private key pair (RSA). Never give anyone your private key."],"109":["Hash","A hash is an irreversible fingerprint of data. Use bcrypt/argon2 for passwords; MD5 and SHA-1 are outdated."],"110":["Digital signature and certificate","A signature confirms a document is unchanged and who it came from. A certificate is issued by a trusted authority (CA)."],"111":["OWASP Top 10","A list of the most dangerous web application vulnerabilities (owasp.org). Every developer should know it."],"112":["Injection and defense","When user input gets executed as a command, that's injection. Defense: parameterized queries and input validation."],"113":["XSS and CSRF","XSS is a foreign script on your page; defense: escape output, CSP. CSRF is a forged request in the user's name; defense: CSRF token, SameSite cookie."],"114":["Updates and dependencies","Old software and libraries have known vulnerabilities. Update and audit them regularly."],"115":["Backup","To protect against ransomware and mistakes, use the 3-2-1 rule: 3 copies, 2 kinds of media, 1 stored elsewhere."],"116":["Principle of least privilege","Give users and programs only the permissions they need. This limits the damage if they are compromised."],"117":["Incident response","If you suspect an attack: stop it, isolate, find the cause, recover and draw conclusions."],"118":["Logs and monitoring","Record login attempts and errors: unusual activity is spotted early. Never store passwords in logs."],"119":["A career in cybersecurity","Paths: SOC analyst, security engineer, pentester (only with permission!), DevSecOps. There are legal platforms to practice on."],"120":["What is Data Science","The field of drawing useful conclusions and predictions from data: it combines statistics, programming and domain knowledge."],"121":["Workflow","Typical steps: ask a question, collect data, clean, analyze, build a model, present the result."],"122":["Tools","The most popular language is Python. Libraries: NumPy, Pandas, Matplotlib, scikit-learn. Environment: Jupyter Notebook."],"123":["Python basics","A variable, a list and a dictionary (dict) are the basis of working with data."],"124":["Loop and function","A for loop goes through elements; a function lets you reuse code."],"125":["List comprehension","A way to create or filter a list in a single line."],"126":["NumPy array","An array for fast numeric computation. Operations apply to the whole array at once."],"127":["Indexing and filtering","Getting the part of an array you need by index or by condition."],"128":["Statistical functions","Mean, median and standard deviation give an overview of the data."],"129":["DataFrame and reading","A table in Pandas is a DataFrame. We read it from a CSV file and look at the first rows."],"130":["Selecting and filtering","Selecting a column by name and rows by condition."],"131":["groupby and sorting","Calculating per group (for example, average price by city) and sorting."],"132":["Missing values","Data often has empty (NaN) spots: find them, then remove or fill them."],"133":["Duplicates and types","Removing duplicate rows and fixing a column's type."],"134":["Outlier","A value that differs sharply from the rest may be an error or an important case. Find the cause first."],"135":["Matplotlib chart","Basic charts: line, bar, histogram. Always add a title and axis labels."],"136":["Choosing a chart type","Over time: line; comparison: bar; distribution: histogram; relationship: scatter."],"137":["Seaborn and correlation","Seaborn makes attractive charts. Correlation is the relationship between two variables (from -1 to 1). Correlation is not causation!"],"138":["What is Machine Learning","A model learns patterns from data by itself. Kinds: supervised (answers given) and unsupervised (no answers) learning."],"139":["Train/Test split","We split the data in two to test the model on data it hasn't seen. Otherwise the result is misleading."],"140":["First model","Linear regression: the model is trained (fit), then predicts (predict) and is evaluated."],"141":["Evaluating a model","For classification: accuracy, precision and recall. For regression: MAE, RMSE. Don't rely on accuracy alone."],"142":["Overfitting","The model memorizes the training data and does poorly on new data. Fixes: more data, a simpler model, cross-validation."],"143":["Project and portfolio","Take open data from Kaggle, analyze it, and publish the result with an explanation in Jupyter or on GitHub. Ethics: protect personal data."]},"zh":{"0":["浏览器","加载并显示网站的程序（Chrome、Safari），能读取 HTML、CSS 和 JS。"],"1":["服务器","存储网站并在浏览器请求时发送的计算机。"],"2":["VS Code","代码编辑器。常用扩展：Live Server、Prettier。"],"3":["文件和文件夹","网站就是一个文件夹：index.html、style.css 和 img/ 文件夹。"],"55":["变量：let、const","用名称保存数据。let 可以修改，const 不可修改。"],"56":["函数","可重复使用的代码块：名称、参数和 return。"],"57":["DOM 与 addEventListener","用 JS 找到页面元素并响应事件（点击）。"],"58":["数组（array）","把多个值存成列表。索引从 0 开始。"],"59":["if / else","根据条件选择执行哪段代码。"],"4":["DOCTYPE","第一行：告诉浏览器这是 HTML5。"],"5":["html","根标签，其余所有内容都在它里面。"],"6":["head","功能部分：title、meta、引入 CSS。页面上不可见。"],"7":["body","页面的可见部分：文字、图片、按钮。"],"8":["h1–h6","标题。h1 是主标题（每页一个），h6 最小。"],"9":["p","文本段落。"],"10":["strong","粗体、重要的文字。"],"11":["em","斜体文字，用于强调。"],"12":["br","换行。不需要结束标签。"],"13":["ul li","无序列表（ul）及其列表项（li）。"],"14":["ol","有序列表：1、2、3…"],"15":["添加注释","代码中的注释，页面上不可见。快捷键：Ctrl+/"],"16":["a href","链接。href 指明跳转到哪里。"],"17":["img src alt","图片。src 是文件地址，alt 是图片加载失败时显示的描述。"],"18":["table tr td th","表格。table 是整个表格，tr 是行，th 是表头单元格，td 是普通单元格。"],"19":["form","表单是输入框的容器，会把数据发送到服务器。"],"20":["input","输入框。用 type 选择类型：text、password、email、number、checkbox。placeholder 是框内的提示。不需要结束标签。"],"21":["button","按钮。在表单内点击会提交表单（type=\"submit\"）。"],"22":["label","字段标签。点击它会激活对应输入框（通过 for 和 id 关联）。"],"23":["语义标签","表明区块含义的标签（而不是普通 div），有助于 SEO 和易用性。"],"24":["header","网站或区块的顶部：标志、标题。"],"25":["nav","导航区块：带链接的菜单。"],"26":["main","页面的主要内容（每页只有一个）。"],"27":["section","页面中的主题章节。"],"28":["footer","底部：联系方式、版权信息。"],"29":["将 CSS 引入 HTML","三种方式：外部文件（最佳）、style 标签、style 属性。"],"30":["选择器：标签","为所有相同类型的标签设置样式。"],"31":["选择器：class（类）","在 CSS 中以点号书写，可用于多个元素。"],"32":["选择器：id","唯一标识符，在 CSS 中以 # 书写，每页只能有一个。"],"33":["color","文字颜色。可用名称、HEX 或 rgb 指定。"],"34":["font-size","字体大小：px、rem、em。"],"35":["font-family","字体类型，附带备用字体。"],"36":["font-weight","字重：400 常规，700 粗体。"],"37":["text-align","文本对齐：left、center、right。"],"38":["line-height","行高（行与行之间的距离）。"],"39":["text-decoration","下划线或删除线。none 可去掉链接的下划线。"],"40":["Box model","每个元素有 4 层：content → padding → border → margin。"],"41":["margin","外边距：与相邻元素之间的距离。"],"42":["padding","内边距：内容与边框之间的空间。"],"43":["border","边框：粗细、样式、颜色。border-radius 用于圆角。"],"44":["width height","元素的宽度和高度。"],"45":["display","显示类型：block（占满整行）、inline（行内）、inline-block（行内，但可设置尺寸）。"],"46":["background-color","背景颜色。"],"47":["background-image","把图片设为背景。还需要 background-size: cover。"],"48":["Flexbox","给父元素设置 display:flex，子元素排成一行，方便对齐。"],"49":["justify-content","沿主轴（水平）对齐：center、space-between、flex-end。"],"50":["align-items","沿交叉轴（垂直）对齐：center、stretch。"],"51":["flex-wrap","允许元素换行显示。"],"52":["gap","flex 元素之间的间距。"],"53":["Media queries @media","仅在满足条件（如屏幕宽度）时生效的样式，是自适应网站的基础。"],"54":["自适应页面","在手机和电脑上都好用的网站。需要 meta viewport 标签。"],"60":["git init","在文件夹中创建 Git 仓库。"],"61":["git add 与 commit","暂存更改并附带说明保存。"],"62":["git push 与 GitHub","把代码推送到 GitHub（git pull 用于下载）。"],"63":["Node.js","让 JavaScript 在浏览器之外、在服务器上运行的环境。"],"64":["npm","Node 的包管理器：安装库，配置保存在 package.json 中。"],"65":["Express 服务器","Node 的热门 Web 框架：用来创建路由（route）。"],"66":["数据库","数据存储在表中（行和列）。例如：PostgreSQL、MySQL、SQLite。"],"67":["SQL SELECT","从表中读取数据。WHERE 是过滤条件。"],"68":["SQL INSERT","向表中添加新行。"],"69":["React 组件","界 TTP → 80，HTTPS → 443，SSH → 22。"],"106":["防火墙与 VPN","防火墙按规则过滤进出流量。VPN 加密流量，在公共 Wi-Fi 上保护你。"],"107":["HTTPS 与 TLS","TLS 加密数据，并通过证书验证服务器。明文 HTTP 中的数据可能被截获。"],"108":["加密类型","对称加密使用一个密钥（AES）。非对称加密使用公钥和私钥一对（RSA）。私钥绝不能给任何人。"],"109":["哈希（Hash）","哈希是数据的不可逆“指纹”。密码请使用 bcrypt/argon2，MD5 和 SHA-1 已过时。"],"110":["数字签名与证书","签名证明文档未被修改并确认其来源。证书由受信任的机构（CA）签发。"],"111":["OWASP Top 10","Web 应用中最危险漏洞的清单（owasp.org），每个开发者都应了解。"],"112":["注入与防护","用户输入被当作命令执行就是注入（injection）。防护：参数化查询并校验输入。"],"113":["XSS 与 CSRF","XSS 是外来脚本进入页面；防护：转义输出、CSP。CSRF 是以用户名义发出的伪造请求；防护：CSRF 令牌、SameSite cookie。"],"114":["更新与依赖","旧的程序和库存在已知漏洞。请定期更新并检查。"],"115":["备份（backup）","为防勒索软件和误操作，遵循 3-2-1 原则：3 份副本、2 种介质、1 份异地保存。"],"116":["最小权限原则","只给用户和程序必需的权限。这样被攻破时损失更小。"],"117":["事件响应","怀疑遭到攻击时：停止、隔离、查明原因、恢复并总结经验。"],"118":["日志与监控","记录登录尝试和错误，可以及早发现异常行为。不要在日志中保存密码。"],"119":["网络安全职业","方向：SOC 分析师、安全工程师、渗透测试员（必须获得授权！）、DevSecOps。有合法的平台可供练习。"],"120":["什么是数据科学","从数据中得出有用结论和预测的领域：结合统计学、编程和行业知识。"],"121":["工作流程","典型步骤：提出问题、收集数据、清洗、分析、建模、展示结果。"],"122":["工具","最流行的语言是 Python。库：NumPy、Pandas、Matplotlib、scikit-learn。环境：Jupyter Notebook。"],"123":["Python 基础","变量、列表（list）和字典（dict）是处理数据的基础。"],"124":["循环与函数","for 循环遍历元素，函数让代码可以重复使用。"],"125":["列表推导式","一行代码创建或过滤列表的方法。"],"126":["NumPy 数组","用于快速数值计算的数组（array）。运算会一次作用于整个数组。"],"127":["索引与过滤","按索引或条件取出数组中需要的部分。"],"128":["统计函数","平均数、中位数和标准差可以概括数据的整体情况。"],"129":["DataFrame 与读取","Pandas 中的表格叫 DataFrame。从 CSV 文件读取并查看前几行。"],"130":["选择与过滤","按名称选择列，按条件选择行。"],"131":["groupby 与排序","按组计算（例如各城市平均价格）并排序。"],"132":["缺失值","数据里常有空值（NaN）：需要找出来，删除或填充。"],"133":["重复项与类型","删除重复行并修正列的类型。"],"134":["异常值（outlier）","与其他值差异极大的数值可能是错误，也可能是重要情况。先弄清原因。"],"135":["Matplotlib 图表","基本图表：折线图、柱状图、直方图。务必写上标题和坐标轴名称。"],"136":["选择图表类型","随时间变化用折线图，比较用柱状图，分布用直方图，关系用散点图（scatter）。"],"137":["Seaborn 与相关性","Seaborn 能画出美观的图表。相关性表示两个变量的关联（-1 到 1）。相关不等于因果！"],"138":["什么是机器学习","模型自己从数据中学习规律。类型：有监督学习（有答案）和无监督学习（无答案）。"],"139":["Train/Test 划分","把数据分成两份，用模型没见过的数据来检验。否则结果会有误导性。"],"140":["第一个模型","线性回归：模型先训练（fit），再预测（predict），最后评估。"],"141":["模型评估","分类看准确率（accuracy） ar a la persona, no a la tecnología: ganarse la confianza para que ella misma revele la información."],"104":["Comprobar enlaces y archivos","Mira la dirección antes de hacer clic. No abras archivos sospechosos; si hace falta, compruébalos en VirusTotal."],"105":["Fundamentos de redes","La dirección IP identifica el dispositivo y el puerto el servicio. HTTP → 80, HTTPS → 443, SSH → 22."],"106":["Firewall y VPN","Un firewall filtra el tráfico de entrada y salida con reglas. Una VPN cifra el tráfico y protege en Wi-Fi abierto."],"107":["HTTPS y TLS","TLS cifra los datos y verifica el servidor con un certificado. En HTTP sin cifrar los datos pueden interceptarse."],"108":["Tipos de cifrado","El simétrico usa una sola clave (AES). El asimétrico usa un par de clave pública y privada (RSA). Nunca entregues tu clave privada."],"109":["Hash","Un hash es una huella irreversible de los datos. Para contraseñas usa bcrypt/argon2; MD5 y SHA-1 están obsoletos."],"110":["Firma digital y certificado","La firma confirma que el documento no ha cambiado y quién lo envió. El certificado lo emite una entidad de confianza (CA)."],"111":["OWASP Top 10","La lista de las vulnerabilidades más peligrosas en aplicaciones web (owasp.org). Todo desarrollador debería conocerla."],"112":["Injection y defensa","Cuando lo que escribe el usuario se ejecuta como comando, es injection. Defensa: consultas parametrizadas y validar la entrada."],"113":["XSS y CSRF","XSS es un script ajeno en la página; defensa: escapar la salida, CSP. CSRF es una solicitud falsa en nombre del usuario; defensa: token CSRF, cookie SameSite."],"114":["Actualizaciones y dependencias","El software y las librerías antiguos tienen vulnerabilidades conocidas. Actualiza y revisa con regularidad."],"115":["Copia de seguridad (backup)","Para protegerte de ransomware y errores, la regla 3-2-1: 3 copias, 2 tipos de soporte, 1 en otro lugar."],"116":["Principio de mínimo privilegio","Da a usuarios y programas solo los permisos necesarios. Así se reduce el daño si son comprometidos."],"117":["Respuesta a incidentes","Si sospechas un ataque: detenerlo, aislar, hallar la causa, recuperar y sacar conclusiones."],"118":["Logs y monitorización","Registra los intentos de acceso y los errores: la actividad inusual se detecta pronto. No guardes contraseñas en los logs."],"119":["Una carrera en ciberseguridad","Rutas: analista SOC, ingeniero de seguridad, pentester (¡solo con permiso!), DevSecOps. Hay plataformas legales para practicar."],"120":["Qué es Data Science","El campo de sacar conclusiones y predicciones útiles a partir de datos: une estadística, programación y conocimiento del área."],"121":["Flujo de trabajo","Pasos habituales: plantear la pregunta, recopilar datos, limpiar, analizar, construir un modelo, presentar el resultado."],"122":["Herramientas","El lenguaje más popular es Python. Librerías: NumPy, Pandas, Matplotlib, scikit-learn. Entorno: Jupyter Notebook."],"123":["Fundamentos de Python","Variable, lista (list) y diccionario (dict): la base para trabajar con datos."],"124":["Bucle y función","El bucle for recorre los elementos; la función permite reutilizar código."],"125":["List comprehension","Una forma de crear o filtrar una lista en una sola línea."],"126":["Arreglo de NumPy","Un arreglo (array) para cálculos numéricos rápidos. Las operaciones se aplican a todo el arreglo a la vez."],"127":["Indexación y filtro","Obtener la parte necesaria del arreglo por índice o por condición."],"128":["Funciones estadísticas","La media, la mediana y la desviación estándar dan una visión general de los datos."],"129":["DataFrame y lectura","En Pandas, una tabla es un DataFrame. Leemos de un archivo CSV y vemos las primeras filas."],"130":["Selección y filtrado","Elegir una columna por nombre y filas por condición."],"131":["groupby y ordenación","Calcular por grupos (por ejemplo, precio medio por ciudad) y ordenar."],"132":["Valores faltantes","Los datos tienen huecos vacíos (NaN): hay que encont .kd-fix{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(transparent,var(--bg) 40%);display:flex;justify-content:center}
.kd-fix .kd-btn{max-width:520px}
body:has(#v-fold:not([hidden]) .kd-ch) #bn{display:none}
/* заставка после выбора */
.kd-wait{position:fixed;inset:0;z-index:450;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:kdFade .3s both;text-align:center;padding:20px}
.kd-wait h3{margin:0;font-size:22px}.kd-wait .lb{width:200px;height:12px;border-radius:8px;background:var(--lk);overflow:hidden}.kd-wait .lb i{display:block;height:100%;width:0;background:var(--g);border-radius:8px;animation:kdLoad 1.5s ease-in-out forwards}
/* экран урока */
#kdp{position:fixed;inset:0;z-index:420;background:var(--bg);display:flex;flex-direction:column;animation:kdUp .35s cubic-bezier(.2,.9,.3,1) both}
#kdp[hidden]{display:none}
.kp-top{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 8px;max-width:640px;width:100%;margin:0 auto}
.kp-x{flex:none;border:0;background:none;color:var(--mu);cursor:pointer;padding:4px;display:grid;place-items:center}
.kp-x svg{width:30px;height:30px;stroke:currentColor;stroke-width:3;stroke-linecap:round;fill:none}
.kp-bar{flex:1;height:16px;border-radius:10px;background:var(--lk);overflow:hidden;position:relative}
.kp-bar i{display:block;height:100%;width:0;border-radius:10px;background:var(--g);transition:width .5s cubic-bezier(.3,1.2,.4,1);position:relative}
.kp-bar i:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.kp-hp{flex:none;display:flex;align-items:center;gap:4px;color:var(--r);font-weight:800;font-size:18px}
.kp-hp .e{font-size:22px;display:inline-block}.kp-hp.hit .e{animation:kdShake .5s}
.kp-body{flex:1;overflow:auto;max-width:640px;width:100%;margin:0 auto;padding:10px 18px 190px;-webkit-overflow-scrolling:touch}
.kp-step{animation:kdSlideIn .4s cubic-bezier(.2,1,.4,1) both}
.kp-tag{display:flex;align-items:center;gap:8px;color:#c07cff;font-weight:800;letter-spacing:.8px;font-size:14px;text-transform:uppercase;margin:10px 0 6px}
.kp-tag.q{color:var(--b)}.kp-tag.m{color:var(--y)}
.kp-q{font-size:clamp(21px,5.4vw,26px);font-weight:800;line-height:1.3;margin:2px 0 18px}
.kp-say{display:flex;align-items:flex-end;gap:8px;margin-bottom:20px}
.kp-say .bub{position:relative;flex:1;border:2px solid var(--bd);border-radius:18px;padding:14px 16px;background:var(--card);font-size:18px;line-height:1.45}
.kp-say .bub:before{content:"";position:absolute;left:-9px;bottom:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--bd);border-bottom:2px solid var(--bd);transform:rotate(45deg)}
.kp-say .bub b{display:block;font-size:20px;margin-bottom:4px}
.kp-card{border:2px solid var(--bd);border-radius:20px;background:var(--card);padding:18px 18px 16px;margin-bottom:6px}
.kp-card h3{margin:0 0 6px;font-size:26px;color:var(--b);letter-spacing:-.3px}
.kp-card p{margin:0 0 12px;font-size:17px;line-height:1.5}
.kp-card pre{margin:0;padding:12px 14px;border-radius:14px;background:var(--cb,#100814);color:var(--ct,#e0b9f6);font-size:14.5px;line-height:1.55;overflow:auto;white-space:pre-wrap;word-break:break-word}
.kp-code{margin:0 0 18px;padding:14px 16px;border-radius:16px;background:var(--cb,#100814);color:var(--ct,#e0b9f6);font-size:15px;line-height:1.55;overflow:auto;white-space:pre-wrap;word-break:break-word;border:2px solid var(--bd)}
.kp-o{display:flex;align-items:center;gap:12px;border:2px solid var(--bd);border-bottom-width:5px;border-radius:16px;padding:14px 16px;margin-bottom:12px;cursor:pointer;background:var(--card);font-size:16.5px;line-height:1.4;transition:transform .1s,border-color .15s,background .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.kp-o:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:15px}
.kp-o .n{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--bd);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--mu)}
.kp-o.sel{border-color:var(--b);background:color-mix(in srgb,var(--b) 14%,var(--card))}.kp-o.sel .n{border-color:var(--b);color:var(--b)}
.kp-o.ok{border-color:var(--g);background:color-mix(in srgb,var(--g) 16%,var(--card));animation:kdPulse .5s}
.kp-o.no{border-color:var(--r);background:color-mix(in srgb,var(--r) 14%,var(--card));animation:kdShake .5s}
.kp-o.lockd{pointer-events:none}
/* сборка кода */
.kp-line{min-height:58px;border-bottom:2px solid var(--bd);border-top:2px solid var(--bd);padding:8px 2px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px;background:repeating-linear-gradient(transparent 0 54px,var(--bd) 54px 56px)}
.kp-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.kp-t{border:2px solid var(--bd);border-bottom-width:4px;border-radius:13px;padding:9px 14px;font:600 16px/1.2 ui-monospace,Menlo,Consolas,monospace;background:var(--card);cursor:pointer;user-select:none;animation:kdPop .3s cubic-bezier(.2,1.5,.4,1) both;-webkit-tap-highlight-color:transparent}
.kp-t:active{transform:translateY(2px)}
.kp-t.ghost{visibility:hidden}
.kp-t.ok{border-color:var(--g);color:var(--okTx)}.kp-t.no{border-color:var(--r);color:var(--noTx);animation:kdShake .5s}
/* пары */
.kp-mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp-m{border:2px solid var(--bd);border-bottom-width:5px;border-radius:14px;padding:12px 10px;text-align:center;font-size:14.5px;line-height:1.3;min-height:64px;display:grid;place-items:center;cursor:pointer;background:var(--card);transition:all .15s;user-select:none;animation:kdPop .4s cubic-bezier(.2,1.4,.4,1) both}
.kp-m.sel{border-color:var(--b);background:color-mix(in srgb,var(--b) 16%,var(--card))}
.kp-m.ok{border-color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--card));opacity:.45;pointer-events:none}
.kp-m.no{border-color:var(--r);animation:kdShake .45s}
/* нижняя панель */
.kp-ft{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px);border-top:2px solid var(--bd);background:var(--bg);transition:background .25s,transform .35s cubic-bezier(.2,1,.4,1)}
.kp-ft .in{max-width:640px;margin:0 auto}
.kp-ft.ok{background:var(--sheetOk);border-color:transparent;animation:kdSheet .35s cubic-bezier(.2,1,.4,1)}
.kp-ft.no{background:var(--sheetNo);border-color:transparent;animation:kdSheet .35s cubic-bezier(.2,1,.4,1)}
.kp-fb{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.kp-fb .ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:24px;font-weight:900;animation:kdPop .45s cubic-bezier(.2,1.8,.4,1)}
.kp-ft.ok .ic{color:var(--g)}.kp-ft.no .ic{color:var(--r)}
.kp-fb b{display:block;font-size:21px}.kp-ft.ok b{color:var(--okTx)}.kp-ft.no b{color:var(--noTx)}
.kp-fb span{display:block;font-size:15px;line-height:1.4;margin-top:2px;max-height:22vh;overflow:auto}.kp-ft.ok span{color:var(--okTx)}.kp-ft.no span{color:var(--noTx)}
.kp-ft .kd-btn.g{background:var(--g)}
.kp-ft.no .kd-btn.g{background:var(--r);box-shadow:0 5px 0 var(--rs)}
/* финиш */
.kp-end{text-align:center;padding-top:6vh;position:relative}
.kp-end h2{font-size:28px;margin:10px 0 4px;color:var(--y);animation:kdPop .6s .2s cubic-bezier(.2,1.5,.4,1) both}
.kp-end p.sub{color:var(--mu);margin:0 0 22px}
.kp-stats{display:flex;gap:10px;justify-content:center;margin:20px 0}
.kp-sc{flex:1;max-width:140px;border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--card);animation:kdSlide .5s cubic-bezier(.2,1,.4,1) both;animation-delay:calc(.4s + var(--i)*.12s)}
.kp-sc small{display:block;background:var(--c);color:#fff;font-weight:800;font-size:12px;letter-spacing:.8px;padding:5px 0;text-transform:uppercase}
.kp-sc b{display:block;font-size:24px;padding:12px 4px;color:var(--c)}
#kdconf{position:fixed;inset:0;z-index:600;pointer-events:none}
.kd-mod{position:fixed;inset:0;z-index:610;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:kdFade .2s both}
.kd-mod>div{width:min(520px,100%);background:var(--bg);border-radius:26px 26px 0 0;padding:26px 22px calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;animation:kdUp .35s cubic-bezier(.2,1,.4,1) both;border:2px solid var(--bd);border-bottom:0}
.kd-mod h3{margin:10px 0 6px;font-size:22px}.kd-mod p{margin:0 0 20px;color:var(--mu)}
/* маскот */
.kd-masc{display:block;overflow:visible;transform-origin:50% 92%;animation:kdBlob 3s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(148,0,234,.28))}
.kd-masc .e-h,.kd-masc .e-s,.kd-masc .e-w,.kd-masc .m-h,.kd-masc .m-s,.kd-masc .m-w,.kd-masc .tr{display:none}
.kd-masc .e-n{transform-box:fill-box;transform-origin:50% 55%;animation:kdBlink2 3.8s infinite}
.kd-masc[data-m=happy]{animation:kdJump .85s cubic-bezier(.3,0,.3,1) infinite}
.kd-masc[data-m=happy] .e-n{display:none}.kd-masc[data-m=happy] .e-h,.kd-masc[data-m=happy] .m-h{display:inline}
.kd-masc[data-m=sad]{animation:kdSob 1.3s ease-in-out infinite}
.kd-masc[data-m=sad] .e-n{display:none}.kd-masc[data-m=sad] .e-s,.kd-masc[data-m=sad] .m-s,.kd-masc[data-m=sad] .tr{display:inline}
.kd-masc[data-m=wow]{animation:kdWow .9s ease-in-out infinite}
.kd-masc[data-m=wow] .e-n{display:none}.kd-masc[data-m=wow] .e-w,.kd-masc[data-m=wow] .m-w{display:inline}
.kd-masc .t1,.kd-masc .t2,.kd-masc .t3,.kd-masc .t4{opacity:0;animation:kdTear 1.1s ease-in infinite}
.kd-masc .t2{animation-delay:.25s}.kd-masc .t3{animation-delay:.55s}.kd-masc .t4{animation-delay:.8s}
.kp-mc{flex:none;margin:-8px 0 -6px}
/* анимации */
@keyframes kdPop{from{opacity:0;transform:translateX(var(--x,0px)) scale(.3)}to{opacity:1;transform:translateX(var(--x,0px)) scale(1)}}
.kd-opt,.kd-bub,.kp-t,.kp-m,.kp-sc,.kp-fb .ic,.kd-opt.sel .ck{--x:0px}
@keyframes kdSlide{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes kdSlideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes kdDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
@keyframes kdUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes kdFade{from{opacity:0}to{opacity:1}}
@keyframes kdSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kdBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-7px)}}
@keyframes kdRing{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.28);opacity:0}}
@keyframes kdShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes kdWig{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(7deg)}30%{transform:rotate(-5deg)}40%{transform:rotate(0)}}
@keyframes kdPulse{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes kdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes kdBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes kdBlink2{0%,88%,100%{transform:scaleY(1)}91%{transform:scaleY(.07)}94%{transform:scaleY(1)}96%{transform:scaleY(.07)}98%{transform:scaleY(1)}}
@keyframes kdBlob{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-3%) scale(.97,1.05)}50%{transform:translateY(0) scale(1.05,.95)}75%{transform:translateY(-1.5%) scale(.99,1.02)}}
@keyframes kdJump{0%,100%{transform:translateY(0) scale(1.08,.9)}30%{transform:translateY(-16%) scale(.94,1.1)}55%{transform:translateY(0) scale(1.08,.9)}70%{transform:translateY(-6%) scale(.98,1.03)}}
@keyframes kdSob{0%,100%{transform:translateY(0) scale(1.03,.96) rotate(0)}20%{transform:translateY(1%) scale(1.05,.94) rotate(-2deg)}40%{transform:translateY(0) scale(1.03,.96) rotate(2deg)}60%{transform:translateY(1%) scale(1.05,.94) rotate(-2deg)}80%{transform:translateY(0) scale(1.03,.96) rotate(1.5deg)}}
@keyframes kdWow{0%,100%{transform:scale(1)}50%{transform:scale(1.08,1.04)}}
@keyframes kdTear{0%{transform:translateY(-4px);opacity:0}15%{opacity:1}100%{transform:translateY(20px);opacity:0}}
@keyframes kdFlame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.14) rotate(3deg)}}
@keyframes kdLoad{to{width:100%}}
@media(prefers-reduced-motion:reduce){.kd *,#kdp *,.kd-wait *{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

/* ===== Glass-кнопки v2: океан (голубой + мятный), быстрая аврора, реакция на нажатие ===== */
@keyframes gbSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes gbFlow{
 0%{background-position:0% 50%,100% 40%,30% 100%}
 50%{background-position:100% 30%,0% 80%,80% 0%}
 100%{background-position:20% 90%,90% 20%,0% 60%}}
@keyframes gbSweep{0%,12%{background-position:170% 0,0 0}58%,100%{background-position:-70% 0,0 0}}
@keyframes gbGlow{0%,100%{filter:saturate(1) brightness(.97)}50%{filter:saturate(1.12) brightness(1.04)}}
@keyframes gbJelly{0%{transform:scale(.94)}35%{transform:scale(1.07,.93)}60%{transform:scale(.97,1.05)}80%{transform:scale(1.015,.99)}100%{transform:scale(1)}}
@keyframes gbRip{from{transform:translate(-50%,-50%) scale(0);opacity:.85}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes gbRing{from{transform:translate(-50%,-50%) scale(0);opacity:1}to{transform:translate(-50%,-50%) scale(1);opacity:0}}

.kd-btn,.wi .bg,.kd-ban,.kd-bk,.kd-tk,.kd-ban button,.apk,
.pr button.pri,.pcard .prow .pr button.pri,.bar button,#c-chat .bar button{
 --k1:#f0338f;--k2:#b80e62;--k3:#9a3dea;--k4:#ff6aa8;--kt:#fff;
 --kg:rgba(240,50,140,.5);--rim:rgba(255,170,214,.38);--spd:4.2s;
 position:relative;isolation:isolate;overflow:hidden;
 background:var(--k2);color:var(--kt);
 -webkit-tap-highlight-color:transparent}

/* аврора: вращающийся конус цвета (быстро) */
.kd-btn::before,.wi .bg::before,.kd-ban::before,.kd-bk::before,.kd-tk::before,.kd-ban button::before,.apk::before,
.pr button.pri::before,.pcard .prow .pr button.pri::before,.bar button::before,#c-chat .bar button::before{
 content:"";position:absolute;left:50%;top:50%;width:max(260%,380px);aspect-ratio:1;z-index:-2;pointer-events:none;
 transform:translate(-50%,-50%);
 background:
  radial-gradient(circle 120px at 70% 50%,var(--k4),transparent),
  radial-gradient(circle 120px at 60% 67%,var(--k1),transparent),
  radial-gradient(circle 120px at 40% 67%,var(--k3),transparent),
  radial-gradient(circle 120px at 30% 50%,var(--k4),transparent),
  radial-gradient(circle 120px at 40% 33%,var(--k1),transparent),
  radial-gradient(circle 120px at 60% 33%,var(--k3),transparent);
 opacity:.95;animation:gbSpin var(--spd) linear infinite}

/* стекло: пятна, блик-проход, ободок */
.kd-btn::after,.wi .bg::after,.kd-ban::after,.kd-bk::after,.kd-tk::after,.kd-ban button::after,.apk::after,
.pr button.pri::after,.pcard .prow .pr button.pri::after,.bar button::after,#c-chat .bar button::after{
 content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;
 background:
  linear-gradient(110deg,transparent 40%,rgba(255,190,225,.26) 50%,transparent 60%),
  radial-gradient(60% 120% at 50% 130%,rgba(255,120,190,.22),transparent 70%),
  linear-gradient(180deg,rgba(255,200,230,.14),rgba(255,255,255,0) 45%);
 background-size:260% 100%,100% 100%,100% 100%;background-repeat:no-repeat;
 box-shadow:inset 0 0 0 1.5px var(--rim),inset 0 8px 14px -10px rgba(255,190,225,.3);
 animation:gbSweep 2.6s cubic-bezier(.5,0,.3,1) infinite}

.kd-btn{
 border-radius:999px;padding:17px 24px;min-height:56px;border:0;
 text-shadow:0 1px 3px rgba(70,0,40,.5);
 box-shadow:0 10px 24px -10px var(--kg);
 transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;
 animation:gbGlow 2.8s ease-in-out infinite}
.kd-btn.g,.kp-ft .kd-btn.g{background:var(--k2);color:var(--kt);box-shadow:0 12px 28px -8px var(--kg)}

/* нажатие: сжатие, ускорение авроры, вспышка */
.kd-btn:active,.wi:active .bg,.kd-bk:active,.kd-tk:active,.apk:active,.kd-ban button:active,
.pr button.pri:active,.bar button:active,#c-chat .bar button:active{--spd:.9s}
.kd-btn:active{transform:scale(.94);filter:brightness(1.08) saturate(1.15);box-shadow:0 4px 16px -4px var(--kg),0 0 18px 0 var(--kg)}
.kd-btn.g:active{box-shadow:0 4px 16px -4px var(--kg),0 0 18px 0 var(--kg)}
.kd-btn.jelly,.kd-bk.jelly,.kd-tk.jelly,.apk.jelly,.pr button.pri.jelly,.bar button.jelly{animation:gbJelly .55s cubic-bezier(.3,1.4,.5,1)}
.wi .bg.jelly{animation:gbJelly .55s cubic-bezier(.3,1.4,.5,1)}

/* волна от места касания */
.gbr{position:absolute;z-index:-1;pointer-events:none;border-radius:50%;left:0;top:0;width:var(--s,260px);height:var(--s,260px);
 background:radial-gradient(circle,rgba(255,170,215,.5) 0,rgba(255,120,190,.2) 40%,transparent 68%);animation:gbRip .75s cubic-bezier(.2,.7,.3,1) forwards}
.gbr.ring{background:none;border:2px solid rgba(255,170,215,.7);box-shadow:0 0 12px rgba(255,80,160,.6);animation:gbRing .6s cubic-bezier(.2,.8,.3,1) .05s forwards}

/* кнопка в карточке урока: светлее остальных, но розовая */
.kd-btn:not(.g):not(.sec):not(.rd):not(.dis):not(.ln){--k1:#ff4fa3;--k2:#d4237a;--k3:#b04cf0;--k4:#ff86bd;--spd:5s}

/* стеклянная прозрачная (ЧИТАТЬ КОНСПЕКТ) */
.kd-btn.sec{
 --k1:rgba(240,51,143,.4);--k2:rgba(150,10,85,.62);--k3:rgba(154,61,234,.4);--k4:rgba(255,106,168,.3);--kg:rgba(0,0,0,.4);--rim:rgba(255,170,214,.4);
 margin-top:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 22px -10px var(--kg)}
.kd-btn.sec::after{background:
  linear-gradient(110deg,transparent 40%,rgba(255,190,225,.2) 50%,transparent 60%),
  linear-gradient(180deg,rgba(255,200,230,.1),rgba(255,255,255,0) 45%);
 background-size:260% 100%,100% 100%;background-repeat:no-repeat}

/* красная: неверный ответ */
.kd-btn.rd,.kp-ft.no .kd-btn.g{
 --k1:#ff3b30;--k2:#c4122a;--k3:#ff7a1a;--k4:#ff6b5a;--kg:rgba(255,60,80,.6);background:var(--k2);box-shadow:0 12px 28px -8px var(--kg)}

/* неактивная: тихое стекло */
.kd-btn.dis{--k2:var(--lk);--kt:var(--mu);--rim:rgba(255,255,255,.14);background:var(--lk);box-shadow:none;text-shadow:none;animation:none;opacity:.92}
