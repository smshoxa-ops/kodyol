<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mu:#6b6f85;--ac:#6c5ce7;--ac2:#00b8d9;--bd:#e3e5f0;--cb:#12131c;--ct:#b9f6ca}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e17;--card:#171927;--tx:#eceefb;--mu:#8b90ab;--bd:#262940}}
:root[data-theme="dark"]{--bg:#0d0e17;--card:#171927;--tx:#eceefb;--mu:#8b90ab;--bd:#262940}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{padding:48px 20px 70px;text-align:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.hero h1{margin:0 0 6px;font-size:clamp(28px,6vw,46px);letter-spacing:-1px}
.hero p{margin:0;opacity:.9}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
.sb{margin:-30px auto 18px;max-width:640px;position:relative}
.sb input{width:100%;padding:18px 20px 18px 52px;border:0;border-radius:18px;font-size:18px;background:var(--card);color:var(--tx);box-shadow:0 10px 30px rgba(60,40,160,.25);outline:2px solid transparent}
.sb input:focus{outline-color:var(--ac)}
.sb span{position:absolute;left:19px;top:15px;font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.info{text-align:center;color:var(--mu);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;transition:transform .15s}
.c:hover{transform:translateY(-3px)}
.c h3{margin:0 0 4px;font:700 19px ui-monospace,Menlo,monospace;color:var(--ac)}
.b{display:inline-block;font-size:11px;background:var(--bd);color:var(--mu);padding:2px 9px;border-radius:99px;margin-bottom:8px}
.c p{margin:0 0 10px;font-size:14.5px}
pre{margin:0;background:var(--cb);color:var(--ct);padding:11px 12px;border-radius:10px;font:13px/1.5 ui-monospace,Menlo,monospace;overflow-x:auto}
.empty{text-align:center;color:var(--mu);padding:40px}
</style></head><body>
<div class="hero"><h1>💻 KodYol</h1><p>Full Stack · HTML + CSS · darslaringiz bo'yicha qo'llanma</p></div>
<div class="wrap">
<div class="sb"><span>🔍</span><input id="q" placeholder="Nimani tushuntiray? Masalan: input, flex, margin…" autocomplete="off"></div>
<div class="chips" id="ch"></div>
<div class="info" id="in"></div>
<div class="grid" id="g"></div>
</div>
<script>

var D=[
"1|Brauzer|Saytlarni yuklab ko'rsatadigan dastur (Chrome, Safari). HTML, CSS va JS ni o'qiydi.|chrome, safari",

"4|Selektor: class (sinf)|CSS da nuqta bilan yoziladi. Ko'p elementga qo'llash mumkin.|.card { padding: 10px; }\n<div class=\"card\">",
"4|Selektor: id|Noyob identifikator, CSS da # bilan yoziladi. Sahifada bitta bo'ladi.|#logo { width: 100px; }\n<div id=\"logo\">",
"4|color|Matn rangi. Nom, HEX yoki rgb bilan beriladi.|color: #6c5ce7;",
"4|font-size|Shrift o'lchami: px, rem, em.|font-size: 18px;",
"4|font-family|Shrift turi, zaxira variantlar bilan.|font-family: Arial, sans-serif;",
"4|font-weight|Shrift qalinligi: 400 oddiy, 700 qalin.|font-weight: 700;",
"4|text-align|Matnni tekislash: left, center, right.|text-align: center;",

"4|text-decoration|Tagiga chizish yoki ustidan chizish. none havolaning tagidagi chiziqni olib tashlaydi.|a { text-decoration: none; }",
"5|Box model|Har bir elementda 4 qatlam bor: content → padding → border → margin.|margin: 20px;\npadding: 10px;\nborder: 1px solid #000;",
"5|margin|Tashqi bo'shliq — qo'shni elementlargacha masofa.|margin: 0 auto; /* o'rtaga */",

].map(function(s){var a=s.split("|");return{l:+a[0],t:a[1],d:a[2],c:a.slice(3).join("|")}});
