<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mu:#6b6f85;--ac:#2a9d0a;--ac2:#7be61c;--bd:#e3e5f0;--cb:#12131c;--ct:#b9f6ca}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e17;--card:#171927;--tx:#eceefb;--mu:#8b90ab;--bd:#262940}}
:root[data-theme="dark"]{--bg:#0d0e17;--card:#171927;--tx:#eceefb;--mu:#8b90ab;--bd:#262940}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{padding:48px 20px 70px;text-align:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.hero h1{margin:0 0 6px;font-size:clamp(28px,6vw,46px);letter-spacing:-1px}
.hero p{margin:0;opacity:.9}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
.sb{margin:-30px auto 18px;max-width:640px;position:relative}
.sb input{width:100%;padding:18px 20px 18px 52px;border:0;border-radius:18px;font-size:18px;background:var(--card);color:var(--tx);box-shadow:0 10px 30px rgba(60,40,160,.25);outline:2px solid transparent}
.sb input:focus{outline-color:var(--ac)}
.sb span{position:absolute;left:19px;top:15px;font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.info{text-align:center;color:var(--mu);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;transition:transform .15s}
.c:hover{transform:translateY(-3px)}
.c h3{margin:0 0 4px;font:700 19px ui-monospace,Menlo,monospace;color:var(--ac)}
.b{display:inline-block;font-size:11px;background:var(--bd);color:var(--mu);padding:2px 9px;border-radius:99px;margin-bottom:8px}
.c p{margin:0 0 10px;font-size:14.5px}
pre{margin:0;background:var(--cb);color:var(--ct);padding:11px 12px;border-radius:10px;font:13px/1.5 ui-monospace,Menlo,monospace;overflow-x:auto}
.empty{text-align:center;color:var(--mu);padding:40px}

main[hidden]{display:none}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);font-size:18px}
.mb{border:0;background:var(--bd);color:var(--tx);width:42px;height:42px;border-radius:12px;font-size:22px;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:30}
#ov.o{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;z-index:40;background:var(--card);padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:6px;transform:translateX(-105%);transition:.28s;box-shadow:8px 0 30px rgba(0,0,0,.3)}
#dr.o{transform:none}
.dh{font-size:22px;font-weight:800;margin-bottom:14px;color:var(--ac)}
#dr a{padding:14px;border-radius:12px;cursor:pointer;font-size:17px}
#dr a:hover{background:var(--bd)}
#dr .aiL{margin-top:auto;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;text-align:center}
.pg{padding-top:22px}.pg h3{color:var(--mu);font-size:14px;text-transform:uppercase;margin:24px 0 10px}
.lg{display:flex;gap:10px;flex-wrap:wrap}.lg .chip{padding:12px 18px;font-size:16px}
.bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;gap:8px;padding:10px 16px;background:var(--bg);border-top:1px solid var(--bd);max-width:980px;margin:0 auto}
.bar input{flex:1;padding:14px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;min-width:0}
.bar button{border:0;border-radius:14px;padding:0 20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;cursor:pointer}
.m{max-width:90%;padding:12px 15px;border-radius:18px;margin:10px 0;white-space:pre-wrap;font-size:15px;line-height:1.6}
.m.u{margin-left:auto;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.m.bt{background:var(--card);border:1px solid var(--bd)}
.m pre{margin-top:10px;white-space:pre}.m .lb{display:block;margin-top:12px;font-size:12px;color:var(--mu)}
.m .chip{margin:4px 4px 0 0}

.ac{display:flex;gap:6px;margin-top:10px}.ac button{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:13px}.ac button.on{border-color:var(--ac);color:var(--ac)}
.chip.bx{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;font-size:15px;border-radius:14px}.chip.ok{background:#1db954;color:#fff;border-color:#1db954}.chip.no{background:#e5484d;color:#fff;border-color:#e5484d}
.fc{min-height:220px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font:700 26px ui-monospace,Menlo,monospace;color:var(--ac);cursor:pointer;margin-bottom:14px}.fc div{font:15px/1.6 system-ui,sans-serif;color:var(--tx)}.fc pre{text-align:left;width:100%;margin-top:12px}
#ed{width:100%;height:190px;background:var(--cb);color:var(--ct);border:0;border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace}#fr{width:100%;height:280px;border:1px solid var(--bd);border-radius:12px;background:#fff}
.pb{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
#dr{overflow-y:auto}#dr a{padding:11px 14px!important}#mic{background:var(--bd)!important;color:var(--tx)}
details summary{cursor:pointer;color:var(--ac);font-weight:600;margin:6px 0}

body{padding-bottom:112px}body.nonav{padding-bottom:0}body.nonav #bn{display:none}#v-chat h2{display:none}
#bn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(92%,420px);z-index:25;display:flex;padding:7px;border-radius:38px;background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#bn button{flex:1;height:50px;border:0;background:none;color:var(--tx);border-radius:30px;display:grid;place-items:center;cursor:pointer;margin:0 2px}#bn button.on{background:var(--bd)}
#bn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));flex:none;overflow:hidden}
.pf{display:flex;align-items:center;gap:20px;margin:16px 0}.st{display:flex;gap:20px}.st b{display:block;font-size:20px}.st span{font-size:12.5px;color:var(--mu)}
.pr{display:flex;gap:8px;margin:14px 0}.pr button{flex:1;padding:11px;border:0;border-radius:12px;background:var(--bd);color:var(--tx);font-weight:600;cursor:pointer}.pr button.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.rw{display:flex;align-items:center;gap:14px;padding:10px 6px;cursor:pointer;border-radius:14px}.rw:hover{background:var(--bd)}.rw small{display:block;color:var(--mu)}
.fld{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--bd);padding:12px 0}.fld label{width:110px;font-size:14px;flex:none}.fld input,.fld textarea{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:16px system-ui,sans-serif;outline:0;resize:none}
.hd{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;margin-bottom:8px}.hd button{border:0;background:var(--bd);color:var(--tx);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}

/* Instagram-стиль: профиль и чат */
#c-me .pf,#c-user .pf{gap:22px;margin:14px 0 10px}
#c-me .pf>.av,#c-user .pf>.av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ac2),0 0 0 7px var(--ac)}
#c-me .st,#c-user .st{flex:1;justify-content:space-around;text-align:center;gap:8px}
#c-me .pr button,#c-user .pr button{border-radius:9px;padding:9px;font-size:14px}
#c-me .so{margin-top:10px}
#c-chat .hd{font-size:22px;letter-spacing:-.5px;margin:4px 0 10px}
#c-chat #thh{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--bg);z-index:5;padding:6px 0;border-bottom:1px solid var(--bd);font-size:16px}
#c-chat .rw{padding:9px 4px}#c-chat .rw b{font-weight:600}#c-chat .rw small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
#c-chat #cm{padding-bottom:8px}
#c-chat .m{border:0;border-radius:22px;padding:9px 14px;margin:3px 0;font-size:15px;line-height:1.4;animation:pop .18s ease-out}
#c-chat .m.bt{background:var(--bd);color:var(--tx);border-bottom-left-radius:6px}
#c-chat .m.u{border-bottom-right-radius:6px}
#c-chat .m .lb{display:inline-block;margin:0 0 0 10px;font-size:10.5px;opacity:.65;color:inherit}
#c-chat .m .chip{opacity:.6;background:none;border:0;color:inherit}
#c-chat .bar{border:1px solid var(--bd);border-radius:26px;margin:8px 16px calc(env(safe-area-inset-bottom,0px) + 8px);padding:5px 5px 5px 14px;max-width:calc(980px - 32px);position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--card)}
#c-chat .bar input{border:0;background:none;padding:8px 4px}#c-chat .bar input:focus{outline:0}
#c-chat .bar button{border-radius:20px;padding:0 18px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* чат: панель внизу, пузыри, статус прочтения */
#c-chat .bar{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;border:0;border-top:1px solid var(--bd);border-radius:0;background:var(--bg);z-index:22;align-items:center;gap:10px;padding:10px max(12px,calc((100vw - 980px)/2 + 16px)) calc(env(safe-area-inset-bottom,0px) + 10px)}
#c-chat .bar input{flex:1;border:1px solid var(--bd);background:var(--card);border-radius:24px;padding:12px 18px;font-size:16px}
#c-chat .bar input:focus{outline:2px solid var(--ac)}
#c-chat .bar button{width:64px;height:46px;padding:0;border-radius:999px;background:#2faa08;display:grid;place-items:center;flex:none}
#c-chat .bar button:active{transform:scale(.94)}
#c-chat #cm{padding-bottom:96px}
#c-chat .m{width:fit-content;font-size:17px;padding:10px 18px;border-radius:24px;margin:4px 0}
#c-chat .m.u{background:#2faa08;color:#fff}
#c-chat .m.bt{background:var(--bd)}
#c-chat .m .lb{display:none}
#c-chat .m .chip{display:none;margin:0 0 0 8px;padding:0 4px;font-size:14px;opacity:.85}
#c-chat .m.sel .chip{display:inline-block}
.tsp{text-align:center;color:var(--mu);font-size:13px;margin:16px 0 6px}
.seen{text-align:right;color:var(--mu);font-size:13px;margin:2px 8px 0}
#c-chat .m.u{margin-left:auto}
#c-chat .mr{display:flex;align-items:flex-end;gap:8px;margin:4px 0}
#c-chat .mr .m{margin:0;max-width:calc(100% - 46px)}

/* ===== Папка FULL STACK и меню уроков ===== */
.fw{display:flex;flex-direction:column;align-items:center;margin:-36px auto 0;padding-bottom:20px}
.fold{position:relative;width:min(70vw,230px);aspect-ratio:1;border:0;border-radius:36px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(145deg,var(--ac),var(--ac2));box-shadow:0 18px 44px rgba(80,60,200,.38),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s,box-shadow .2s;animation:flt 3.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.fold:hover{transform:translateY(-4px) scale(1.03)}
.fold:active{transform:scale(.96);animation:none}
.fold svg{width:46%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.fold b{font-size:clamp(17px,4.6vw,22px);letter-spacing:2px;font-weight:800}
.fold.cy b{font-size:clamp(14px,3.8vw,18px);letter-spacing:1px}
.fold small{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.fcap{margin-top:16px;color:var(--mu);font-size:14px}
.fg{display:flex;flex-direction:column;align-items:center;margin-bottom:30px}
.fold.fe{background:linear-gradient(145deg,#00b894,#0984e3);box-shadow:0 18px 44px rgba(9,132,227,.35),inset 0 1px 0 rgba(255,255,255,.35);animation-delay:-1.8s}
.fold.be{background:linear-gradient(145deg,#ff9f43,#ee5253);box-shadow:0 18px 44px rgba(238,82,83,.35),inset 0 1px 0 rgba(255,255,255,.35);animation-delay:-.9s}
.fold.cy{background:linear-gradient(145deg,#e84393,#2a9d0a);box-shadow:0 18px 44px rgba(232,67,147,.35),inset 0 1px 0 rgba(255,255,255,.35);animation-delay:-2.7s}
.fold.ds{background:linear-gradient(145deg,#f9ca24,#f0932b);box-shadow:0 18px 44px rgba(240,147,43,.35),inset 0 1px 0 rgba(255,255,255,.35);animation-delay:-3.4s}
.fold.ds b{font-size:clamp(15px,4vw,20px);letter-spacing:1px}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cl{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.ls{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;color:var(--tx);font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.ls:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(60,40,160,.15)}
.ls:active{transform:scale(.98)}
.ls .n{flex:none;width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px}
.ls .tx{flex:1;min-width:0}
.ls .tx small{display:block;color:var(--ac);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.ls .tx b{display:block;font-size:17px;line-height:1.3;margin:1px 0 2px}
.ls .tx span{color:var(--mu);font-size:13px}
.ls .pb{height:6px;margin-top:8px}
.ls .ar{flex:none;font-style:normal;font-size:26px;color:var(--mu)}
.ls.off{opacity:.55;cursor:default}.ls.off:hover{transform:none;box-shadow:none}
.lw{padding-top:22px}
#v-lessons .sb{margin:6px auto 18px}
#v-lessons .chips{display:none}
#v-lessons .hd,#v-course .hd{font-size:20px}

/* ===== Анимации (v17) ===== */
@keyframes vin{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0;transform:translateY(34px) scale(.85)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes cin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes rp{to{transform:scale(3.4);opacity:0}}
@keyframes zoomout{0%{transform:scale(1)}40%{transform:scale(.92)}100%{transform:scale(1.35);opacity:0}}
@keyframes dn{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}100%{transform:none}}
@keyframes shine{0%{transform:translateX(-130%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}
@keyframes hg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
main:not([hidden])>.wrap{animation:vin .38s cubic-bezier(.2,.8,.2,1)}
.hero{background-size:220% 220%;animation:hg 9s ease-in-out infinite}
.hero h1{animation:fin .7s .05s both}.hero p{animation:cin .7s .25s both}
.fg{animation:fin .65s cubic-bezier(.2,.9,.3,1.2) both}
.fg:nth-child(1){animation-delay:.05s}.fg:nth-child(2){animation-delay:.15s}.fg:nth-child(3){animation-delay:.25s}.fg:nth-child(4){animation-delay:.35s}.fg:nth-child(5){animation-delay:.45s}
.fold{overflow:hidden}
.fold::after{content:"";position:absolute;top:0;left:0;width:34%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-130%) skewX(-20deg);pointer-events:none}
.fold:hover::after{animation:shine .9s ease}
.fold svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.fold:hover svg{transform:scale(1.12) rotate(-5deg)}
.fold.pop{animation:zoomout .28s ease-in forwards}
.ls{position:relative;overflow:hidden;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.ls:hover .ar{transform:translateX(5px);color:var(--ac)}.ls .ar{transition:transform .2s,color .2s}
.ls:hover .n{transform:scale(1.08) rotate(-4deg)}.ls .n{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.cl .ls:nth-child(1){animation-delay:.04s}.cl .ls:nth-child(2){animation-delay:.09s}.cl .ls:nth-child(3){animation-delay:.14s}.cl .ls:nth-child(4){animation-delay:.19s}.cl .ls:nth-child(5){animation-delay:.24s}.cl .ls:nth-child(6){animation-delay:.29s}.cl .ls:nth-child(7){animation-delay:.34s}.cl .ls:nth-child(8){animation-delay:.39s}.cl .ls:nth-child(9){animation-delay:.44s}.cl .ls:nth-child(10){animation-delay:.49s}.cl .ls:nth-child(11){animation-delay:.54s}
.grid>.c{animation:cin .4s cubic-bezier(.2,.8,.2,1) both}
.grid>.c:nth-child(1){animation-delay:.02s}.grid>.c:nth-child(2){animation-delay:.06s}.grid>.c:nth-child(3){animation-delay:.10s}.grid>.c:nth-child(4){animation-delay:.14s}.grid>.c:nth-child(5){animation-delay:.18s}.grid>.c:nth-child(6){animation-delay:.22s}.grid>.c:nth-child(n+7){animation-delay:.26s}
.c{transition:transform .2s,box-shadow .2s,border-color .2s}.c:hover{box-shadow:0 12px 28px rgba(60,40,160,.16);border-color:var(--ac)}
.pb i{animation:grow .9s .2s cubic-bezier(.2,.8,.2,1) both}
.chip{transition:transform .15s,background .2s,color .2s,border-color .2s}.chip:hover{transform:translateY(-2px)}.chip:active{transform:scale(.93)}
.ac button{transition:transform .15s}.ac button:active{transform:scale(.88)}.ac button.on{animation:dn .45s ease}
#bn button{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}#bn button:active{transform:scale(.85)}#bn button.on{transform:translateY(-3px) scale(1.12)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;animation:rp .6s ease-out forwards}
.ls .rp{background:rgba(108,92,231,.25)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== Стеклянные иконки меню (iOS-стиль) ===== */

.gi{position:relative;flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;overflow:hidden;
background:linear-gradient(145deg,var(--g1),var(--g2));
border:1px solid rgba(255,255,255,.45);

box-shadow:0 6px 14px var(--gs,rgba(60,40,160,.28)),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -8px 14px rgba(255,255,255,.08),inset 0 0 0 .5px rgba(255,255,255,.25);

{k:["boxmodel","boxsizing"],t:"Box Model (quti modeli)",d:"Brauzer har bir HTML elementni to'rtburchak quti deb hisoblaydi. Quti 4 qatlamdan iborat:\n\n1) Content — haqiqiy mazmun (matn, rasm); o'lchami width va height bilan beriladi.\n2) Padding — mazmun va ramka orasidagi ichki bo'shliq; fon rangi shu joyni ham bo'yaydi.\n3) Border — padding atrofidagi ramka.\n4) Margin — ramkadan tashqaridagi shaffof bo'shliq, qo'shni elementlarni itaradi.\n\nMuhim tuzoq: standart holatda width faqat mazmun enini bildiradi, padding va border unga qo'shiladi. Masalan 300px + 40px padding + 4px border = 344px. Shuning uchun deyarli har bir loyihada box-sizing: border-box yoziladi, shunda width ichiga padding va border ham kiradi.\n\nKo'p uchraydigan xatolar: margin va padding ni adashtirish; margin: 0 auto faqat block elementda va aniq width bo'lganda o'rtaga qo'yadi; vertikal margin lar ba'zan qo'shilmaydi, kattasi olinadi (margin collapse).\n\nTekshirish: sahifada o'ng tugma → Inspect → Computed bo'limida rangli quti chizmasi ko'rinadi.",c:"* { box-sizing: border-box; }\n.card {\n width: 300px;\n padding: 20px;\n border: 2px solid #2a9d0a;\n margin: 16px auto;\n}"},
{k:["margin","padding"],t:"Margin va Padding farqi",d:"Margin — elementdan TASHQARIDAGI bo'shliq, padding — elementning ICHIDAGI bo'shliq. O'xshatish: rasm ramkasi. Rasm — content, rasm bilan ramka orasidagi oq qog'oz — padding, ramka — border, ramkalar orasidagi devor — margin.\n\nYozish usullari: margin: 10px — to'rt tomonga; margin: 10px 20px — tepa-past 10, chap-o'ng 20; margin: 5px 10px 15px 20px — soat mili bo'yicha (tepa, o'ng, past, chap). Bitta tomon uchun margin-top, padding-left va hokazo.\n\nQachon nimani ishlatish: elementlarni bir-biridan uzoqlashtirish kerak bo'lsa — margin; tugma yoki karta ichidagi matn ramkaga yopishib qolmasin desangiz — padding. Fon rangi faqat padding gacha bo'yaydi, margin doim shaffof.",c:"margin: 10px 20px;\npadding: 8px 16px;\nmargin-top: 30px;\npadding-left: 12px;"},
{k:["input"],t:"input — kiritish maydoni",d:"input — foydalanuvchi ma'lumot kiritadigan maydon. Bu yopuvchi tegsiz teg, xatti-harakatini type atributi belgilaydi.\n\nEng muhim turlari: text — oddiy matn; password — belgilar yashirin; email — pochta formatini tekshiradi; number — faqat raqam; checkbox — belgilash katagi; radio — bir nechtadan bittasini tanlash; date — sana; file — fayl yuklash.\n\nFoydali atributlar: placeholder — maydon ichidagi maslahat; required — to'ldirish majburiy; name — serverga yuboriladigan nom; value — boshlang'ich qiymat; id — label bilan bog'lash uchun.\n\nHar bir input yoniga label qo'shing: label for va input id bir xil bo'lsa, yorliq bosilganda maydon faollashadi. Inputlar odatda form ichida bo'ladi va button type=\"submit\" bilan yuboriladi.",c:"<form>\n <label for=\"em\">Email</label>\n <input id=\"em\" type=\"email\" name=\"email\" placeholder=\"you@mail.com\" required>\n <input type=\"password\" placeholder=\"Password\">\n <button type=\"submit\">Sign in</button>\n</form>"},
{k:["flex","justifycontent","alignitems"],t:"Flexbox",d:"Flexbox — elementlarni bir o'lchamda (qator yoki ustun) tizish va tekislash tizimi. Ota elementga display: flex beriladi, shundan so'ng bolalari avtomatik yonma-yon turadi.\n\nIkki o'q: asosiy o'q (standartda gorizontal) va ko'ndalang o'q (vertikal). justify-content asosiy o'q bo'yicha, align-items ko'ndalang o'q bo'yicha tekislaydi. flex-direction: column qilsangiz o'qlar almashadi.\n\nQiymatlar: center — o'rtaga; space-between — chetlarga, orasi teng; flex-end — oxiriga. flex-wrap: wrap — joy yetmasa yangi qatorga o'tkazadi. gap — elementlar orasidagi masofa.\n\nMashhur retsept: elementni o'rtaga qo'yish — display:flex; justify-content:center; align-items:center; va height berish. Moslashuvchan sayt uchun flex va @media birga ishlatiladi.",c:".row {\n display: flex;\n justify-content: space-between;\n align-items: center;\n flex-wrap: wrap;\n gap: 16px;\n}\n@media (max-width: 600px) {\n .row { flex-direction: column; }\n}"},
{k:["class","sinf","selektor","id"],t:"Selektorlar: teg, class, id",d:"Selektor — CSS ga qaysi elementni bezash kerakligini aytadi.\n\n1) Teg selektori (p, h1) — shu turdagi hamma elementga ta'sir qiladi.\n2) Class (sinf) — nuqta bilan yoziladi (.card). Bir class ni istalgancha elementga berish mumkin, bitta elementga bir nechta class ham mumkin: class=\"card big\". Eng ko'p ishlatiladigani shu.\n3) Id — # bilan yoziladi (#logo). Bitta id sahifada faqat bir marta bo'ladi.\n\nQoida: stil uchun asosan class ishlating, id ni havola yoki JavaScript uchun qoldiring. Ustuvorlik: id > class > teg. Nomlarni kichik harf va chiziqcha bilan yozing: .main-menu.",c:"p { color: gray; }\n.card { padding: 12px; }\n#logo { width: 80px; }\n\n<div id=\"logo\" class=\"card big\">"},
{k:["display","inline","block"],t:"display",d:"display elementning sahifada qanday joylashishini belgilaydi.\n\nblock — yangi qatordan boshlanadi, butun kenglikni egallaydi (div, p, h1). width, height, margin to'liq ishlaydi.\ninline — matn ichida turadi, faqat o'z mazmuni qadar joy oladi (span, a). width va height ishlamaydi.\ninline-block — qator ichida turadi, lekin width, height va padding ishlaydi; tugma va menyu bandlari uchun qulay.\nnone — element butunlay yashiriladi.\n\nEsda tuting: block — g'isht (ustma-ust), inline — so'z (yonma-yon), inline-block — o'lchamli so'z.",c:"span { display: block; }\na { display: inline-block; padding: 8px 14px; }\n.hidden { display: none; }"}];

e to neighboring elements."],"42":["padding","Inner space: between the content and the border."],"43":["border","A border: thickness, style, color. border-radius rounds the corners."],"44":["width height","The width and height of an element."],"45":["display","Display type: block (full width), inline (within a line), inline-block (within a line, but with a size)."],"46":["background-color","Background color."],"47":["background-image","An image as the background. You will also need background-size: cover."],"48":["Flexbox","Give the parent display:flex; the children line up in a row and are easy to align."],"49":["justify-content","Alignment along the main (horizontal) axis: center, space-between, flex-end."],"50":["align-items","Alignment along the cross (vertical) axis: center, stretch."],"51":["flex-wrap","Allows elements to wrap onto a new line."],"52":["gap","The space between flex items."],"53":["Media queries @media","Styles that apply only when a condition is met, such as screen width. The basis of a responsive site."],"54":["Responsive page","A site that looks good on both phone and computer. The meta viewport tag is required."],"60":["git init","Creates a Git repository in the folder."],"61":["git add and commit","Stages your changes and saves them with a message."],"62":["git push and GitHub","Sends your code to GitHub (git pull downloads it)."],"63":["Node.js","An environment that runs JavaScript outside the browser, on a server."],"64":["npm","Node's package manager: installs libraries; settings live in package.json."],"65":["Express server","A popular web framework for Node: it creates routes."],"66":["Database","Data is stored in tables (rows and columns). Examples: PostgreSQL, MySQL, SQLite."],"67":["SQL SELECT","Reading data from a table. WHERE is the filter."],"68":["SQL INSERT","Adding a new row to a table."],"69":["React component","A reusable piece of the interface: a function that returns JSX."],"70":["useState","Stores a component's state; when it changes, the page updates."],"71":["props","Data passed into a component from outside."],"72":["What is Backend","The part of a site that runs on the server and that users don't see: logic, database, security."],"73":["Backend languages","Backend can be written in JavaScript (Node.js), Python, Java, PHP, Go and other languages."],"74":["Backend project structure","A project is split into folders: routes, controllers, models. This keeps code tidy."],"75":["HTTP methods","GET reads, POST creates, PUT/PATCH updates, DELETE deletes."],"76":["Status codes","The result of a server response: 200 OK, 201 Created, 400 bad request, 401 unauthorized, 404 not found, 500 server error."],"77":["REST API","Clear rules of URLs and methods for resources (users, posts). The response usually comes back as JSON."],"78":["Route parameters","The variable part of a URL (:id) and query parameters (?page=2)."],"79":["Middleware","A function that runs between request and response: logging, checks, reading JSON. next() passes control on."],"80":["JSON response and body","Data sent with POST is in req.body; res.json() returns JSON."],"81":["SQL UPDATE and DELETE","UPDATE changes an existing row, DELETE removes it. Don't forget WHERE, or every row will change!"],"82":["JOIN","Combines two tables by a shared column."],"83":["Working with a database from Node.js","Queries are sent to PostgreSQL through the pg library. Always use parameters like $1 for values."],"84":["Hashing a password","A password is never stored in plain form. bcrypt turns it into an irreversible hash."],"85":["JWT token","After login the server issues a signed token; the client sends it with every request."],"86":["Protected route","Auth middleware checks the token; if it's invalid it returns 401."],"87":["CORS","Browsers usually block requests coming from another domain. CORS defines which sites are allowed."],"88":[".env and secrets","Don't put passwords and keys in code: keep them in a .env file and add it to .gitignore."],"89":["SQL injection and validation","Never put user input directly into a query: validate it and use parameterized queries."],"90":["try/catch and async errors","Catch errors in async functions with try/catch and pass them to next(err)."],"91":["Error middleware","A function with 4 parameters catches all errors in one place."],"92":["API testing","With Jest and supertest you can test endpoints automatically."],"93":["Deploy","Putting the backend on a server on the internet: Render, Railway, VPS. Take the port from an environment variable."],"94":["Docker","Packs the app and its environment into a container, so it runs the same everywhere."],"95":["CI/CD and logs","On push to Git, tests and deploy run automatically (GitHub Actions). Watch errors through logs."],"96":["What is cybersecurity","The field of protecting data, systems and networks from unauthorized access, theft and damage."],"97":["Types of threats","The most common threats: malware, phishing, password theft, DDoS and insider mistakes."],"98":["Risk and layers of defense","Risk = threat × vulnerability × impact. Protection is not a single layer but many (defense in depth)."],"99":["Strong password","A long (12+ characters), unique password is best. Use a separate one for each site."],"100":["Password manager","Keeps all passwords in an encrypted vault and generates unique ones. You only remember one master password."],"101":["2FA and passkey","Two-step verification protects your account even if the password is stolen. An app or key is better than SMS."],"102":["Phishing","A fraudster tries to get your password and card details through a fake email, SMS or website."],"103":["Social engineering","Tricking the person, not the technology: gaining trust so the victim reveals the needed information themselves."],"104":["Checking links and files","Check the address before you click. Don't open suspicious files; if needed, scan them on VirusTotal."],"105":["Network basics","An IP address identifies a device, a port identifies a service. HTTP → 80, HTTPS → 443, SSH → 22."],"106":["Firewall and VPN","A firewall filters incoming and outgoing traffic with rules. A VPN encrypts traffic and protects you on open Wi-Fi."],"107":["HTTPS and TLS","TLS encrypts data and verifies the server with a certificate. Data over plain HTTP can be intercepted."],"108":["Types of encryption","Symmetric uses one key (AES). Asymmetric uses a public and private key pair (RSA). Never give anyone your private key."],"109":["Hash","A hash is an irreversible fingerprint of data. Use bcrypt/argon2 for passwords; MD5 and SHA-1 are outdated."],"110":["Digital signature and certificate","A signature confirms a document is unchanged and who it came from. A certificate is issued by a trusted authority (CA)."],"111":["OWASP Top 10","A list of the most dangerous web application vulnerabilities (owasp.org). Every developer should know it."],"112":["Injection and defense","When user input gets executed as a command, that's injection. Defense: parameterized queries and input validation."],"113":["XSS and CSRF","XSS is a foreign script on your page; defense: escape output, CSP. CSRF is a forged request in the user's name; defense: CSRF token, SameSite cookie."],"114":["Updates and dependencies","Old software and libraries have known vulnerabilities. Update and audit them regularly."],"115":["Backup","To protect against ransomware and mistakes, use the 3-2-1 rule: 3 copies, 2 kinds of media, 1 stored elsewhere."],"116":["Principle of least privilege","Give users and programs only the permissions they need. This limits the damage if they are compromised."],"117":["Incident response","If you suspect an attack: stop it, isolate, find the cause, recover and draw conclusions."],"118":["Logs and monitoring","Record login attempts and errors: unusual activity is spotted early. Never store passwords in logs."],"119":["A career in cybersecurity","Paths: SOC analyst, security engineer, pentester (only with permission!), DevSecOps. There are legal platforms to practice on."],"120":["What is Data Science","The field of drawing useful conclusions and predictions from data: it combines statistics, programming and domain knowledge."],"121":["Workflow","Typical steps: ask a question, collect data, clean, analyze, build a model, present the result."],"122":["Tools","The most popular language is Python. Libraries: NumPy, Pandas, Matplotlib, scikit-learn. Environment: Jupyter Notebook."],"123":["Python basics","A variable, a list and a dictionary (dict) are the basis of working with data."],"124":["Loop and function","A for loop goes through elements; a function lets you reuse code."],"125":["List comprehension","A way to create or filter a list in a single line."],"126":["NumPy array","An array for fast numeric computation. Operations apply to the whole array at once."],"127":["Indexing and filtering","Getting the part of an array you need by index or by condition."],"128":["Statistical functions","Mean, median and standard deviation give an overview of the data."],"129":["DataFrame and reading","A table in Pandas is a DataFrame. We read it from a CSV file and look at the first rows."],"130":["Selecting and filtering","Selecting a column by name and rows by condition."],"131":["groupby and sorting","Calculating per group (for example, average price by city) and sorting."],"132":["Missing values","Data often has empty (NaN) spots: find them, then remove or fill them."],"133":["Duplicates and types","Removing duplicate rows and fixing a column's type."],"134":["Outlier","A value that differs sharply from the rest may be an error or an important case. Find the cause first."],"135":["Matplotlib chart","Basic charts: line, bar, histogram. Always add a title and axis labels."],"136":["Choosing a chart type","Over time: line; comparison: bar; distribution: histogram; relationship: scatter."],"137":["Seaborn and correlation","Seaborn makes attractive charts. Correlation is the relationship between two variables (from -1 to 1). Correlation is not causation!"],"138":["What is Machine Learning","A model learns patterns from data by itself. Kinds: supervised (answers given) and unsupervised (no answers) learning."],"139":["Train/Test split","We split the data in two to test the model on data it hasn't seen. Otherwise the result is misleading."],"140":["First model","Linear regression: the model is trained (fit), then predicts (predict) and is evaluated."],"141":["Evaluating a model","For classification: accuracy, precision and recall. For regression: MAE, RMSE. Don't rely on accuracy alone."],"142":["Overfitting","The model memorizes the training data and does poorly on new data. Fixes: more data, a simpler model, cross-validation."],"143":["Project and portfolio","Take open data from Kaggle, analyze it, and publish the result with an explanation in Jupyter or on GitHub. Ethics: protect personal data."]},"zh":{"0":["浏览器","加载并显示网站的程序（Chrome、Safari），能读取 HTML、CSS 和 JS。"],"1":["服务器","存储网站并在浏览器请求时发送的计算机。"],"2":["VS Code","代码编辑器。常用扩展：Live Server、Prettier。"],"3":["文件和文件夹","网站就是一个文件夹：index.html、style.css 和 img/ 文件夹。"],"55":["变量：let、const","用名称保存数据。let 可以修改，const 不可修改。"],"56":["函数","可重复使用的代码块：名称、参数和 return。"],"57":["DOM 与 addEventListener","用 JS 找到页面元素并响应事件（点击）。"],"58":["数组（array）","把多个值存成列表。索引从 0 开始。"],"59":["if / else","根据条件选择执行哪段代码。"],"4":["DOCTYPE","第一行：告诉浏览器这是 HTML5。"],"5":["html","根标签，其余所有内容都在它里面。"],"6":["head","功能部分：title、meta、引入 CSS。页面上不可见。"],"7":["body","页面的可见部分：文字、图片、按钮。"],"8":["h1–h6","标题。h1 是主标题（每页一个），h6 最小。"],"9":["p","文本段落。"],"10":["strong","粗体、重要的文字。"],"11":["em","斜体文字，用于强调。"],"12":["br","换行。不需要结束标签。"],"13":["ul li","无序列表（ul）及其列表项（li）。"],"14":["ol","有序列表：1、2、3…"],"15":["添加注释","代码中的注释，页面上不可见。快捷键：Ctrl+/"],"16":["a href","链接。href 指明跳转到哪里。"],"17":["img src alt","图片。src 是文件地址，alt 是图片加载失败时显示的描述。"],"18":["table tr td th","表格。table 是整个表格，tr 是行，th 是表头单元格，td 是普通单元格。"],"19":["form","表单是输入框的容器，会把数据发送到服务器。"],"20":["input","输入框。用 type 选择类型：text、password、email、number、c ar a la persona, no a la tecnología: ganarse la confianza para que ella misma revele la información."],"104":["Comprobar enlaces y archivos","Mira la dirección antes de hacer clic. No abras archivos sospechosos; si hace falta, compruébalos en VirusTotal."],"105":["Fundamentos de redes","La dirección IP identifica el dispositivo y el puerto el servicio. HTTP → 80, HTTPS → 443, SSH → 22."],"106":["Firewall y VPN","Un firewall filtra el tráfico de entrada y salida con reglas. Una VPN cifra el tráfico y protege en Wi-Fi abierto."],"107":["HTTPS y TLS","TLS cifra los datos y verifica el servidor con un certificado. En HTTP sin cifrar los datos pueden interceptarse."],"108":["Tipos de cifrado","El simétrico usa una sola clave (AES). El asimétrico usa un par de clave pública y privada (RSA). Nunca entregues tu clave privada."],"109":["Hash","Un hash es una huella irreversible de los datos. Para contraseñas usa bcrypt/argon2; MD5 y SHA-1 están obsoletos."],"110":["Firma digital y certificado","La firma confirma que el documento no ha cambiado y quién lo envió. El certificado lo emite una entidad de confianza (CA)."],"111":["OWASP Top 10","La lista de las vulnerabilidades más peligrosas en aplicaciones web (owasp.org). Todo desarrollador debería conocerla."],"112":["Injection y defensa","Cuando lo que escribe el usuario se ejecuta como comando, es injection. Defensa: consultas parametrizadas y validar la entrada."],"113":["XSS y CSRF","XSS es un script ajeno en la página; defensa: escapar la salida, CSP. CSRF es una solicitud falsa en nombre del usuario; defensa: token CSRF, cookie SameSite."],"114":["Actualizaciones y dependencias","El software y las librerías antiguos tienen vulnerabilidades conocidas. Actualiza y revisa con regularidad."],"115":["Copia de seguridad (backup)","Para protegerte de ransomware y errores, la regla 3-2-1: 3 copias, 2 tipos de soporte, 1 en otro lugar."],"116":["Principio de mínimo privilegio","Da a usuarios y programas solo los permisos necesari itverlauf: Linie; Vergleich: Balken; Verteilung: Histogramm; Zusammenhang: Scatter."],"137":["Seaborn und Korrelation","Seaborn erstellt schöne Diagramme. Korrelation ist der Zusammenhang zweier Variablen (von -1 bis 1). Korrelation ist nicht Ursache!"],"138":["Was ist Machine Learning","Ein Modell lernt Muster selbst aus Daten. Arten: überwachtes (mit Antworten) und unüberwachtes (ohne Antworten) Lernen."],"139":["Train/Test-Aufteilung","Wir teilen die Daten in zwei Teile, um das Modell an unbekannten Daten zu prüfen. Sonst ist das Ergebnis trügerisch."],"140":["Erstes Modell","Lineare Regression: Das Modell wird trainiert (fit), sagt dann voraus (predict) und wird bewertet."],"141":["Modellbewertung","Bei Klassifikation: Genauigkeit (accuracy), Precision und Recall. Bei Regression: MAE, RMSE. Nicht nur auf accuracy verlassen."],"142":["Overfitting (Überanpassung)","Das Modell lernt die Trainingsdaten auswendig und arbeitet mit neuen Daten schlecht. Lösung: mehr Daten, einfacheres Modell, Kreuzvalidierung."],"143":["Projekt und Portfolio","Nimm offene Daten von Kaggle, analysiere sie und veröffentliche das Ergebnis mit Erklärung in Jupyter oder auf GitHub. Ethik: persönliche Daten schützen."]}};

  ft("no",'<div class="kp-fb">'+mascot(58,"sad","kp-mc")+'<div><b>'+esc(L.no)+'</b><span>'+esc(L.right)+' '+esc(answer)+'</span></div></div><button class="kd-btn g" id="kpMain">'+esc(L.nx)+'</button>');
  $("kpMain").onclick=function(){P.i++;if(P.hearts<=0)return dead();next()}}
 setBar()}
function dead(){
 var L=t();$("kpBody").innerHTML='<div class="kp-end">'+mascot(130,"sad")+'<h2 style="color:var(--r)">'+esc(L.dead)+'</h2><p class="sub">'+esc(L.deadP)+'</p></div>';

function quitAsk(){
 var L=t(),m=document.createElement("div");m.className="kd-mod";
 m.innerHTML='<div>'+mascot(96,"sad")+'<h3>'+esc(L.quitT)+'</h3><p>'+esc(L.quitP)+'</p><button class="kd-btn g" id="mS">'+esc(L.stay)+'</button><button class="kd-btn ln" id="mQ" style="color:var(--r)">'+esc(L.quit)+'</button></div>';

function finish(){
 var L=t(),l=P.l,gain=reward(l),acc=P.answered?Math.round(100*P.ok/P.answered):100;
 if(isDone(l))gain=Math.max(5,Math.round(gain/2));
 S.done[l]=Math.max(S.done[l]||0,acc>=90?3:acc>=60?2:1);S.xp+=gain;save();
 try{cards(l).forEach(function(x){var i=D.indexOf(x);if(st.dn.indexOf(i)<0)st.dn.push(i)});if(window.save)window.save()}catch(e){}
 $("kpBar").style.width="100%";snd("send");
 $("kpBody").innerHTML='<div class="kp-end">'+mascot(140,"happy")+'<h2>'+esc(L.done)+'</h2><p class="sub">'+esc(L.doneS)+'</p><div class="kp-stats"><div class="kp-sc" style="--c:var(--y);--i:0"><small>'+esc(L.xp)+'</small><b id="cX">0</b></div><div class="kp-sc" style="--c:var(--g);--i:1"><small>'+esc(L.acc)+'</small><b id="cA">0%</b></div><div class="kp-sc" style="--c:var(--r);--i:2"><small>'+esc(L.hearts)+'</small><b>❤️ '+Math.max(0,P.hearts)+'</b></div></div></div>';
 ft("",'<button class="kd-btn g" id="kpMain">'+esc(L.cont)+'</button>');
 $("kpMain").onclick=function(){closeP();setTimeout(function(){var n=$("kd")&&$("kd").querySelector(".kd-n.cur");if(n)n.scrollIntoView({block:"center",behavior:"smooth"})},250)};
 count($("cX"),gain,"+",900);count($("cA"),acc,"",900,"%");
 var w=innerWidth;confetti(w/2,innerHeight*.35,140);setTimeout(function(){confetti(w*.2,innerHeight*.4,70)},250);setTimeout(function(){confetti(w*.8,innerHeight*.4,70)},450)}
function count(el,to,pre,ms,suf){var t0=performance.now();(function s(n){var p=Math.min(1,(n-t0)/ms);el.textContent=(pre||"")+Math.round(to*(1-Math.pow(1-p,3)))+(suf||"");if(p<1)requestAnimationFrame(s)})(t0)}
/* ---------- конфетти ---------- */
var cv=null,cx=null,parts=[],raf=0;
function confetti(x,y,n){
 cv=cv||$("kdconf");if(!cv)return;
 if(matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 cv.width=innerWidth;cv.height=innerHeight;cx=cx||cv.getContext("2d");
 var cols=["#58cc02","#1cb0f6","#ffc800","#ff4b4b","#c07cff","#ff9f43"];
 for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=4+Math.random()*9;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%6],l:1})}
 cv.style.zIndex=700;if(!raf)raf=requestAnimationFrame(tick)}
function tick(){
 cx.clearRect(0,0,cv.width,cv.height);
 parts=parts.filter(function(p){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.011;if(p.l<=0||p.y>cv.height+20)return false;cx.save();cx.globalAlpha=Math.min(1,p.l*2);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();return true});
 if(parts.length)raf=requestAnimationFrame(tick);else{raf=0;cx.clearRect(0,0,cv.width,cv.height)}}
document.addEventListener("keydown",function(e){if(e.key=="Enter"&&P&&!$("kdp").hidden){var b=$("kpMain");if(b&&!b.classList.contains("dis")){e.preventDefault();b.click()}}});
/* ---------- синхронизация с аккаунтом (используется модулем Firebase ниже) ---------- */
window.kdApi={
 get:function(){return{uid:S.uid||null,tr:S.tr||"",done:S.done,xp:S.xp,chest:S.chest,ts:S.ts||0}},
 login:function(uid,r){
  var had=!!S.tr;
  if(S.uid&&S.uid!==uid)S={tr:null,done:{},xp:0,chest:{}};
  S.uid=uid;S.done=S.done||{};S.chest=S.chest||{};S.xp=S.xp||0;
  if(r){var rd=r.done||{},k;
   for(k in rd)S.done[k]=Math.max(S.done[k]||0,+rd[k]||0);
   for(k in (r.chest||{}))S.chest[k]=1;
   S.xp=Math.max(S.xp,+r.xp||0);
   if(r.tr&&CR[r.tr]&&(!S.tr||(+r.ts||0)>(S.ts||0)))S.tr=r.tr;
   S.ts=Math.max(S.ts||0,+r.ts||0)}
  try{Object.keys(S.done).forEach(function(l){cards(+l).forEach(function(x){var i=D.indexOf(x);if(st.dn.indexOf(i)<0)st.dn.push(i)})});if(window.save)window.save()}catch(e){}
  save(true);
  if(!had&&S.tr)mode="path";
  if(!P&&window.curV=="fold")kdRender()},
 logout:function(){
  if(!S.uid)return;
  S={tr:null,done:{},xp:0,chest:{}};save(true);mode="choose";pickTr=null;
  if(!P&&window.curV=="fold")kdRender()}};
/* кнопка «назад» в старом конспекте теперь ведёт на дорожку */
var lb=$("lb");if(lb)lb.onclick=function(){show("fold")};
})();
</script>

<script type="module">
/* KodYol: прогресс уроков хранится в аккаунте Google/Email (Firestore: progress/{uid}) */
import{getApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=getApp(),auth=getAuth(app),db=getFirestore(app);
let uid=null,tm=0,ready=false;
function push(){
 if(!uid||!ready||!window.kdApi)return;
 const g=kdApi.get();if(g.uid!==uid)return;
 setDoc(doc(db,"progress",uid),{tr:g.tr||"",done:g.done,xp:g.xp,chest:g.chest,ts:g.ts||Date.now()}).catch(()=>{})}
window.addEventListener("kd:save",()=>{clearTimeout(tm);tm=setTimeout(push,800)});
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(tm);push()}});
onAuthStateChanged(auth,async u=>{
 ready=false;
 if(!u){uid=null;window.kdApi&&kdApi.logout();return}
 uid=u.uid;
 let r=null;
 try{const s=await getDoc(doc(db,"progress",u.uid));if(s.exists())r=s.data()}catch(e){return}
 if(uid!==u.uid||!window.kdApi)return;
 kdApi.login(u.uid,r);ready=true;push()});
</script>
