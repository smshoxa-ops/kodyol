<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mu:#6b6f85;--ac:#2a9d0a;--ac2:#7be61c;--bd:#e3e5f0;--cb:#12131c;--ct:#b9f6ca}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e17;--card:#171927;--tx:#eceefb;--mu:#8b90ab;--bd:#262940}}
:root[data-theme="dark"]{--bg:#0d0e17;--card:#171927;--tx:#eceefb;--mu:#8b90ab;--bd:#262940}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{padding:48px 20px 70px;text-align:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.hero h1{margin:0 0 6px;font-size:clamp(28px,6vw,46px);letter-spacing:-1px}
.hero p{margin:0;opacity:.9}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
.sb{margin:-30px auto 18px;max-width:640px;position:relative}
.sb input{width:100%;padding:18px 20px 18px 52px;border:0;border-radius:18px;font-size:18px;background:var(--card);color:var(--tx);box-shadow:0 10px 30px rgba(60,40,160,.25);outline:2px solid transparent}
.sb input:focus{outline-color:var(--ac)}

/* ===== SVG-иконки вместо эмодзи ===== */
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.i.fl{fill:currentColor}.i.ys{color:#f5a70b}.i.fr{color:#f97316}
.mb,.hd button{display:inline-grid;place-items:center;padding:0}
.mb .i{width:22px;height:22px}.hd button .i{width:20px;height:20px}
.sb span{color:var(--mu);line-height:0;top:18px}.sb span .i{width:22px;height:22px}
.dh{display:flex;align-items:center;gap:10px}
.tb b,.hero h1{display:inline-flex;align-items:center;gap:10px}
.hero h1{justify-content:center}
.gi.sm{width:30px;height:30px;border-radius:10px;display:inline-grid;vertical-align:middle;margin-right:6px}
.gi.sm svg{width:17px;height:17px}
.gi.lg{width:54px;height:54px;border-radius:17px;display:inline-grid}
.gi.lg svg{width:30px;height:30px}
.tb .gi.sm{margin-right:0}.dh .gi.sm{margin-right:0}
h2 .gi.sm{margin-right:8px}
.gi-logo{--g1:#2a9d0a;--g2:#7be61c;--gs:rgba(108,92,231,.4)}
.gi-bot{--g1:#22d3ee;--g2:#6366f1;--gs:rgba(99,102,241,.4)}
.hero .gi-logo{--g1:rgba(255,255,255,.42);--g2:rgba(255,255,255,.14);--gs:rgba(0,0,0,.18)}

.gi.gi-logo::before,.gi.gi-logo::after,.gi.gi-logo svg{display:none!important}
.hero .gi.gi-logo{filter:drop-shadow(0 0 8px rgba(255,255,255,.6)) drop-shadow(0 4px 12px rgba(0,0,0,.25))}
.fold small{display:inline-flex;align-items:center;gap:5px}.fold small .i{width:14px;height:14px}
#ct,#lt{display:inline-flex;align-items:center;gap:8px}
.ls .ar{line-height:0}.ls .ar .i{width:20px;height:20px}
.ac button{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.ac button .i{width:16px;height:16px}
.empty .i{width:40px;height:40px;opacity:.35}
#mic{display:grid;place-items:center}#mic .i{width:22px;height:22px}
.chip .i{width:1.1em;height:1.1em;margin-right:2px}
.lc{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 5px;margin-right:8px;border-radius:6px;background:linear-gradient(145deg,var(--ac),var(--ac2));color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.chip.on .lc{background:rgba(255,255,255,.28)}
.gi-sun{--g1:#fde047;--g2:#f59e0b}
/* --- auth card --- */
.au{--ag:#2a2a2a;--agt:#fff;--ai:#1e1e1e;--aib:#3a3a3a;--ap:#fff;--apt:#000;--aph:#8a8a8a;--aor:#b5b5b0;max-width:440px;margin:28px auto 0;padding:22px;display:flex;flex-direction:column;gap:14px;background:#111;border:1px solid #1f1f1f;border-radius:32px}
:root[data-theme="light"] .au{--ag:#f1f2f8;--agt:#1b1d2a;--ai:#fff;--aib:#d9dbe8;--ap:#111;--apt:#fff;--aph:#8b8fa5;--aor:#7a7e94;background:var(--card);border-color:var(--bd)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .au{--ag:#f1f2f8;--agt:#1b1d2a;--ai:#fff;--aib:#d9dbe8;--ap:#111;--apt:#fff;--aph:#8b8fa5;--aor:#7a7e94;background:var(--card);border-color:var(--bd)}}
.au button,.au input{font-family:inherit;-webkit-appearance:none;appearance:none}
.au-g{display:flex;align-items:center;justify-content:center;gap:12px;height:56px;border:0;border-radius:18px;background:var(--ag);color:var(--agt);font-size:18px;font-weight:500;cursor:pointer;transition:filter .15s,transform .1s}
.au-g:hover{filter:brightness(1.15)}.au-g:active{transform:scale(.985)}.au-g:disabled{opacity:.6}
.au-or{text-align:center;color:var(--aor);font-size:16px;letter-spacing:.5px;margin:18px 0 4px}
.au-i{width:100%;box-sizing:border-box;height:56px;padding:0 20px;border:2px solid var(--aib);border-radius:18px;background:var(--ai);color:var(--tx);font-size:18px;outline:0;transition:border-color .15s}
.au-i::placeholder{color:var(--aph)}.au-i:focus{border-color:var(--ac)}.au-i[hidden]{display:none}
.au-p{height:56px;border:0;border-radius:18px;background:var(--ap);color:var(--apt);font-size:19px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}
.au-p:hover{opacity:.9}.au-p:active{transform:scale(.985)}.au-p:disabled{opacity:.5}
.au-sw{border:0;background:none;color:var(--aor);font-size:15px;padding:6px;cursor:pointer}.au-sw:hover{color:var(--ac)}.au-sw[hidden]{display:none}
.au-er{margin:-4px 2px 0;color:#ff6b70;font-size:14px;text-align:center;min-height:0}.au-er:empty{display:none}
.au-note{max-width:440px;margin:14px auto 0;text-align:center;color:var(--mu);font-size:13px}

/* ===== GREEN GLASS v52 ===== */
:root:root:root{--bg:#050805;--card:rgba(16,28,12,.55);--tx:#eaf7df;--mu:#8fa884;--bd:rgba(160,255,90,.14);--ac:#2faa08;--ac2:#7be61c;--al:#a4ff52;--cb:rgba(0,0,0,.45);--ct:#c6ff8f}

html,body{background:var(--bg);min-height:100%}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;position:relative}

.tb{background:rgba(5,10,4,.5);border-color:var(--bd)}
:root:root[data-theme="light"] .tb{background:rgba(255,255,255,.55)}
.c,.ls,.fc{border-color:var(--bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.c:hover,.ls:hover{box-shadow:0 12px 30px rgba(110,255,0,.14)}

.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.sb input{box-shadow:0 10px 30px rgba(90,220,0,.18);border:1px solid var(--bd)}
.sb input:focus{outline-color:var(--ac2)}
.pr button.pri,.bar button,.m.u,#dr .aiL,#ai-pw .pw-b{background:linear-gradient(135deg,#24980a,#6fd915)}
#c-chat .bar button,#c-chat .m.u{background:#2faa08}
#bn{background:rgba(8,16,6,.55);box-shadow:0 10px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}

.fold,.fold.fe,.fold.be,.fold.cy,.fold.ds{background:linear-gradient(145deg,rgba(150,255,60,.3),rgba(20,90,0,.38));border:1px solid rgba(190,255,130,.28);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 18px 44px rgba(90,220,0,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.fold svg path[fill]{fill:#b8ff66}.fold svg path[stroke]{stroke:#1d7a04}
/* стеклянные иконки: яркая фигура сзади + матовая панель спереди */
.gi{overflow:visible;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.gi::after{content:"";position:absolute;right:-2px;top:-2px;width:66%;height:66%;border-radius:50%;background:linear-gradient(145deg,#a6ff3c,#27a400);box-shadow:0 4px 14px rgba(110,255,0,.4)}
.gi::before{content:"";position:absolute;inset:auto auto 0 0;top:auto;width:80%;height:80%;border-radius:32%;z-index:1;background:linear-gradient(145deg,rgba(205,255,150,.5),rgba(120,220,60,.2));-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.gi svg{z-index:2;transform:translate(-9%,9%);stroke:#f6ffe9}
#dr .aiL .gi::after{background:linear-gradient(145deg,#eaffc2,#9be94a)}
/* вход: карточка как на макете */
:root:root:root .au{max-width:400px;margin:24px auto 0;padding:46px 22px 28px;gap:14px;border-radius:40px;background:linear-gradient(165deg,rgba(0,0,0,.6),rgba(0,0,0,.34));border:1px solid rgba(190,255,130,.2);-webkit-backdrop-filter:blur(30px) saturate(1.3);backdrop-filter:blur(30px) saturate(1.3);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);color:#fff}

.au-f,.au .au-g{display:flex;align-items:center;gap:10px;min-height:66px;padding:8px 10px 8px 24px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);color:#fff}

.au-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.au-c small{font-size:12px;font-weight:500;color:#8f9a8b}

.au-er{text-align:center}
.apk{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;box-shadow:0 2px 8px rgba(42,157,10,.35)}

/* логотип — обычная картинка, без зелёного круга и стеклянной панели */
.lgi{display:inline-block;flex:none;width:30px;height:30px;object-fit:contain;vertical-align:middle;background:none;border:0;box-shadow:none}

.wb:active,.hb:active{transform:scale(.96)}.hb .gi{width:58px;height:58px;border-radius:19px}.hb .gi svg{width:32px;height:32px}.hb span{font-size:13px;line-height:1.15;font-weight:700;opacity:.92;text-align:center;max-width:100%;overflow-wrap:anywhere}

{k:["boxmodel","boxsizing"],t:"Box Model (quti modeli)",d:"Brauzer har bir HTML elementni to'rtburchak quti deb hisoblaydi. Quti 4 qatlamdan iborat:\n\n1) Content — haqiqiy mazmun (matn, rasm); o'lchami width va height bilan beriladi.\n2) Padding — mazmun va ramka orasidagi ichki bo'shliq; fon rangi shu joyni ham bo'yaydi.\n3) Border — padding atrofidagi ramka.\n4) Margin — ramkadan tashqaridagi shaffof bo'shliq, qo'shni elementlarni itaradi.\n\nMuhim tuzoq: standart holatda width faqat mazmun enini bildiradi, padding va border unga qo'shiladi. Masalan 300px + 40px padding + 4px border = 344px. Shuning uchun deyarli har bir loyihada box-sizing: border-box yoziladi, shunda width ichiga padding va border ham kiradi.\n\nKo'p uchraydigan xatolar: margin va padding ni adashtirish; margin: 0 auto faqat block elementda va aniq width bo'lganda o'rtaga qo'yadi; vertikal margin lar ba'zan qo'shilmaydi, kattasi olinadi (margin collapse).\n\nTekshirish: sahifada o'ng tugma → Inspect → Computed bo'limida rangli quti chizmasi ko'rinadi.",c:"* { box-sizing: border-box; }\n.card {\n width: 300px;\n padding: 20px;\n border: 2px solid #2a9d0a;\n margin: 16px auto;\n}"},
{k:["margin","padding"],t:"Margin va Padding farqi",d:"Margin — elementdan TASHQARIDAGI bo'shliq, padding — elementning ICHIDAGI bo'shliq. O'xshatish: rasm ramkasi. Rasm — content, rasm bilan ramka orasidagi oq qog'oz — padding, ramka — border, ramkalar orasidagi devor — margin.\n\nYozish usullari: margin: 10px — to'rt tomonga; margin: 10px 20px — tepa-past 10, chap-o'ng 20; margin: 5px 10px 15px 20px — soat mili bo'yicha (tepa, o'ng, past, chap). Bitta tomon uchun margin-top, padding-left va hokazo.\n\nQachon nimani ishlatish: elementlarni bir-biridan uzoqlashtirish kerak bo'lsa — margin; tugma yoki karta ichidagi matn ramkaga yopishib qolmasin desangiz — padding. Fon rangi faqat padding gacha bo'yaydi, margin doim shaffof.",c:"margin: 10px 20px;\npadding: 8px 16px;\nmargin-top: 30px;\npadding-left: 12px;"},
{k:["input"],t:"input — kiritish maydoni",d:"input — foydalanuvchi ma'lumot kiritadigan maydon. Bu yopuvchi tegsiz teg, xatti-harakatini type atributi belgilaydi.\n\nEng muhim turlari: text — oddiy matn; password — belgilar yashirin; email — pochta formatini tekshiradi; number — faqat raqam; checkbox — belgilash katagi; radio — bir nechtadan bittasini tanlash; date — sana; file — fayl yuklash.\n\nFoydali atributlar: placeholder — maydon ichidagi maslahat; required — to'ldirish majburiy; name — serverga yuboriladigan nom; value — boshlang'ich qiymat; id — label bilan bog'lash uchun.\n\nHar bir input yoniga label qo'shing: label for va input id bir xil bo'lsa, yorliq bosilganda maydon faollashadi. Inputlar odatda form ichida bo'ladi va button type=\"submit\" bilan yuboriladi.",c:"<form>\n <label for=\"em\">Email</label>\n <input id=\"em\" type=\"email\" name=\"email\" placeholder=\"you@mail.com\" required>\n <input type=\"password\" placeholder=\"Password\">\n <button type=\"submit\">Sign in</button>\n</form>"},
{k:["flex","justifycontent","alignitems"],t:"Flexbox",d:"Flexbox — elementlarni bir o'lchamda (qator yoki ustun) tizish va tekislash tizimi. Ota elementga display: flex beriladi, shundan so'ng bolalari avtomatik yonma-yon turadi.\n\nIkki o'q: asosiy o'q (standartda gorizontal) va ko'ndalang o'q (vertikal). justify-content asosiy o'q bo'yicha, align-items ko'ndalang o'q bo'yicha tekislaydi. flex-direction: column qilsangiz o'qlar almashadi.\n\nQiymatlar: center — o'rtaga; space-between — chetlarga, orasi teng; flex-end — oxiriga. flex-wrap: wrap — joy yetmasa yangi qatorga o'tkazadi. gap — elementlar orasidagi masofa.\n\nMashhur retsept: elementni o'rtaga qo'yish — display:flex; justify-content:center; align-items:center; va height berish. Moslashuvchan sayt uchun flex va @media birga ishlatiladi.",c:".row {\n display: flex;\n justify-content: space-between;\n align-items: center;\n flex-wrap: wrap;\n gap: 16px;\n}\n@media (max-width: 600px) {\n .row { flex-direction: column; }\n}"},
{k:["class","sinf","selektor","id"],t:"Selektorlar: teg, class, id",d:"Selektor — CSS ga qaysi elementni bezash kerakligini aytadi.\n\n1) Teg selektori (p, h1) — shu turdagi hamma elementga ta'sir qiladi.\n2) Class (sinf) — nuqta bilan yoziladi (.card). Bir class ni istalgancha elementga berish mumkin, bitta elementga bir nechta class ham mumkin: class=\"card big\". Eng ko'p ishlatiladigani shu.\n3) Id — # bilan yoziladi (#logo). Bitta id sahifada faqat bir marta bo'ladi.\n\nQoida: stil uchun asosan class ishlating, id ni havola yoki JavaScript uchun qoldiring. Ustuvorlik: id > class > teg. Nomlarni kichik harf va chiziqcha bilan yozing: .main-menu.",c:"p { color: gray; }\n.card { padding: 12px; }\n#logo { width: 80px; }\n\n<div id=\"logo\" class=\"card big\">"},
{k:["display","inline","block"],t:"display",d:"display elementning sahifada qanday joylashishini belgilaydi.\n\nblock — yangi qatordan boshlanadi, butun kenglikni egallaydi (div, p, h1). width, height, margin to'liq ishlaydi.\ninline — matn ichida turadi, faqat o'z mazmuni qadar joy oladi (span, a). width va height ishlamaydi.\ninline-block — qator ichida turadi, lekin width, height va padding ishlaydi; tugma va menyu bandlari uchun qulay.\nnone — element butunlay yashiriladi.\n\nEsda tuting: block — g'isht (ustma-ust), inline — so'z (yonma-yon), inline-block — o'lchamli so'z.",c:"span { display: block; }\na { display: inline-block; padding: 8px 14px; }\n.hidden { display: none; }"}];

 открытого и закрытого ключа (RSA). Закрытый ключ никому не передавайте."],"109":["Hash","Hash — необратимый «отпечаток» данных. Для паролей используйте bcrypt/argon2, MD5 и SHA-1 устарели."],"110":["Цифровая подпись и сертификат","Подпись подтверждает, что документ не изменён и от кого он. Сертификат выдаёт доверенная организация (CA)."],"111":["OWASP Top 10","Список самых опасных уязвимостей веб-приложений (owasp.org). Каждому разработчику нужно его знать."],"112":["Injection и защита","Когда ввод пользователя выполняется как команда — это injection. Защита: параметризованные запросы и проверка ввода."],"113":["XSS и CSRF","XSS — чужой скрипт на странице; защита: экранирование вывода, CSP. CSRF — поддельный запрос от имени пользователя; защита: CSRF-токен, SameSite cookie."],"114":["Обновления и зависимости","В старых программах и библиотеках бывают известные уязвимости. Регулярно обновляйте и проверяйте."],"115":["Резервная копия (backup)","Чтобы защититься от ransomware и ошибок, правило 3-2-1: 3 копии, 2 типа носителей, 1 — в другом месте."],"116":["Принцип наименьших прав","Давайте пользователю и программе только нужные права. Это уменьшает ущерб при взломе."],"117":["Реагирование на инциденты","При подозрении на атаку: остановить, изолировать, найти причину, восстановить и сделать выводы."],"118":["Логи и мониторинг","Записывайте попытки входа и ошибки: необычную активность видно рано. Не храните пароли в логах."],"119":["Профессия в кибербезопасности","Направления: SOC-аналитик, инженер по безопасности, пентестер (только с разрешения!), DevSecOps. Для практики есть легальные платформы."],"120":["Что такое Data Science","Область получения полезных выводов и прогнозов из данных: объединяет статистику, программирование и знание предметной области."],"121":["Рабочий процесс","Обычные этапы: постановка вопроса, сбор данных, очистка, анализ, построение модели, представление результата."],"122":["Инструменты","Самый популярный язык — Python. Библиотеки: NumPy, Pandas, Matplotlib, scikit-learn. Среда: Jupyter Notebook."],"123":["Основы Python","Переменная, список (list) и словарь (dict) — основа работы с данными."],"124":["Цикл и функция","Цикл for перебирает элементы, функция позволяет использовать код повторно."],"125":["List comprehension","Способ создать или отфильтровать список в одной строке."],"126":["Массив NumPy","Массив (array) для быстрых числовых расчётов. Операции применяются сразу ко всему массиву."],"127":["Индексация и фильтр","Получение нужной части массива по индексу или по условию."],"128":["Статистические функции","Среднее, медиана и стандартное отклонение дают общее представление о данных."],"129":["DataFrame и чтение","Таблица в Pandas — DataFrame. Читаем из CSV-файла и смотрим первые строки."],"130":["Выбор и фильтрация","Выбор столбца по имени, строк — по условию."],"131":["groupby и сортировка","Подсчёт по группам (например, средняя цена по городу) и сортировка."],"132":["Пропущенные значения","В данных бывают пустые (NaN) места: их нужно найти, удалить или заполнить."],"133":["Дубликаты и типы","Удаление повторяющихся строк и исправление типа столбца."],"134":["Outlier (выброс)","Значение, резко отличающееся от остальных, может быть ошибкой или важным случаем. Сначала выясните причину."],"135":["График Matplotlib","Основные графики: линейный, столбчатый, гистограмма. Всегда подписывайте заголовок и оси."],"136":["Выбор типа графика","Во времени — линия, сравнение — столбцы, распределение — гистограмма, связь — scatter."],"137":["Seaborn и корреляция","Seaborn строит красивые графики. Корреляция — связь двух переменных (от -1 до 1). Связь не значит причина!"],"138":["Что такое Machine Learning","Модель сама находит закономерности в данных. Виды: обучение с учителем (есть ответы) и без учителя (без ответов)."],"139":["Разделение Train/Test","Данные делят на две части, чтобы проверить модель на невиданных данных. Иначе результат будет обманчивым."],"140":["Первая модель","Линейная регрессия: модель обучается (fit), затем предсказывает (predict) и оценивается."],"141":["Оценка модели","В классификации — точность (accuracy), precision и recall. В регрессии — MAE, RMSE. Не полагайтесь только на accuracy."],"142":["Overfitting (переобучение)","Модель заучивает обучающие данные и плохо работает на новых. Решение: больше данных, модель попроще, кросс-валидация."],"143":["Проект и портфолио","Возьмите открытые данные с Kaggle, проанализируйте и выложите результат с объяснением в Jupyter или на GitHub. Этика: защищайте личные данные."]},"en":{"0":["Browser","A program that loads and displays websites (Chrome, Safari). It reads HTML, CSS and JS."],"1":["Server","A computer that stores a website and sends it when the browser asks."],"2":["VS Code","A code editor. Useful extensions: Live Server, Prettier."],"3":["Files and folders","A website is a folder: index.html, style.css and an img/ folder."],"55":["Variables: let, const","Store data under a name. let can change, const cannot."],"56":["Function","A reusable block of code: name, parameters and return."],"57":["DOM and addEventListener","Find a page element with JS and react to an event (click)."],"58":["Array","Stores several values as a list. Indexing starts at 0."],"59":["if / else","Choose which code runs depending on a condition."],"4":["DOCTYPE","First line: tells the browser this is HTML5."],"5":["html","The main (root) tag; everything else goes inside it."],"6":["head","Service part: title, meta, CSS link. Not visible on the page."],"7":["body","The visible part of the page: text, images, buttons."],"8":["h1–h6","Headings. h1 is the main one (one per page), h6 is the smallest."],"9":["p","A paragraph of text."],"10":["strong","Bold, important text."],"11":["em","Italic text for emphasis."],"12":["br","Line break. No closing tag needed."],"13":["ul li","A bulleted list (ul) and its items (li)."],"14":["ol","Numbered list: 1, 2, 3…"],"15":["Leave a comment","A comment in code, not visible on the page. Shortcut: Ctrl+/"],"16":["a href","A link. href says where it leads."],"17":["img src alt","An image. src is the file address, alt is the description shown if the image fails to load."],"18":["table tr td th","A table. table is the whole table, tr a row, th a header cell, td a normal cell."],"19":["form","A form is a container for input fields; it sends data to the server."],"20":["input","An input field. The type is set with type: text, password, email, number, checkbox. placeholder is the hint inside the field. No closing tag needed."],"21":["button","A button. Inside a form it submits it (type=\"submit\")."],"22":["label","A field label. Clicking it activates the field (linked via for and id)."],"23":["Semantic tags","Tags that show the meaning of a block (not just a div). They help SEO and accessibility."],"24":["header","The top part of a site or section: logo, heading."],"25":["nav","A navigation block: a menu with links."],"26":["main","The main content of the page (only one per page)."],"27":["section","A thematic section of the page."],"28":["footer","The bottom part: contacts, copyright."],"29":["Linking CSS to HTML","Three ways: an external file (best), a style tag, a style attribute."],"30":["Selector: tag","Styles all tags of the same type."],"31":["Selector: class","Written with a dot in CSS. Can be applied to many elements."],"32":["Selector: id","A unique identifier, written with # in CSS. Only one per page."],"33":["color","Text color. Given by name, HEX or rgb."],"34":["font-size","Font size: px, rem, em."],"35":["font-family","The typeface, with fallback options."],"36":["font-weight","Font weight: 400 normal, 700 bold."],"37":["text-align","Text alignment: left, center, right."],"38":["line-height","Line height (the distance between lines)."],"39":["text-decoration","Underline or strikethrough. none removes the underline from a link."],"40":["Box model","Every element has 4 layers: content → padding → border → margin."],"41":["margin","Outer space: the distance to neighboring elements."],"42":["padding","Inner space: between the content and the border."],"43":["border","A border: thickness, style, color. border-radius rounds the corners."],"44":["width height","The width and height of an element."],"45":["display","Display type: block (full width), inline (within a line), inline-block (within a line, but with a size)."],"46":["background-color","Background color."],"47":["background-image","An image as the background. You will also need background-size: cover."],"48":["Flexbox","Give the parent display:flex; the children line up in a row and are easy to align."],"49":["justify-content","Alignment along the main (horizontal) axis: center, space-between, flex-end."],"50":["align-items","Alignment along the cross (vertical) axis: center, stretch."],"51":["flex-wrap","Allows elements to wrap onto a new line."],"52":["gap","The space between flex items."],"53":["Media queries @media","Styles that apply only when a condition is met, such as screen width. The basis of a responsive site."],"54":["Responsive page","A site that looks good on both phone and computer. The meta viewport tag is required."],"60":["git init","Creates a Git repository in the folder."],"61":["git add and commit","Stages your changes and saves them with a message."],"62":["git push and GitHub","Sends your code to GitHub (git pull downloads it)."],"63":["Node.js","An environment that runs JavaScript outside the browser, on a server."],"64":["npm","Node's package manager: installs libraries; settings live in package.json."],"65":["Express server","A popular web framework for Node: it creates routes."],"66":["Database","Data is stored in tables (rows and columns). Examples: PostgreSQL, MySQL, SQLite."],"67":["SQL SELECT","Reading data from a table. WHERE is the filter."],"68":["SQL INSERT","Adding a new row to a table."],"69":["React component","A reusable piece of the interface: a function that returns JSX."],"70":["useState","Stores a component's state; when it changes, the page updates."],"71":["props","Data passed into a component from outside."],"72":["What is Backend","The part of a site that runs on the server and that users don't see: logic, database, security."],"73":["Backend languages","Backend can be written in JavaScript (Node.js), Python, Java, PHP, Go and other languages."],"74":["Backend project structure","A project is split into folders: routes, controllers, models. This keeps code tidy."],"75":["HTTP methods","GET reads, POST creates, PUT/PATCH updates, DELETE deletes."],"76":["Status codes","The result of a server response: 200 OK, 201 Created, 400 bad request, 401 unauthorized, 404 not found, 500 server error."],"77":["REST API","Clear rules of URLs and methods for resources (users, posts). The response usually comes back as JSON."],"78":["Route parameters","The variable part of a URL (:id) and query parameters (?page=2)."],"79":["Middleware","A function that runs between request and response: logging, checks, reading JSON. next() passes control on."],"80":["JSON response and body","Data sent with POST is in req.body; res.json() returns JSON."],"81":["SQL UPDATE and DELETE","UPDATE changes an existing row, DELETE removes it. Don't forget WHERE, or every row will change!"],"82":["JOIN","Combines two tables by a shared column."],"83":["Working with a database from Node.js","Queries are sent to PostgreSQL through the pg library. Always use parameters like $1 for values."],"84":["Hashing a password","A password is never stored in plain form. bcrypt turns it into an irreversible hash."],"85":["JWT token","After login the server issues a signed token; the client sends it with every request."],"86":["Protected route","Auth middleware checks the token; if it's invalid it returns 401."],"87":["CORS","Browsers usually block requests coming from another domain. CORS defines which sites are allowed."],"88":[".env and secrets","Don't put passwords and keys in code: keep them in a .env file and add it to .gitignore."],"89":["SQL injection and validation","Never put user input directly into a query: validate it and use parameterized queries."],"90":["try/catch and async errors","Catch errors in async functions with try/catch and pass them to next(err)."],"91":["Error middleware","A function with 4 parameters catches all errors in one place."],"92":["API testing","With Jest and supertest you can test endpoints automatically."],"93":["Deploy","Putting the backend on a server on the internet: Render, Railway, VPS. Take the port from an environment variable."],"94":["Docker","Packs the app and its environment into a container, so it runs the same everywhere."],"95":["CI/CD and logs","On push to Git, tests and deploy run automatically (GitHub Actions). Watch errors through logs."],"96":["What is cybersecurity","The field of protecting data, systems and networks from unauthorized access, theft and damage."],"97":["Types of threats","The most common threats: malware, phishing, password theft, DDoS and insider mistakes."],"98":["Risk and layers of defense","Risk = threat × vulnerability × impact. Protection is not a single layer but many (defense in depth)."],"99":["Strong password","A long (12+ characters), unique password is best. Use a separate one for each site."],"100":["Password manager","Keeps all passwords in an encrypted vault and generates unique ones. You only remember one master password."],"101":["2FA and passkey","Two-step verification protects your account even if the password is stolen. An app or key is better than SMS."],"102":["Phishing","A fraudster tries to get your password and card details through a fake email, SMS or website."],"103":["Social engineering","Tricking the person, not the technology: gaining trust so the victim reveals the needed information themselves."],"104":["Checking links and files","Check the address before you click. Don't open suspicious files; if needed, scan them on VirusTotal."],"105":["Network basics","An IP address identifies a device, a port identifies a service. HTTP → 80, HTTPS → 443, SSH → 22."],"106":["Firewall and VPN","A firewall filters incoming and outgoing traffic with rules. A VPN encrypts traffic and protects you on open Wi-Fi."],"107":["HTTPS and TLS","TLS encrypts data and verifies the server with a certificate. Data over plain HTTP can be intercepted."],"108":["Types of encryption","Symmetric uses one key (AES). Asymmetric uses a public and private key pair (RSA). Never give anyone your private key."],"109":["Hash","A hash is an irreversible fingerprint of data. Use bcrypt/argon2 for passwords; MD5 and SHA-1 are outdated."],"110":["Digital signature and certificate","A signature confirms a document is unchanged and who it came from. A certificate is issued by a trusted authority (CA)."],"111":["OWASP Top 10","A list of the most dangerous web application vulnerabilities (owasp.org). Every developer should know it."],"112":["Injection and defense","When user input gets executed as a command, that's injection. Defense: parameterized queries and input validation."],"113":["XSS and CSRF","XSS is a foreign script on your page; defense: escape output, CSP. CSRF is a forged request in the user's name; defense: CSRF token, SameSite cookie."],"114":["Updates and dependencies","Old software and libraries have known vulnerabilities. Update and audit them regularly."],"115":["Backup","To protect against ransomware and mistakes, use the 3-2-1 rule: 3 copies, 2 kinds of media, 1 stored elsewhere."],"116":["Principle of least privilege","Give users and programs only the permissions they need. This limits the damage if they are compromised."],"117":["Incident response","If you suspect an attack: stop it, isolate, find the cause, recover and draw conclusions."],"118":["Logs and monitoring","Record login attempts and errors: unusual activity is spotted early. Never store passwords in logs."],"119":["A career in cybersecurity","Paths: SOC analyst, security engineer, pentester (only with permission!), DevSecOps. There are legal platforms to practice on."],"120":["What is Data Science","The field of drawing useful conclusions and predictions from data: it combines statistics, programming and domain knowledge."],"121":["Workflow","Typical steps: ask a question, collect data, clean, analyze, build a model, present the result."],"122":["Tools","The most popular language is Python. Libraries: NumPy, Pandas, Matplotlib, scikit-learn. Environment: Jupyter Notebook."],"123":["Python basics","A variable, a list and a dictionary (dict) are the basis of working with data."],"124":["Loop and function","A for loop goes through elements; a function lets you reuse code."],"125":["List comprehension","A way to create or filter a list in a single line."],"126":["NumPy array","An array for fast numeric computation. Operations apply to the whole array at once."],"127":["Indexing and filtering","Getting the part of an array you need by index or by condition."],"128":["Statistical functions","Mean, median and standard deviation give an overview of the data."],"129":["DataFrame and reading","A table in Pandas is a DataFrame. We read it from a CSV file and look at the first rows."],"130":["Selecting and filtering","Selecting a column by name and rows by condition."],"131":["groupby and sorting","Calculating per group (for example, average price by city) and sorting."],"132":["Missing values","Data often has empty (NaN) spots: find them, then remove or fill them."],"133":["Duplicates and types","Removing duplicate rows and fixing a column's type."],"134":["Outlier","A value that differs sharply from the rest may be an error or an important case. Find the cause first."],"135":["Matplotlib chart","Basic charts: line, bar, histogram. Always add a title and axis labels."],"136":["Choosing a chart type","Over time: line; comparison: bar; distribution: histogram; relationship: scatter."],"137":["Seaborn and correlation","Seaborn makes attractive charts. Correlation is the relationship between two variables (from -1 to 1). Correlation is not causation!"],"138":["What is Machine Learning","A model learns patterns from data by itself. Kinds: supervised (answers given) and unsupervised (no answers) learning."],"139":["Train/Test split","We split the data in two to test the model on data it hasn't seen. Otherwise the result is misleading."],"140":["First model","Linear regression: the model is trained (fit), then predicts (predict) and is evaluated."],"141":["Evaluating a model","For classification: accuracy, precision and recall. For regression: MAE, RMSE. Don't rely on accuracy alone."],"142":["Overfitting","The model memorizes the training data and does poorly on new data. Fixes: more data, a simpler model, cross-validation."],"143":["Project and portfolio","Take open data from Kaggle, analyze it, and publish the result with an explanation in Jupyter or on GitHub. Ethics: protect personal data."]},"zh":{"0":["浏览器","加载并显示网站的程序（Chrome、Safari），能读取 HTML、CSS 和 JS。"],"1":["服务器","存储网站并在浏览器请求时发送的计算机。"],"2":["VS Code","代码编辑器。常用扩展：Live Server、Prettier。"],"3":["文件和文件夹","网站就是一个文件夹：index.html、style.css 和 img/ 文件夹。"],"55":["变量：let、const","用名称保存数据。let 可以修改，const 不可修改。"],"56":["函数","可重复使用的代码块：名称、参数和 return。"],"57":["DOM 与 addEventListener","用 JS 找到页面元素并响应事件（点击）。"],"58":["数组（array）","把多个值存成列表。索引从 0 开始。"],"59":["if / else","根据条件选择执行哪段代码。"],"4":["DOCTYPE","第一行：告诉浏览器这是 HTML5。"],"5":["html","根标签，其余所有内容都在它里面。"],"6":["head","功能部分：title、meta、引入 CSS。页面上不可见。"],"7":["body","页面的可见部分：文字、图片、按钮。"],"8":["h1–h6","标题。h1 是主标题（每页一个），h6 最小。"],"9":["p","文本段落。"],"10":["strong","粗体、重要的文字。"],"11":["em","斜体文字，用于强调。"],"12":["br","换行。不需要结束标签。"],"13":["ul li","无序列表（ul）及其列表项（li）。"],"14":["ol","有序列表：1、2、3…"],"15":["添加注释","代码中的注释，页面上不可见。快捷键：Ctrl+/"],"16":["a href","链接。href 指明跳转到哪里。"],"17":["img src alt","图片。src 是文件地址，alt 是图片加载失败时显示的描述。"],"18":["table tr td th","表格。table 是整个表格，tr 是行，th 是表头单元格，td 是普通单元格。"],"19":["form","表单是输入框的容器，会把数据发送到服务器。"],"20":["input","输入框。用 type 选择类型：text、password、email、number、checkbox。placeholder 是框内的提示。不需要结束标签。"],"21":["button","按钮。在表单内点击会提交表单（type=\"submit\"）。"],"22":["label","字段标签。点击它会激活对应输入框（通过 for 和 id 关联）。"],"23":["语义标签","表明区块含义的标签（而不是普通 div），有助于 SEO 和易用性。"],"24":["header","网站或区块的顶部：标志、标题。"],"25":["nav","导航区块：带链接的菜单。"],"26":["main","页面的主要内容（每页只有一个）。"],"27":["section","页面中的主题章节。"],"28":["footer","底部：联系方式、版权信息。"],"29":["将 CSS 引入 HTML","三种方式：外部文件（最佳）、style 标签、style 属性。"],"30":["选择器：标签","为所有相同类型的标签设置样式。"],"31":["选择器：class（类）","在 CSS 中以点号书写，可用于多个元素。"],"32":["选择器：id","唯一标识符，在 CSS 中以 # 书写，每页只能有一个。"],"33":["color","文字颜色。可用名称、HEX 或 rgb 指定。"],"34":["font-size","字体大小：px、rem、em。"],"35":["font-family","字体类型，附带备用字体。"],"36":["font-weight","字重：400 常规，700 粗体。"],"37":["text-align","文本对齐：left、center、right。"],"38":["line-height","行高（行与行之间的距离）。"],"39":["text-decoration","下划线或删除线。none 可去掉链接的下划线。"],"40":["Box model","每个元素有 4 层：content → padding → border → margin。"],"41":["margin","外边距：与相邻元素之间的距离。"],"42":["padding","内边距：内容与边框之间的空间。"],"43":["border","边框：粗细、样式、颜色。border-radius 用于圆角。"],"44":["width height","元素的宽度和高度。"],"45":["display","显示类型：block（占满整行）、inline（行内）、inline-block（行内，但可设置尺寸）。"],"46":["background-color","背景颜色。"],"47":["background-image","把图片设为背景。还需要 background-size: cover。"],"48":["Flexbox","给父元素设置 display:flex，子元素排成一行，方便对齐。"],"49":["justify-content","沿主轴（水平）对齐：center、space-between、flex-end。"],"50":["align-items","沿交叉轴（垂直）对齐：center、stretch。"],"51":["flex-wrap","允许元素换行显示。"],"52":["gap","flex 元素之间的间距。"],"53":["Media queries @media","仅在满足条件（如屏幕宽度）时生效的样式，是自适应网站的基础。"],"54":["自适应页面","在手机和电脑上都好用的网站。需要 meta viewport 标签。"],"60":["git init","在文件夹中创建 Git 仓库。"],"61":["git add 与 commit","暂存更改并附带说明保存。"],"62":["git push 与 GitHub","把代码推送到 GitHub（git pull 用于下载）。"],"63":["Node.js","让 JavaScript 在浏览器之外、在服务器上运行的环境。"],"64":["npm","Node 的包管理器：安装库，配置保存在 package.json 中。"],"65":["Express 服务器","Node 的热门 Web 框架：用来创建路由（route）。"],"66":["数据库","数据存储在表中（行和列）。例如：PostgreSQL、MySQL、SQLite。"],"67":["SQL SELECT","从表中读取数据。WHERE 是过滤条件。"],"68":["SQL INSERT","向表中添加新行。"],"69":["React 组件","界 TTP → 80，HTTPS → 443，SSH → 22。"],"106":["防火墙与 VPN","防火墙按规则过滤进出流量。VPN 加密流量，在公共 Wi-Fi 上保护你。"],"107":["HTTPS 与 TLS","TLS 加密数据，并通过证书验证服务器。明文 HTTP 中的数据可能被截获。"],"108":["加密类型","对称加密使用一个密钥（AES）。非对称加密使用公钥和私钥一对（RSA）。私钥绝不能给任何人。"],"109":["哈希（Hash）","哈希是数据的不可逆“指纹”。密码请使用 bcrypt/argon2，MD5 和 SHA-1 已过时。"],"110":["数字签名与证书","签名证明文档未被修改并确认其来源。证书由受信任的机构（CA）签发。"],"111":["OWASP Top 10","Web 应用中最危险漏洞的清单（owasp.org），每个开发者都应了解。"],"112":["注入与防护","用户输入被当作命令执行就是注入（injection）。防护：参数化查询并校验输入。"],"113":["XSS 与 CSRF","XSS 是外来脚本进入页面；防护：转义输出、CSP。CSRF 是以用户名义发出的伪造请求；防护：CSRF 令牌、SameSite cookie。"],"114":["更新与依赖","旧的程序和库存在已知漏洞。请定期更新并检查。"],"115":["备份（backup）","为防勒索软件和误操作，遵循 3-2-1 原则：3 份副本、2 种介质、1 份异地保存。"],"116":["最小权限原则","只给用户和程序必需的权限。这样被攻破时损失更小。"],"117":["事件响应","怀疑遭到攻击时：停止、隔离、查明原因、恢复并总结经验。"],"118":["日志与监控","记录登录尝试和错误，可以及早发现异常行为。不要在日志中保存密码。"],"119":["网络安全职业","方向：SOC 分析师、安全工程师、渗透测试员（必须获得授权！）、DevSecOps。有合法的平台可供练习。"],"120":["什么是数据科学","从数据中得出有用结论和预测的领域：结合统计学、编程和行业知识。"],"121":["工作流程","典型步骤：提出问题、收集数据、清洗、分析、建模、展示结果。"],"122":["工具","最流行的语言是 Python。库：NumPy、Pandas、Matplotlib、scikit-learn。环境：Jupyter Notebook。"],"123":["Python 基础","变量、列表（list）和字典（dict）是处理数据的基础。"],"124":["循环与函数","for 循环遍历元素，函数让代码可以重复使用。"],"125":["列表推导式","一行代码创建或过滤列表的方法。"],"126":["NumPy 数组","用于快速数值计算的数组（array）。运算会一次作用于整个数组。"],"127":["索引与过滤","按索引或条件取出数组中需要的部分。"],"128":["统计函数","平均数、中位数和标准差可以概括数据的整体情况。"],"129":["DataFrame 与读取","Pandas 中的表格叫 DataFrame。从 CSV 文件读取并查看前几行。"],"130":["选择与过滤","按名称选择列，按条件选择行。"],"131":["groupby 与排序","按组计算（例如各城市平均价格）并排序。"],"132":["缺失值","数据里常有空值（NaN）：需要找出来，删除或填充。"],"133":["重复项与类型","删除重复行并修正列的类型。"],"134":["异常值（outlier）","与其他值差异极大的数值可能是错误，也可能是重要情况。先弄清原因。"],"135":["Matplotlib 图表","基本图表：折线图、柱状图、直方图。务必写上标题和坐标轴名称。"],"136":["选择图表类型","随时间变化用折线图，比较用柱状图，分布用直方图，关系用散点图（scatter）。"],"137":["Seaborn 与相关性","Seaborn 能画出美观的图表。相关性表示两个变量的关联（-1 到 1）。相关不等于因果！"],"138":["什么是机器学习","模型自己从数据中学习规律。类型：有监督学习（有答案）和无监督学习（无答案）。"],"139":["Train/Test 划分","把数据分成两份，用模型没见过的数据来检验。否则结果会有误导性。"],"140":["第一个模型","线性回归：模型先训练（fit），再预测（predict），最后评估。"],"141":["模型评估","分类看准确率（accuracy） olicitudes de otro dominio. CORS define qué sitios están permitidos."],"88":[".env y secretos","No escribas contraseñas ni claves en el código: guárdalas en un archivo .env y añádelo a .gitignore."],"89":["Inyección SQL y validación","No metas lo que escribe el usuario directamente en la consulta: valídalo y usa consultas parametrizadas."],"90":["try/catch y errores async","Captura los errores de una función async con try/catch y pásalos a next(err)."],"91":["Middleware de errores","Una función de 4 parámetros captura todos los errores en un solo lugar."],"92":["Pruebas de API","Con Jest y supertest se pueden probar los endpoints automáticamente."],"93":["Deploy","Poner el backend en un servidor de internet: Render, Railway, VPS. Toma el puerto de una variable de entorno."],"94":["Docker","Empaqueta la aplicación y su entorno en un contenedor: funciona igual en todas partes."],"95":["CI/CD y logs","Al hacer push a Git se ejecutan pruebas y deploy automáticamente (GitHub Actions). Vigila los errores con los logs."],"96":["Qué es la ciberseguridad","El campo de proteger datos, sistemas y redes contra el acceso no autorizado, el robo y los daños."],"97":["Tipos de amenazas","Las amenazas más comunes: malware, phishing, robo de contraseñas, DDoS y errores internos."],"98":["Riesgo y capas de defensa","Riesgo = amenaza × vulnerabilidad × impacto. La protección no es una sola, sino en varias capas (defense in depth)."],"99":["Contraseña segura","Lo mejor es una contraseña larga (12+ caracteres) y única. Usa una distinta para cada sitio."],"100":["Gestor de contraseñas","Guarda todas las contraseñas en una bóveda cifrada y genera contraseñas únicas. Solo recuerdas una contraseña maestra."],"101":["2FA y passkey","La verificación en dos pasos protege la cuenta aunque roben la contraseña. Una app o llave es mejor que un SMS."],"102":["Phishing","Un estafador intenta obtener tu contraseña y datos de tarjeta con un correo, SMS o sitio falso."],"103":["Ingeniería social","Engañar a la persona, no a la tecnología: ganarse la confianza para que ella misma revele la información."],"104":["Comprobar enlaces y archivos","Mira la dirección antes de hacer clic. No abras archivos sospechosos; si hace falta, compruébalos en VirusTotal."],"105":["Fundamentos de redes","La dirección IP identifica el dispositivo y el puerto el servicio. HTTP → 80, HTTPS → 443, SSH → 22."],"106":["Firewall y VPN","Un firewall filtra el tráfico de entrada y salida con reglas. Una VPN cifra el tráfico y protege en Wi-Fi abierto."],"107":["HTTPS y TLS","TLS cifra los datos y verifica el servidor con un certificado. En HTTP sin cifrar los datos pueden interceptarse."],"108":["Tipos de cifrado","El simétrico usa una sola clave (AES). El asimétrico usa un par de clave pública y privada (RSA). Nunca entregues tu clave privada."],"109":["Hash","Un hash es una huella irreversible de los datos. Para contraseñas usa bcrypt/argon2; MD5 y SHA-1 están obsoletos."],"110":["Firma digital y certificado","La firma confirma que el documento no ha cambiado y quién lo envió. El certificado lo emite una entidad de confianza (CA)."],"111":["OWASP Top 10","La lista de las vulnerabilidades más peligrosas en aplicaciones web (owasp.org). Todo desarrollador debería conocerla."],"112":["Injection y defensa","Cuando lo que escribe el usuario se ejecuta como comando, es injection. Defensa: consultas parametrizadas y validar la entrada."],"113":["XSS y CSRF","XSS es un script ajeno en la página; defensa: escapar la salida, CSP. CSRF es una solicitud falsa en nombre del usuario; defensa: token CSRF, cookie SameSite."],"114":["Actualizaciones y dependencias","El software y las librerías antiguos tienen vulnerabilidades conocidas. Actualiza y revisa con regularidad."],"115":["Copia de seguridad (backup)","Para protegerte de ransomware y errores, la regla 3-2-1: 3 copias, 2 tipos de soporte, 1 en otro lugar."],"116":["Principio de mínimo privilegio","Da a usuarios y programas solo los permisos necesarios. Así se reduce el daño si son comprometidos."],"117":["Respuesta a incidentes","Si sospechas un ataque: detenerlo, aislar, hallar la causa, recuperar y sacar conclusiones."],"118":["Logs y monitorización","Registra los intentos de acceso y los errores: la actividad inusual se detecta pronto. No guardes contraseñas en los logs."],"119":["Una carrera en ciberseguridad","Rutas: analista SOC, ingeniero de seguridad, pentester (¡solo con permiso!), DevSecOps. Hay plataformas legales para practicar."],"120":["Qué es Data Science","El campo de sacar conclusiones y predicciones útiles a partir de datos: une estadística, programación y conocimiento del área."],"121":["Flujo de trabajo","Pasos habituales: plantear la pregunta, recopilar datos, limpiar, analizar, construir un modelo, presentar el resultado."],"122":["Herramientas","El lenguaje más popular es Python. Librerías: NumPy, Pandas, Matplotlib, scikit-learn. Entorno: Jupyter Notebook."],"123":["Fundamentos de Python","Variable, lista (list) y diccionario (dict): la base para trabajar con datos."],"124":["Bucle y función","El bucle for recorre los elementos; la función permite reutilizar código."],"125":["List comprehension","Una forma de crear o filtrar una lista en una sola línea."],"126":["Arreglo de NumPy","Un arreglo (array) para cálculos numéricos rápidos. Las operaciones se aplican a todo el arreglo a la vez."],"127":["Indexación y filtro","Obtener la parte necesaria del arreglo por índice o por condición."],"128":["Funciones estadísticas","La media, la mediana y la desviación estándar dan una visión general de los datos."],"129":["DataFrame y lectura","En Pandas, una tabla es un DataFrame. Leemos de un archivo CSV y vemos las primeras filas."],"130":["Selección y filtrado","Elegir una columna por nombre y filas por condición."],"131":["groupby y ordenación","Calcular por grupos (por ejemplo, precio medio por ciudad) y ordenar."],"132":["Valores faltantes","Los datos tienen huecos vacíos (NaN): hay que encontrarlos y eliminarlos o rellenarlos."],"133":["Duplicados y tipos","Eliminar filas duplicadas y corregir el tipo de una columna."],"134":["Outlier (valor atípico)","Un valor que difiere mucho del resto puede ser un error o un caso importante. Primero averigua la causa."],"135":["Gráfico de Matplotlib","Gráficos básicos: de líneas, de barras, histograma. Escribe siempre el título y los nombres de los ejes."],"136":["Elegir el tipo de gráfico","Con el tiempo: línea; comparación: barras; distribución: histograma; relación: scatter."],"137":["Seaborn y correlación","Seaborn crea gráficos bonitos. La correlación es la relación entre dos variables (de -1 a 1). ¡Correlación no implica causalidad!"],"138":["Qué es Machine Learning","El modelo aprende patrones de los datos por sí mismo. Tipos: aprendizaje supervisado (con respuestas) y no supervisado (sin respuestas)."],"139":["División Train/Test","Dividimos los datos en dos para probar el modelo con datos que no ha visto. Si no, el resultado engaña."],"140":["Primer modelo","Regresión lineal: el modelo se entrena (fit), luego predice (predict) y se evalúa."],"141":["Evaluación del modelo","En clasificación: exactitud (accuracy), precision y recall. En regresión: MAE, RMSE. No te fíes solo de accuracy."],"142":["Overfitting (sobreajuste)","El modelo memoriza los datos de entrenamiento y funciona mal con datos nuevos. Solución: más datos, un modelo más simple, validación cruzada."],"143":["Proyecto y portafolio","Toma datos abiertos de Kaggle, analízalos y publica el resultado con una explicación en Jupyter o GitHub. Ética: protege los datos personales."]},"de":{"0":["Browser","Programm, das Websites lädt und anzeigt (Chrome, Safari). Es liest HTML, CSS und JS."],"1":["Server","Rechner, der die Website speichert und sie sendet, wenn der Browser anfragt."],"2":["VS Code","Code-Editor. Nützliche Erweiterungen: Live Server, Prettier."],"3":["Dateien und Ordner","Eine Website ist ein Ordner: index.html, style.css und der Ordner i itverlauf: Linie; Vergleich: Balken; Verteilung: Histogramm; Zusammenhang: Scatter."],"137":["Seaborn und Korrelation","Seaborn erstellt schöne Diagramme. Korrelation ist der Zusammenhang zweier Variablen (von -1 bis 1). Korrelation ist nicht Ursache!"],"138":["Was ist Machine Learning","Ein Modell lernt Muster selbst aus Daten. Arten: überwachtes (mit Antworten) und unüberwachtes (ohne Antworten) Lernen."],"139":["Train/Test-Aufteilung","Wir teilen die Daten in zwei Teile, um das Modell an unbekannten Daten zu prüfen. Sonst ist das Ergebnis trügerisch."],"140":["Erstes Modell","Lineare Regression: Das Modell wird trainiert (fit), sagt dann voraus (predict) und wird bewertet."],"141":["Modellbewertung","Bei Klassifikation: Genauigkeit (accuracy), Precision und Recall. Bei Regression: MAE, RMSE. Nicht nur auf accuracy verlassen."],"142":["Overfitting (Überanpassung)","Das Modell lernt die Trainingsdaten auswendig und arbeitet mit neuen Daten schlecht. Lösung: mehr Daten, einfacheres Modell, Kreuzvalidierung."],"143":["Projekt und Portfolio","Nimm offene Daten von Kaggle, analysiere sie und veröffentliche das Ergebnis mit Erklärung in Jupyter oder auf GitHub. Ethik: persönliche Daten schützen."]}};

  ft("no",'<div class="kp-fb">'+mascot(58,"sad","kp-mc")+'<div><b>'+esc(L.no)+'</b><span>'+esc(L.right)+' '+esc(answer)+'</span></div></div><button class="kd-btn g" id="kpMain">'+esc(L.nx)+'</button>');
  $("kpMain").onclick=function(){P.i++;if(P.hearts<=0)return dead();next()}}
 setBar()}
function dead(){
 var L=t();$("kpBody").innerHTML='<div class="kp-end">'+mascot(130,"sad")+'<h2 style="color:var(--r)">'+esc(L.dead)+'</h2><p class="sub">'+esc(L.deadP)+'</p></div>';

function quitAsk(){
 var L=t(),m=document.createElement("div");m.className="kd-mod";
 m.innerHTML='<div>'+mascot(96,"sad")+'<h3>'+esc(L.quitT)+'</h3><p>'+esc(L.quitP)+'</p><button class="kd-btn g" id="mS">'+esc(L.stay)+'</button><button class="kd-btn ln" id="mQ" style="color:var(--r)">'+esc(L.quit)+'</button></div>';

function finish(){
 var L=t(),l=P.l,gain=reward(l),acc=P.answered?Math.round(100*P.ok/P.answered):100;
 if(isDone(l))gain=Math.max(5,Math.round(gain/2));
 S.done[l]=Math.max(S.done[l]||0,acc>=90?3:acc>=60?2:1);S.xp+=gain;save();
 try{cards(l).forEach(function(x){var i=D.indexOf(x);if(st.dn.indexOf(i)<0)st.dn.push(i)});if(window.save)window.save()}catch(e){}
 $("kpBar").style.width="100%";snd("send");
 $("kpBody").innerHTML='<div class="kp-end">'+mascot(140,"happy")+'<h2>'+esc(L.done)+'</h2><p class="sub">'+esc(L.doneS)+'</p><div class="kp-stats"><div class="kp-sc" style="--c:var(--y);--i:0"><small>'+esc(L.xp)+'</small><b id="cX">0</b></div><div class="kp-sc" style="--c:var(--g);--i:1"><small>'+esc(L.acc)+'</small><b id="cA">0%</b></div><div class="kp-sc" style="--c:var(--r);--i:2"><small>'+esc(L.hearts)+'</small><b>❤️ '+Math.max(0,P.hearts)+'</b></div></div></div>';
 ft("",'<button class="kd-btn g" id="kpMain">'+esc(L.cont)+'</button>');
 $("kpMain").onclick=function(){closeP();setTimeout(function(){var n=$("kd")&&$("kd").querySelector(".kd-n.cur");if(n)n.scrollIntoView({block:"center",behavior:"smooth"})},250)};
 count($("cX"),gain,"+",900);count($("cA"),acc,"",900,"%");
 var w=innerWidth;confetti(w/2,innerHeight*.35,140);setTimeout(function(){confetti(w*.2,innerHeight*.4,70)},250);setTimeout(function(){confetti(w*.8,innerHeight*.4,70)},450)}
function count(el,to,pre,ms,suf){var t0=performance.now();(function s(n){var p=Math.min(1,(n-t0)/ms);el.textContent=(pre||"")+Math.round(to*(1-Math.pow(1-p,3)))+(suf||"");if(p<1)requestAnimationFrame(s)})(t0)}
/* ---------- конфетти ---------- */
var cv=null,cx=null,parts=[],raf=0;
function confetti(x,y,n){
 cv=cv||$("kdconf");if(!cv)return;
 if(matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 cv.width=innerWidth;cv.height=innerHeight;cx=cx||cv.getContext("2d");
 var cols=["#58cc02","#1cb0f6","#ffc800","#ff4b4b","#c07cff","#ff9f43"];
 for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=4+Math.random()*9;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%6],l:1})}
 cv.style.zIndex=700;if(!raf)raf=requestAnimationFrame(tick)}
function tick(){
 cx.clearRect(0,0,cv.width,cv.height);
 parts=parts.filter(function(p){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.011;if(p.l<=0||p.y>cv.height+20)return false;cx.save();cx.globalAlpha=Math.min(1,p.l*2);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();return true});
 if(parts.length)raf=requestAnimationFrame(tick);else{raf=0;cx.clearRect(0,0,cv.width,cv.height)}}
document.addEventListener("keydown",function(e){if(e.key=="Enter"&&P&&!$("kdp").hidden){var b=$("kpMain");if(b&&!b.classList.contains("dis")){e.preventDefault();b.click()}}});
/* ---------- синхронизация с аккаунтом (используется модулем Firebase ниже) ---------- */
window.kdApi={
 get:function(){return{uid:S.uid||null,tr:S.tr||"",done:S.done,xp:S.xp,chest:S.chest,ts:S.ts||0}},
 login:function(uid,r){
  var had=!!S.tr;
  if(S.uid&&S.uid!==uid)S={tr:null,done:{},xp:0,chest:{}};
  S.uid=uid;S.done=S.done||{};S.chest=S.chest||{};S.xp=S.xp||0;
  if(r){var rd=r.done||{},k;
   for(k in rd)S.done[k]=Math.max(S.done[k]||0,+rd[k]||0);
   for(k in (r.chest||{}))S.chest[k]=1;
   S.xp=Math.max(S.xp,+r.xp||0);
   if(r.tr&&CR[r.tr]&&(!S.tr||(+r.ts||0)>(S.ts||0)))S.tr=r.tr;
   S.ts=Math.max(S.ts||0,+r.ts||0)}
  try{Object.keys(S.done).forEach(function(l){cards(+l).forEach(function(x){var i=D.indexOf(x);if(st.dn.indexOf(i)<0)st.dn.push(i)})});if(window.save)window.save()}catch(e){}
  save(true);
  if(!had&&S.tr)mode="path";
  if(!P&&window.curV=="fold")kdRender()},
 logout:function(){
  if(!S.uid)return;
  S={tr:null,done:{},xp:0,chest:{}};save(true);mode="choose";pickTr=null;
  if(!P&&window.curV=="fold")kdRender()}};
/* кнопка «назад» в старом конспекте теперь ведёт на дорожку */
var lb=$("lb");if(lb)lb.onclick=function(){show("fold")};
})();
</script>

<script type="module">
/* KodYol: прогресс уроков хранится в аккаунте Google/Email (Firestore: progress/{uid}) */
import{getApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=getApp(),auth=getAuth(app),db=getFirestore(app);
let uid=null,tm=0,ready=false;
function push(){
 if(!uid||!ready||!window.kdApi)return;
 const g=kdApi.get();if(g.uid!==uid)return;
 setDoc(doc(db,"progress",uid),{tr:g.tr||"",done:g.done,xp:g.xp,chest:g.chest,ts:g.ts||Date.now()}).catch(()=>{})}
window.addEventListener("kd:save",()=>{clearTimeout(tm);tm=setTimeout(push,800)});
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(tm);push()}});
onAuthStateChanged(auth,async u=>{
 ready=false;
 if(!u){uid=null;window.kdApi&&kdApi.logout();return}
 uid=u.uid;
 let r=null;
 try{const s=await getDoc(doc(db,"progress",u.uid));if(s.exists())r=s.data()}catch(e){return}
 if(uid!==u.uid||!window.kdApi)return;
 kdApi.login(u.uid,r);ready=true;push()});
</script>
