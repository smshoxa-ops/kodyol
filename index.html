<style>

/* ===== Анимации (v17) ===== */
@keyframes vin{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

.ls{position:relative;overflow:hidden;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}

.c{transition:transform .2s,box-shadow .2s,border-color .2s}.c:hover{box-shadow:0 12px 28px rgba(60,40,160,.16);border-color:var(--ac)}
.pb i{animation:grow .9s .2s cubic-bezier(.2,.8,.2,1) both}

{k:["boxmodel","boxsizing"],t:"Box Model (quti modeli)",d:"Brauzer har bir HTML elementni to'rtburchak quti deb hisoblaydi. Quti 4 qatlamdan iborat:\n\n1) Content — haqiqiy mazmun (matn, rasm); o'lchami width va height bilan beriladi.\n2) Padding — mazmun va ramka orasidagi ichki bo'shliq; fon rangi shu joyni ham bo'yaydi.\n3) Border — padding atrofidagi ramka.\n4) Margin — ramkadan tashqaridagi shaffof bo'shliq, qo'shni elementlarni itaradi.\n\nMuhim tuzoq: standart holatda width faqat mazmun enini bildiradi, padding va border unga qo'shiladi. Masalan 300px + 40px padding + 4px border = 344px. Shuning uchun deyarli har bir loyihada box-sizing: border-box yoziladi, shunda width ichiga padding va border ham kiradi.\n\nKo'p uchraydigan xatolar: margin va padding ni adashtirish; margin: 0 auto faqat block elementda va aniq width bo'lganda o'rtaga qo'yadi; vertikal margin lar ba'zan qo'shilmaydi, kattasi olinadi (margin collapse).\n\nTekshirish: sahifada o'ng tugma → Inspect → Computed bo'limida rangli quti chizmasi ko'rinadi.",c:"* { box-sizing: border-box; }\n.card {\n width: 300px;\n padding: 20px;\n border: 2px solid #2a9d0a;\n margin: 16px auto;\n}"},
{k:["margin","padding"],t:"Margin va Padding farqi",d:"Margin — elementdan TASHQARIDAGI bo'shliq, padding — elementning ICHIDAGI bo'shliq. O'xshatish: rasm ramkasi. Rasm — content, rasm bilan ramka orasidagi oq qog'oz — padding, ramka — border, ramkalar orasidagi devor — margin.\n\nYozish usullari: margin: 10px — to'rt tomonga; margin: 10px 20px — tepa-past 10, chap-o'ng 20; margin: 5px 10px 15px 20px — soat mili bo'yicha (tepa, o'ng, past, chap). Bitta tomon uchun margin-top, padding-left va hokazo.\n\nQachon nimani ishlatish: elementlarni bir-biridan uzoqlashtirish kerak bo'lsa — margin; tugma yoki karta ichidagi matn ramkaga yopishib qolmasin desangiz — padding. Fon rangi faqat padding gacha bo'yaydi, margin doim shaffof.",c:"margin: 10px 20px;\npadding: 8px 16px;\nmargin-top: 30px;\npadding-left: 12px;"},
{k:["input"],t:"input — kiritish maydoni",d:"input — foydalanuvchi ma'lumot kiritadigan maydon. Bu yopuvchi tegsiz teg, xatti-harakatini type atributi belgilaydi.\n\nEng muhim turlari: text — oddiy matn; password — belgilar yashirin; email — pochta formatini tekshiradi; number — faqat raqam; checkbox — belgilash katagi; radio — bir nechtadan bittasini tanlash; date — sana; file — fayl yuklash.\n\nFoydali atributlar: placeholder — maydon ichidagi maslahat; required — to'ldirish majburiy; name — serverga yuboriladigan nom; value — boshlang'ich qiymat; id — label bilan bog'lash uchun.\n\nHar bir input yoniga label qo'shing: label for va input id bir xil bo'lsa, yorliq bosilganda maydon faollashadi. Inputlar odatda form ichida bo'ladi va button type=\"submit\" bilan yuboriladi.",c:"<form>\n <label for=\"em\">Email</label>\n <input id=\"em\" type=\"email\" name=\"email\" placeholder=\"you@mail.com\" required>\n <input type=\"password\" placeholder=\"Password\">\n <button type=\"submit\">Sign in</button>\n</form>"},
{k:["flex","justifycontent","alignitems"],t:"Flexbox",d:"Flexbox — elementlarni bir o'lchamda (qator yoki ustun) tizish va tekislash tizimi. Ota elementga display: flex beriladi, shundan so'ng bolalari avtomatik yonma-yon turadi.\n\nIkki o'q: asosiy o'q (standartda gorizontal) va ko'ndalang o'q (vertikal). justify-content asosiy o'q bo'yicha, align-items ko'ndalang o'q bo'yicha tekislaydi. flex-direction: column qilsangiz o'qlar almashadi.\n\nQiymatlar: center — o'rtaga; space-between — chetlarga, orasi teng; flex-end — oxiriga. flex-wrap: wrap — joy yetmasa yangi qatorga o'tkazadi. gap — elementlar orasidagi masofa.\n\nMashhur retsept: elementni o'rtaga qo'yish — display:flex; justify-content:center; align-items:center; va height berish. Moslashuvchan sayt uchun flex va @media birga ishlatiladi.",c:".row {\n display: flex;\n justify-content: space-between;\n align-items: center;\n flex-wrap: wrap;\n gap: 16px;\n}\n@media (max-width: 600px) {\n .row { flex-direction: column; }\n}"},

ertest можно автоматически проверять эндпоинты."],"93":["Deploy","Размещение Backend на сервере в интернете: Render, Railway, VPS. Порт берите из переменной окружения."],"94":["Docker","Упаковывает программу и её окружение в контейнер — работает везде одинаково."],"95":["CI/CD и логи","При push в Git автоматически запускаются тесты и деплой (GitHub Actions). Следите за ошибками через логи."],"96":["Что такое кибербезопасность","Область защиты данных, систем и сетей от несанкционированного доступа, кражи и взлома."],"97":["Виды угроз","Самые распространённые угрозы: вредоносное ПО (malware), фишинг, кража паролей, DDoS и ошибки сотрудников."],"98":["Риск и слои защиты","Риск = угроза × уязвимость × влияние. Защита не одна, а многослойная (defense in depth)."],"99":["Надёжный пароль","Лучше всего длинный (12+ символов) и уникальный пароль. Для каждого сайта используйте отдельный."],"100":["Менеджер паролей","Хранит все пароли в зашифрованном хранилище и создаёт уникальные. Запомнить нужно только один мастер-пароль."],"101":["2FA и passkey","Двухфакторная проверка защищает аккаунт, даже если пароль украли. Приложение или ключ лучше, чем SMS."],"102":["Фишинг (phishing)","Мошенник пытается получить пароль и данные карты через поддельное письмо, SMS или сайт."],"103":["Социальная инженерия","Обман человека, а не техники: завоевав доверие, мошенник заставляет самого назвать нужные данные."],"104":["Проверка ссылок и файлов","Перед нажатием посмотрите адрес. Не открывайте подозрительные файлы, при необходимости проверьте на VirusTotal."],"105":["Основы сетей","IP-адрес определяет устройство, порт — службу. HTTP → 80, HTTPS → 443, SSH → 22."],"106":["Firewall и VPN","Firewall фильтрует входящий и исходящий трафик по правилам. VPN шифрует трафик и защищает в открытом Wi-Fi."],"107":["HTTPS и TLS","TLS шифрует данные и подтверждает сервер сертификатом. В открытом HTTP данные можно перехватить."],"108":["Виды шифрования","Симметричное — один ключ (AES). Асимметричное — пара из открытого и закрытого ключа (RSA). Закрытый ключ никому не передавайте."],"109":["Hash","Hash — необратимый «отпечаток» данных. Для паролей используйте bcrypt/argon2, MD5 и SHA-1 устарели."],"110":["Цифровая подпись и сертификат","Подпись подтверждает, что документ не изменён и от кого он. Сертификат выдаёт доверенная организация (CA)."],"111":["OWASP Top 10","Список самых опасных уязвимостей веб-приложений (owasp.org). Каждому разработчику нужно его знать."],"112":["Injection и защита","Когда ввод пользователя выполняется как команда — это injection. Защита: параметризованные запросы и проверка ввода."],"113":["XSS и CSRF","XSS — чужой скрипт на странице; защита: экранирование вывода, CSP. CSRF — поддельный запрос от имени пользователя; защита: CSRF-токен, SameSite cookie."],"114":["Обновления и зависимости","В старых программах и библиотеках бывают известные уязвимости. Регулярно обновляйте и проверяйте."],"115":["Резервная копия (backup)","Чтобы защититься от ransomware и ошибок, правило 3-2-1: 3 копии, 2 типа носителей, 1 — в другом месте."],"116":["Принцип наименьших прав","Давайте пользователю и программе только нужные права. Это уменьшает ущерб при взломе."],"117":["Реагирование на инциденты","При подозрении на атаку: остановить, изолировать, найти причину, восстановить и сделать выводы."],"118":["Логи и мониторинг","Записывайте попытки входа и ошибки: необычную активность видно рано. Не храните пароли в логах."],"119":["Профессия в кибербезопасности","Направления: SOC-аналитик, инженер по безопасности, пентестер (только с разрешения!), DevSecOps. Для практики есть легальные платформы."],"120":["Что такое Data Science","Область получения полезных выводов и прогнозов из данных: объединяет статистику, программирование и знание предметной области."],"121":["Рабочий процесс","Обычные этапы: постановка вопроса, сбор данных, очистка, анализ, построение модели, представление результата."],"122":["Инструменты","Самый популярный язык — Python. Библиотеки: NumPy, Pandas, Matplotlib, scikit-learn. Среда: Jupyter Notebook."],"123":["Основы Python","Переменная, список (list) и словарь (dict) — основа работы с данными."],"124":["Цикл и функция","Цикл for перебирает элементы, функция позволяет использовать код повторно."],"125":["List comprehension","Способ создать или отфильтровать список в одной строке."],"126":["Массив NumPy","Массив (array) для быстрых числовых расчётов. Операции применяются сразу ко всему массиву."],"127":["Индексация и фильтр","Получение нужной части массива по индексу или по условию."],"128":["Статистические функции","Среднее, медиана и стандартное отклонение дают общее представление о данных."],"129":["DataFrame и чтение","Таблица в Pandas — DataFrame. Читаем из CSV-файла и смотрим первые строки."],"130":["Выбор и фильтрация","Выбор столбца по имени, строк — по условию."],"131":["groupby и сортировка","Подсчёт по группам (например, средняя цена по городу) и сортировка."],"132":["Пропущенные значения","В данных бывают пустые (NaN) места: их нужно найти, удалить или заполнить."],"133":["Дубликаты и типы","Удаление повторяющихся строк и исправление типа столбца."],"134":["Outlier (выброс)","Значение, резко отличающееся от остальных, может быть ошибкой или важным случаем. Сначала выясните причину."],"135":["График Matplotlib","Основные графики: линейный, столбчатый, гистограмма. Всегда подписывайте заголовок и оси."],"136":["Выбор типа графика","Во времени — линия, сравнение — столбцы, распределение — гистограмма, связь — scatter."],"137":["Seaborn и корреляция","Seaborn строит красивые графики. Корреляция — связь двух переменных (от -1 до 1). Связь не значит причина!"],"138":["Что такое Machine Learning","Модель сама находит закономерности в данных. Виды: обучение с учителем (есть ответы) и без учителя (без ответов)."],"139":["Разделение Train/Test","Данные делят на две части, чтобы проверить модель на невиданных данных. Иначе результат будет обманчивым."],"140":["Первая модель","Линейная регрессия: модель обучается (fit), затем предсказывает (predict) и оценивается."],"141":["Оценка модели","В классификации — точность (accuracy), precision и recall. В регрессии — MAE, RMSE. Не полагайтесь только на accuracy."],"142":["Overfitting (переобучение)","Модель заучивает обучающие данные и плохо работает на новых. Решение: больше данных, модель попроще, кросс-валидация."],"143":["Проект и портфолио","Возьмите открытые данные с Kaggle, проанализируйте и выложите результат с объяснением в Jupyter или на GitHub. Этика: защищайте личные данные."]},"en":{"0":["Browser","A program that loads and displays websites (Chrome, Safari). It reads HTML, CSS and JS."],"1":["Server","A computer that stores a website and sends it when the browser asks."],"2":["VS Code","A code editor. Useful extensions: Live Server, Prettier."],"3":["Files and folders","A website is a folder: index.html, style.css and an img/ folder."],"55":["Variables: let, const","Store data under a name. let can change, const cannot."],"56":["Function","A reusable block of code: name, parameters and return."],"57":["DOM and addEventListener","Find a page element with JS and react to an event (click)."],"58":["Array","Stores several values as a list. Indexing starts at 0."],"59":["if / else","Choose which code runs depending on a condition."],"4":["DOCTYPE","First line: tells the browser this is HTML5."],"5":["html","The main (root) tag; everything else goes inside it."],"6":["head","Service part: title, meta, CSS link. Not visible on the page."],"7":["body","The visible part of the page: text, images, buttons."],"8":["h1–h6","Headings. h1 is the main one (one per page), h6 is the smallest."],"9":["p","A paragraph of text."],"10":["strong","Bold, important text."],"11":["em","Italic text for emphasis."],"12":["br","Line break. No closing tag needed."],"13":["ul li","A bulleted list (ul) and its items (li)."],"14":["ol","Numbered list: 1, 2, 3…"],"15":["Leave a comment","A comment in code, not visible on the page. Shortcut: Ctrl+/"],"16":["a href","A link. href says where it leads."],"17":["img src alt","An image. src is the file address, alt is the description shown if the image fails to load."],"18":["table tr td th","A table. table is the whole table, tr a row, th a header cell, td a normal cell."],"19":["form","A form is a container for input fields; it sends data to the server."],"20":["input","An input field. The type is set with type: text, password, email, number, checkbox. placeholder is the hint inside the field. No closing tag needed."],"21":["button","A button. Inside a form it submits it (type=\"submit\")."],"22":["label","A field label. Clicking it activates the field (linked via for and id)."],"23":["Semantic tags","Tags that show the meaning of a block (not just a div). They help SEO and accessibility."],"24":["header","The top part of a site or section: logo, heading."],"25":["nav","A navigation block: a menu with links."],"26":["main","The main content of the page (only one per page)."],"27":["section","A thematic section of the page."],"28":["footer","The bottom part: contacts, copyright."],"29":["Linking CSS to HTML","Three ways: an external file (best), a style tag, a style attribute."],"30":["Selector: tag","Styles all tags of the same type."],"31":["Selector: class","Written with a dot in CSS. Can be applied to many elements."],"32":["Selector: id","A unique identifier, written with # in CSS. Only one per page."],"33":["color","Text color. Given by name, HEX or rgb."],"34":["font-size","Font size: px, rem, em."],"35":["font-family","The typeface, with fallback options."],"36":["font-weight","Font weight: 400 normal, 700 bold."],"37":["text-align","Text alignment: left, center, right."],"38":["line-height","Line height (the distance between lines)."],"39":["text-decoration","Underline or strikethrough. none removes the underline from a link."],"40":["Box model","Every element has 4 layers: content → padding → border → margin."],"41":["margin","Outer space: the distance to neighboring elements."],"42":["padding","Inner space: between the content and the border."],"43":["border","A border: thickness, style, color. border-radius rounds the corners."],"44":["width height","The width and height of an element."],"45":["display","Display type: block (full width), inline (within a line), inline-block (within a line, but with a size)."],"46":["background-color","Background color."],"47":["background-image","An image as the background. You will also need background-size: cover."],"48":["Flexbox","Give the parent display:flex; the children line up in a row and are easy to align."],"49":["justify-content","Alignment along the main (horizontal) axis: center, space-between, flex-end."],"50":["align-items","Alignment along the cross (vertical) axis: center, stretch."],"51":["flex-wrap","Allows elements to wrap onto a new line."],"52":["gap","The space between flex items."],"53":["Media queries @media","Styles that apply only when a condition is met, such as screen width. The basis of a responsive site."],"54":["Responsive page","A site that looks good on both phone and computer. The meta viewport tag is required."],"60":["git init","Creates a Git repository in the folder."],"61":["git add and commit","Stages your changes and saves them with a message."],"62":["git push and GitHub","Sends your code to GitHub (git pull downloads it)."],"63":["Node.js","An environment that runs JavaScript outside the browser, on a server."],"64":["npm","Node's package manager: installs libraries; settings live in package.json."],"65":["Express server","A popular web framework for Node: it creates routes."],"66":["Database","Data is stored in tables (rows and columns). Examples: PostgreSQL, MySQL, SQLite."],"67":["SQL SELECT","Reading data from a table. WHERE is the filter."],"68":["SQL INSERT","Adding a new row to a table."],"69":["React component","A reusable piece of the interface: a function that returns JSX."],"70":["useState","Stores a component's state; when it changes, the page updates."],"71":["props","Data passed into a component from outside."],"72":["What is Backend","The part of a site that runs on the server and that users don't see: logic, database, security."],"73":["Backend languages","Backend can be written in JavaScript (Node.js), Python, Java, PHP, Go and other languages."],"74":["Backend project structure","A project is split into folders: routes, controllers, models. This keeps code tidy."],"75":["HTTP methods","GET reads, POST creates, PUT/PATCH updates, DELETE deletes."],"76":["Status codes","The result of a server response: 200 OK, 201 Created, 400 bad request, 401 unauthorized, 404 not found, 500 server error."],"77":["REST API","Clear rules of URLs and methods for resources (users, posts). The response usually comes back as JSON."],"78":["Route parameters","The variable part of a URL (:id) and query parameters (?page=2)."],"79":["Middleware","A function that runs between request and response: logging, checks, reading JSON. next() passes control on."],"80":["JSON response and body","Data sent with POST is in req.body; res.json() returns JSON."],"81":["SQL UPDATE and DELETE","UPDATE changes an existing row, DELETE removes it. Don't forget WHERE, or every row will change!"],"82":["JOIN","Combines two tables by a shared column."],"83":["Working with a database from Node.js","Queries are sent to PostgreSQL through the pg library. Always use parameters like $1 for values."],"84":["Hashing a password","A password is never stored in plain form. bcrypt turns it into an irreversible hash."],"85":["JWT token","After login the server issues a signed token; the client sends it with every request."],"86":["Protected route","Auth middleware checks the token; if it's invalid it returns 401."],"87":["CORS","Browsers usually block requests coming from another domain. CORS defines which sites are allowed."],"88":[".env and secrets","Don't put passwords and keys in code: keep them in a .env file and add it to .gitignore."],"89":["SQL injection and validation","Never put user input directly into a query: validate it and use parameterized queries."],"90":["try/catch and async errors","Catch errors in async functions with try/catch and pass them to next(err)."],"91":["Error middleware","A function with 4 parameters catches all errors in one place."],"92":["API testing","With Jest and supertest you can test endpoints automatically."],"93":["Deploy","Putting the backend on a server on the internet: Render, Railway, VPS. Take the port from an environment variable."],"94":["Docker","Packs the app and its environment into a container, so it runs the same everywhere."],"95":["CI/CD and logs","On push to Git, tests and deploy run automatically (GitHub Actions). Watch errors through logs."],"96":["What is cybersecurity","The field of protecting data, systems and networks from unauthorized access, theft and damage."],"97":["Types of threats","The most common threats: malware, phishing, password theft, DDoS and insider mistakes."],"98":["Risk and layers of defense","Risk = threat × vulnerability × impact. Protection is not a single layer but many (defense in depth)."],"99":["Strong password","A long (12+ characters), unique password is best. Use a separate one for each site."],"100":["Password manager","Keeps all passwords in an encrypted vault and generates unique ones. You only remember one master password."],"101":["2FA and passkey","Two-step verification protects your account even if the password is stolen. An app or key is better than SMS."],"102":["Phishing","A fraudster tries to get your password and card details through a fake email, SMS or website."],"103":["Social engineering","Tricking the person, not the technology: gaining trust so the victim reveals the needed information themselves."],"104":["Checking links and files","Check the address before you click. Don't open suspicious files; if needed, scan them on VirusTotal."],"105":["Network basics","An IP address identifies a device, a port identifies a service. HTTP → 80, HTTPS → 443, SSH → 22."],"106":["Firewall and VPN","A firewall filters incoming and outgoing traffic with rules. A VPN encrypts traffic and protects you on open Wi-Fi."],"107":["HTTPS and TLS","TLS encrypts data and verifies the server with a certificate. Data over plain HTTP can be intercepted."],"108":["Types of encryption","Symmetric uses one key (AES). Asymmetric uses a public and private key pair (RSA). Never give anyone your private key."],"109":["Hash","A hash is an irreversible fingerprint of data. Use bcrypt/argon2 for passwords; MD5 and SHA-1 are outdated."],"110":["Digital signature and certificate","A signature confirms a document is unchanged and who it came from. A certificate is issued by a trusted authority (CA)."],"111":["OWASP Top 10","A list of the most dangerous web application vulnerabilities (owasp.org). Every developer should know it."],"112":["Injection and defense","When user input gets executed as a command, that's injection. Defense: parameterized queries and input validation."],"113":["XSS and CSRF","XSS is a foreign script on your page; defense: escape output, CSP. CSRF is a forged request in the user's name; defense: CSRF token, SameSite cookie."],"114":["Updates and dependencies","Old software and libraries have known vulnerabilities. Update and audit them regularly."],"115":["Backup","To protect against ransomware and mistakes, use the 3-2-1 rule: 3 copies, 2 kinds of media, 1 stored elsewhere."],"116":["Principle of least privilege","Give users and programs only the permissions they need. This limits the damage if they are compromised."],"117":["Incident response","If you suspect an attack: stop it, isolate, find the cause, recover and draw conclusions."],"118":["Logs and monitoring","Record login attempts and errors: unusual activity is spotted early. Never store passwords in logs."],"119":["A career in cybersecurity","Paths: SOC analyst, security engineer, pentester (only with permission!), DevSecOps. There are legal platforms to practice on."],"120":["What is Data Science","The field of drawing useful conclusions and predictions from data: it combines statistics, programming and domain knowledge."],"121":["Workflow","Typical steps: ask a question, collect data, clean, analyze, build a model, present the result."],"122":["Tools","The most popular language is Python. Libraries: NumPy, Pandas, Matplotlib, scikit-learn. Environment: Jupyter Notebook."],"123":["Python basics","A variable, a list and a dictionary (dict) are the basis of working with data."],"124":["Loop and function","A for loop goes through elements; a function lets you reuse code."],"125":["List comprehension","A way to create or filter a list in a single line."],"126":["NumPy array","An array for fast numeric computation. Operations apply to the whole array at once."],"127":["Indexing and filtering","Getting the part of an array you need by index or by condition."],"128":["Statistical functions","Mean, median and standard deviation give an overview of the data."],"129":["DataFrame and reading","A table in Pandas is a DataFrame. We read it from a CSV file and look at the first rows."],"130":["Selecting and filtering","Selecting a column by name and rows by condition."],"131":["groupby and sorting","Calculating per group (for example, average price by city) and sorting."],"132":["Missing values","Data often has empty (NaN) spots: find them, then remove or fill them."],"133":["Duplicates and types","Removing duplicate rows and fixing a column's type."],"134":["Outlier","A value that differs sharply from the rest may be an error or an important case. Find the cause first."],"135":["Matplotlib chart","Basic charts: line, bar, histogram. Always add a title and axis labels."],"136":["Choosing a chart type","Over time: line; comparison: bar; distribution: histogram; relationship: scatter."],"137":["Seaborn and correlation","Seaborn makes attractive charts. Correlation is the relationship between two variables (from -1 to 1). Correlation is not causation!"],"138":["What is Machine Learning","A model learns patterns from data by itself. Kinds: supervised (answers given) and unsupervised (no answers) learning."],"139":["Train/Test split","We split the data in two to test the model on data it hasn't seen. Otherwise the result is misleading."],"140":["First model","Linear regression: the model is trained (fit), then predicts (predict) and is evaluated."],"141":["Evaluating a model","For classification: accuracy, precision and recall. For regression: MAE, RMSE. Don't rely on accuracy alone."],"142":["Overfitting","The model memorizes the training data and does poorly on new data. Fixes: more data, a simpler model, cross-validation."],"143":["Project and portfolio","Take open data from Kaggle, analyze it, and publish the result with an explanation in Jupyter or on GitHub. Ethics: protect personal data."]},"zh":{"0":["浏览器","加载并显示网站的程序（Chrome、Safari），能读取 HTML、CSS 和 JS。"],"1":["服务器","存储网站并在浏览器请求时发送的计算机。"],"2":["VS Code","代码编辑器。常用扩展：Live Server、Prettier。"],"3":["文件和文件夹","网站就是一个文件夹：index.html、style.css 和 img/ 文件夹。"],"55":["变量：let、const","用名称保存数据。let 可以修改，const 不可修改。"],"56":["函数","可重复使用的代码块：名称、参数和 return。"],"57":["DOM 与 addEventListener","用 JS 找到页面元素并响应事件（点击）。"],"58":["数组（array）","把多个值存成列表。索引从 0 开始。"],"59":["if / else","根据条件选择执行哪段代码。"],"4":["DOCTYPE","第一行：告诉浏览器这是 HTML5。"],"5":["html","根标签，其余所有内容都在它里面。"],"6":["head","功能部分：title、meta、引入 CSS。页面上不可见。"],"7":["body","页面的可见部分：文字、图片、按钮。"],"8":["h1–h6","标题。h1 是主标题（每页一个），h6 最小。"],"9":["p","文本段落。"],"10":["strong","粗体、重要的文字。"],"11":["em","斜体文字，用于强调。"],"12":["br","换行。不需要结束标签。"],"13":["ul li","无序列表（ul）及其列表项（li）。"],"14":["ol","有序列表：1、2、3…"],"15":["添加注释","代码中的注释，页面上不可见。快捷键：Ctrl+/"],"16":["a href","链接。href 指明跳转到哪里。"],"17":["img src alt","图片。src 是文件地址，alt 是图片加载失败时显示的描述。"],"18":["table tr td th","表格。table 是整个表格，tr 是行，th 是表头单元格，td 是普通单元格。"],"19":["form","表单是输入框的容器，会把数据发送到服务器。"],"20":["input","输入框。用 type 选择类型：text、password、email、number、checkbox。placeholder 是框内的提示。不需要结束标签。"],"21":["button","按钮。在表单内点击会提交表单（type=\"submit\"）。"],"22":["label","字段标签。点击它会激活对应输入框（通过 for 和 id 关联）。"],"23":["语义标签","表明区块含义的标签（而不是普通 div），有助于 SEO 和易用性。"],"24":["header","网站或区块的顶部：标志、标题。"],"25":["nav","导航区块：带链接的菜单。"],"26":["main","页面的主要内容（每页只有一个）。"],"27":["section","页面中的主题章节。"],"28":["footer","底部：联系方式、版权信息。"],"29":["将 CSS 引入 HTML","三种方式：外部文件（最佳）、style 标签、style 属性。"],"30":["选择器：标签","为所有相同类型的标签设置样式。"],"31":["选择器：class（类）","在 CSS 中以点号书写，可用于多个元素。"],"32":["选择器：id","唯一标识符，在 CSS 中以 # 书写，每页只能有一个。"],"33":["color","文字颜色。可用名称、HEX 或 rgb 指定。"],"34":["font-size","字体大小：px、rem、em。"],"35":["font-family","字体类型，附带备用字体。"],"36":["font-weight","字重：400 常规，700 粗体。"],"37":["text-align","文本对齐：left、center、right。"],"38":["line-height","行高（行与行之间的距离）。"],"39":["text-decoration","下划线或删除线。none 可去掉链接的下划线。"],"40":["Box model","每个元素有 4 层：content → padding → border → margin。"],"41":["margin","外边距：与相邻元素之间的距离。"],"42":["padding","内边距：内容与边框之间的空间。"],"43":["border","边框：粗细、样式、颜色。border-radius 用于圆角。"],"44":["width height","元素的宽度和高度。"],"45":["display","显示类型：block（占满整行）、inline（行内）、inline-block（行内，但可设置尺寸）。"],"46":["background-color","背景颜色。"],"47":["background-image","把图片设为背景。还需要 background-size: cover。"],"48":["Flexbox","给父元素设置 display:flex，子元素排成一行，方便对齐。"],"49":["justify-content","沿主轴（水平）对齐：center、space-between、flex-end。"],"50":["align-items","沿交叉轴（垂直）对齐：center、stretch。"],"51":["flex-wrap","允许元素换行显示。"],"52":["gap","flex 元素之间的间距。"],"53":["Media queries @media","仅在满足条件（如屏幕宽度）时生效的样式，是自适应网站的基础。"],"54":["自适应页面","在手机和电脑上都好用的网站。需要 meta viewport 标签。"],"60":["git init","在文件夹中创建 Git 仓库。"],"61":["git add 与 commit","暂存更改并附带说明保存。"],"62":["git push 与 GitHub","把代码推送到 GitHub（git pull 用于下载）。"],"63":["Node.js","让 JavaScript 在浏览器之外、在服务器上运行的环境。"],"64":["npm","Node 的包管理器：安装库，配置保存在 package.json 中。"],"65":["Express 服务器","Node 的热门 Web 框架：用来创建路由（route）。"],"66":["数据库","数据存储在表中（行和列）。例如：PostgreSQL、MySQL、SQLite。"],"67":["SQL SELECT","从表中读取数据。WHERE 是过滤条件。"],"68":["SQL INSERT","向表中添加新行。"],"69":["React 组件","界面中可复用的部分：返回 JSX 的函数。"],"70":["useState","保存组件的状态（state）；状态改变时页面会更新。"],"71":["props","从外部传给组件的数据。"],"72":["什么是后端","网站在服务器上运行、用户看不到的部分：逻辑、数据库、安全。"],"73":["后端语言","后端可以用 JavaScript（Node.js）、Python、Java、PHP、Go 等语言编写。"],"74":["后端项目结构","项目按文件夹划分：路由、控制器、模型，使代码井然有序。"],"75":["HTTP 方法","GET 读取，POST 创建，PUT/PATCH 更新，DELETE 删除。"],"76":["状态码","服务器响应的结果：200 OK、201 Created、400 请求错误、401 未授权、404 未找到、500 服务器错误。"],"77":["REST API","针对资源（users、posts）的 URL 和方法的明确规则，响应通常以 JSON 格式返回。"],"78":["路由参数","URL 中可变的部分（:id）和查询参数（?page=2）。"],"79":["Middleware","在请求与响应之间运行的函数：日志、校验、解析 JSON。next() 会交给下一个处理。"],"80":["JSON 响应与 body","通过 POST 发送的数据在 req.body 中；res.json() 返回 JSON。"],"81":["SQL UPDATE 与 DELETE","UPDATE 修改已有行，DELETE 删除行。别忘了 WHERE，否则所有行都会被修改！"],"82":["JOIN","按公共列把两张表合并。"],"83":["在 Node.js 中操作数据库","通过 pg 库向 PostgreSQL 发送查询。值请始终使用 $1 这样的参数。"],"84":["密码哈希","密码绝不能明文存储。bcrypt 会把它变成不可逆的哈希。"],"85":["JWT 令牌","登录后服务器发放已签名的令牌，客户端每次请求都带上它。"],"86":["受保护的路由","鉴权中间件会校验令牌；无效则返回 401。"],"87":["CORS","浏览器通常会拦截来自其他域名的请求。CORS 规定允许哪些网站访问。"],"88":[".env 与机密信息","不要把密码和密钥写进代码：放在 .env 文件里，并把它加入 .gitignore。"],"89":["SQL 注入与校验","不要把用户输入直接拼进查询：先校验，并使用参数化查询。"],"90":["try/catch 与 async 错误","用 try/catch 捕获 async 函数中的错误，并传给 next(err)。"],"91":["错误中间件","带 4 个参数的函数可在一处捕获所有错误。"],"92":["API 测试","用 Jest 和 supertest 可以自动测试接口（endpoint）。"],"93":["Deploy","把后端部署到互联网上的服务器：Render、Railway、VPS。端口从环境变量读取。"],"94":["Docker","把程序及其环境打包进容器，在任何地方运行结果都一样。"],"95":["CI/CD 与日志","推送到 Git 时自动运行测试和部署（GitHub Actions）。通过日志跟踪错误。"],"96":["什么是网络安全","保护数据、系统和网络免遭未经授权的访问、窃取和破坏的领域。"],"97":["威胁类型","最常见的威胁：恶意软件（malware）、钓鱼、密码窃取、DDoS 和内部人员失误。"],"98":["风险与防护层次","风险 = 威胁 × 漏洞 × 影响。防护不是单层的，而是多层的（defense in depth）。"],"99":["强密码","最好使用长（12 位以上）且唯一的密码。每个网站使用不同的密码。"],"100":["密码管理器","把所有密码存放在加密保险库中并生成唯一密码。你只需记住一个主密码。"],"101":["2FA 与 passkey","即使密码被盗，两步验证也能保护账号。使用应用或密钥比短信更好。"],"102":["钓鱼（phishing）","骗子通过伪造的邮件、短信或网站，试图获取你的密码和银行卡信息。"],"103":["社会工程","欺骗的是人而不是技术：先取得信任，再让对方自己说出所需信息。"],"104":["检查链接和文件","点击前先看清地址。不要打开可疑文件，必要时用 VirusTotal 检查。"],"105":["网络基础","IP 地址标识设备，端口标识服务。HTTP → 80，HTTPS → 443，SSH → 22。"],"106":["防火墙与 VPN","防火墙按规则过滤进出流量。VPN 加密流量，在公共 Wi-Fi 上保护你。"],"107":["HTTPS 与 TLS","TLS 加密数据，并通过证书验证服务器。明文 HTTP 中的数据可能被截获。"],"108":["加密类型","对称加密使用一个密钥（AES）。非对称加密使用公钥和私钥一对（RSA）。私钥绝不能给任何人。"],"109":["哈希（Hash）","哈希是数据的不可逆“指纹”。密码请使用 bcrypt/argon2，MD5 和 SHA-1 已过时。"],"110":["数字签名与证书","签名证明文档未被修改并确认其来源。证书由受信任的机构（CA）签发。"],"111":["OWASP Top 10","Web 应用中最危险漏洞的清单（owasp.org），每个开发者都应了解。"],"112":["注入与防护","用户输入被当作命令执行就是注入（injection）。防护：参数化查询并校验输入。"],"113":["XSS 与 CSRF","XSS 是外来脚本进入页面；防护：转义输出、CSP。CSRF 是以用户名义发出的伪造请求；防护：CSRF 令牌、SameSite cookie。"],"114":["更新与依赖","旧的程序和库存在已知漏洞。请定期更新并检查。"],"115":["备份（backup）","为防勒索软件和误操作，遵循 3-2-1 原则：3 份副本、2 种介质、1 份异地保存。"],"116":["最小权限原则","只给用户和程序必需的权限。这样被攻破时损失更小。"],"117":["事件响应","怀疑遭到攻击时：停止、隔离、查明原因、恢复并总结经验。"],"118":["日志与监控","记录登录尝试和错误，可以及早发现异常行为。不要在日志中保存密码。"],"119":["网络安全职业","方向：SOC 分析师、安全工程师、渗透测试员（必须获得授权！）、DevSecOps。有合法的平台可供练习。"],"120":["什么是数据科学","从数据中得出有用结论和预测的领域：结合统计学、编程和行业知识。"],"121":["工作流程","典型步骤：提出问题、收集数据、清洗、分析、建模、展示结果。"],"122":["工具","最流行的语言是 Python。库：NumPy、Pandas、Matplotlib、scikit-learn。环境：Jupyter Notebook。"],"123":["Python 基础","变量、列表（list）和字典（dict）是处理数据的基础。"],"124":["循环与函数","for 循环遍历元素，函数让代码可以重复使用。"],"125":["列表推导式","一行代码创建或过滤列表的方法。"],"126":["NumPy 数组","用于快速数值计算的数组（array）。运算会一次作用于整个数组。"],"127":["索引与过滤","按索引或条件取出数组中需要的部分。"],"128":["统计函数","平均数、中位数和标准差可以概括数据的整体情况。"],"129":["DataFrame 与读取","Pandas 中的表格叫 DataFrame。从 CSV 文件读取并查看前几行。"],"130":["选择与过滤","按名称选择列，按条件选择行。"],"131":["groupby 与排序","按组计算（例如各城市平均价格）并排序。"],"132":["缺失值","数据里常有空值（NaN）：需要找出来，删除或填充。"],"133":["重复项与类型","删除重复行并修正列的类型。"],"134":["异常值（outlier）","与其他值差异极大的数值可能是错误，也可能是重要情况。先弄清原因。"],"135":["Matplotlib 图表","基本图表：折线图、柱状图、直方图。务必写上标题和坐标轴名称。"],"136":["选择图表类型","随时间变化用折线图，比较用柱状图，分布用直方图，关系用散点图（scatter）。"],"137":["Seaborn 与相关性","Seaborn 能画出美观的图表。相关性表示两个变量的关联（-1 到 1）。相关不等于因果！"],"138":["什么是机器学习","模型自己从数据中学习规律。类型：有监督学习（有答案）和无监督学习（无答案）。"],"139":["Train/Test 划分","把数据分成两份，用模型没见过的数据来检验。否则结果会有误导性。"],"140":["第一个模型","线性回归：模型先训练（fit），再预测（predict），最后评估。"],"141":["模型评估","分类看准确率（accuracy）、precision 和 recall；回归看 MAE、RMSE。不要只依赖 accuracy。"],"142":["过拟合（Overfitting）","模型死记训练数据，在新数据上表现很差。解决办法：更多数据、更简单的模型、交叉验证。"],"143":["项目与作品集","从 Kaggle 获取公开数据，分析后把结果连同说明发布到 Jupyter 或 GitHub。伦理：保护个人数据。"]},"es":{"0":["Navegador","Programa que carga y muestra sitios web (Chrome, Safari). Lee HTML, CSS y JS."],"1":["Servidor","Ordenador que guarda el sitio y lo envía cuando el navegador lo pide."],"2":["VS Code","Editor de código. Extensiones útiles: Live Server, Prettier."],"3":["Archivos y carpetas","Un sitio es una carpeta: index.html, style.css y la carpeta img/."],"55":["Variables: let, const","Guardan datos con un nombre. let puede cambiar, const no."],"56":["Función","Bloque de código reutilizable: nombre, parámetros y return."],"57":["DOM y addEventListener","Encuentra un elemento de la página con JS y responde a un evento (clic)."],"58":["Arreglo (array)","Guarda varios valores en una lista. El índice empieza en 0."],"59":["if / else","Elige qué código se ejecuta según una condición."],"4":["DOCTYPE","Primera línea: le dice al navegador que es HTML5."],"5":["html","Etiqueta principal (raíz); todo lo demás va dentro."],"6":["head","Parte de servicio: title, meta, enlace a CSS. No se ve en la página."],"7":["body","La parte visible de la página: texto, imágenes, botones."],"8":["h1–h6","Encabezados. h1 es el principal (uno por página), h6 el más pequeño."],"9":["p","Un párrafo de texto."],"10":["strong","Texto en negrita, importante."],"11":["em","Texto en cursiva para dar énfasis."],"12":["br","Salto de línea. No necesita etiqueta de cierre."],"13":["ul li","Lista con viñetas (ul) y sus elementos (li)."],"14":["ol","Lista numerada: 1, 2, 3…"],"15":["Dejar un comentario","Comentario en el código, no se ve en la página. Atajo: Ctrl+/"],"16":["a href","Enlace. href indica a dónde lleva."],"17":["img src alt","Imagen. src es la dirección del archivo, alt es la descripción si la imagen no carga."],"18":["table tr td th","Tabla. table es toda la tabla, tr una fila, th una l estado (state) del componente; si cambia, la página se actualiza."],"71":["props","Datos que se pasan al componente desde fuera."],"72":["Qué es Backend","La parte del sitio que funciona en el servidor y que el usuario no ve: lógica, base de datos, seguridad."],"73":["Lenguajes de backend","El backend se puede escribir en JavaScript (Node.js), Python, Java, PHP, Go y otros lenguajes."],"74":["Estructura de un proyecto backend","El proyecto se divide en carpetas: rutas, controladores, modelos. Así el código se mantiene ordenado."],"75":["Métodos HTTP","GET lee, POST crea, PUT/PATCH actualiza, DELETE elimina."],"76":["Códigos de estado","El resultado de la respuesta del servidor: 200 OK, 201 Created, 400 solicitud incorrecta, 401 sin autorización, 404 no encontrado, 500 error del servidor."],"77":["REST API","Reglas claras de URL y métodos para recursos (users, posts). La respuesta suele volver en formato JSON."],"78":["Parámetros de ruta","La parte variable de la URL (:id) y los parámetros de consulta (?page=2)."],"79":["Middleware","Función que se ejecuta entre la solicitud y la respuesta: log, comprobación, lectura de JSON. next() pasa al siguiente."],"80":["Respuesta JSON y body","Los datos enviados por POST están en req.body; res.json() devuelve JSON."],"81":["SQL UPDATE y DELETE","UPDATE cambia una fila existente, DELETE la elimina. ¡No olvides WHERE, o cambiarán todas las filas!"],"82":["JOIN","Une dos tablas por una columna común."],"83":["Trabajar con una base de datos desde Node.js","Con la librería pg se envían consultas a PostgreSQL. Para los valores usa siempre parámetros como $1."],"84":["Hash de contraseñas","La contraseña nunca se guarda en claro. bcrypt la convierte en un hash irreversible."],"85":["Token JWT","Tras iniciar sesión, el servidor da un token firmado; el cliente lo envía en cada solicitud."],"86":["Ruta protegida","El middleware de autenticación revisa el token; si no es válido devuelve 401."],"87":["CORS","El navegador suele bloquear solicitudes de otro dominio. CORS define qué sitios están permitidos."],"88":[".env y secretos","No escribas contraseñas ni claves en el código: guárdalas en un archivo .env y añádelo a .gitignore."],"89":["Inyección SQL y validación","No metas lo que escribe el usuario directamente en la consulta: valídalo y usa consultas parametrizadas."],"90":["try/catch y errores async","Captura los errores de una función async con try/catch y pásalos a next(err)."],"91":["Middleware de errores","Una función de 4 parámetros captura todos los errores en un solo lugar."],"92":["Pruebas de API","Con Jest y supertest se pueden probar los endpoints automáticamente."],"93":["Deploy","Poner el backend en un servidor de internet: Render, Railway, VPS. Toma el puerto de una variable de entorno."],"94":["Docker","Empaqueta la aplicación y su entorno en un contenedor: funciona igual en todas partes."],"95":["CI/CD y logs","Al hacer push a Git se ejecutan pruebas y deploy automáticamente (GitHub Actions). Vigila los errores con los logs."],"96":["Qué es la ciberseguridad","El campo de proteger datos, sistemas y redes contra el acceso no autorizado, el robo y los daños."],"97":["Tipos de amenazas","Las amenazas más comunes: malware, phishing, robo de contraseñas, DDoS y errores internos."],"98":["Riesgo y capas de defensa","Riesgo = amenaza × vulnerabilidad × impacto. La protección no es una sola, sino en varias capas (defense in depth)."],"99":["Contraseña segura","Lo mejor es una contraseña larga (12+ caracteres) y única. Usa una distinta para cada sitio."],"100":["Gestor de contraseñas","Guarda todas las contraseñas en una bóveda cifrada y genera contraseñas únicas. Solo recuerdas una contraseña maestra."],"101":["2FA y passkey","La verificación en dos pasos protege la cuenta aunque roben la contraseña. Una app o llave es mejor que un SMS."],"102":["Phishing","Un estafador intenta obtener tu contraseña y datos de tarjeta con un correo, SMS o sitio falso."],"103":["Ingeniería social","Engañar a la persona, no a la tecnología: ganarse la confianza para que ella misma revele la información."],"104":["Comprobar enlaces y archivos","Mira la dirección antes de hacer clic. No abras archivos sospechosos; si hace falta, compruébalos en VirusTotal."],"105":["Fundamentos de redes","La dirección IP identifica el dispositivo y el puerto el servicio. HTTP → 80, HTTPS → 443, SSH → 22."],"106":["Firewall y VPN","Un firewall filtra el tráfico de entrada y salida con reglas. Una VPN cifra el tráfico y protege en Wi-Fi abierto."],"107":["HTTPS y TLS","TLS cifra los datos y verifica el servidor con un certificado. En HTTP sin cifrar los datos pueden interceptarse."],"108":["Tipos de cifrado","El simétrico usa una sola clave (AES). El asimétrico usa un par de clave pública y privada (RSA). Nunca entregues tu clave privada."],"109":["Hash","Un hash es una huella irreversible de los datos. Para contraseñas usa bcrypt/argon2; MD5 y SHA-1 están obsoletos."],"110":["Firma digital y certificado","La firma confirma que el documento no ha cambiado y quién lo envió. El certificado lo emite una entidad de confianza (CA)."],"111":["OWASP Top 10","La lista de las vulnerabilidades más peligrosas en aplicaciones web (owasp.org). Todo desarrollador debería conocerla."],"112":["Injection y defensa","Cuando lo que escribe el usuario se ejecuta como comando, es injection. Defensa: consultas parametrizadas y validar la entrada."],"113":["XSS y CSRF","XSS es un script ajeno en la página; defensa: escapar la salida, CSP. CSRF es una solicitud falsa en nombre del usuario; defensa: token CSRF, cookie SameSite."],"114":["Actualizaciones y dependencias","El software y las librerías antiguos tienen vulnerabilidades conocidas. Actualiza y revisa con regularidad."],"115":["Copia de seguridad (backup)","Para protegerte de ransomware y errores, la regla 3-2-1: 3 copias, 2 tipos de soporte, 1 en otro lugar."],"116":["Principio de mínimo privilegio","Da a usuarios y programas solo los permisos necesarios. Así se reduce el daño si son comprometidos."],"117":["Respuesta a incidentes","Si sospechas un ataque: detenerlo, aislar, hallar la causa, recuperar y sacar conclusiones."],"118":["Logs y monitorización","Registra los intentos de acceso y los errores: la actividad inusual se detecta pronto. No guardes contraseñas en los logs."],"119":["Una carrera en ciberseguridad","Rutas: analista SOC, ingeniero de seguridad, pentester (¡solo con permiso!), DevSecOps. Hay plataformas legales para practicar."],"120":["Qué es Data Science","El campo de sacar conclusiones y predicciones útiles a partir de datos: une estadística, programación y conocimiento del área."],"121":["Flujo de trabajo","Pasos habituales: plantear la pregunta, recopilar datos, limpiar, analizar, construir un modelo, presentar el resultado."],"122":["Herramientas","El lenguaje más popular es Python. Librerías: NumPy, Pandas, Matplotlib, scikit-learn. Entorno: Jupyter Notebook."],"123":["Fundamentos de Python","Variable, lista (list) y diccionario (dict): la base para trabajar con datos."],"124":["Bucle y función","El bucle for recorre los elementos; la función permite reutilizar código."],"125":["List comprehension","Una forma de crear o filtrar una lista en una sola línea."],"126":["Arreglo de NumPy","Un arreglo (array) para cálculos numéricos rápidos. Las operaciones se aplican a todo el arreglo a la vez."],"127":["Indexación y filtro","Obtener la parte necesaria del arreglo por índice o por condición."],"128":["Funciones estadísticas","La media, la mediana y la desviación estándar dan una visión general de los datos."],"129":["DataFrame y lectura","En Pandas, una tabla es un DataFrame. Leemos de un archivo CSV y vemos las primeras filas."],"130":["Selección y filtrado","Elegir una columna por nombre y filas por condición."],"131":["groupby y ordenación","Calcular por grupos (por ejemplo, precio medio por ciudad) y ordenar."],"132":["Valores faltantes","Los datos tienen huecos vacíos (NaN): hay que encont itverlauf: Linie; Vergleich: Balken; Verteilung: Histogramm; Zusammenhang: Scatter."],"137":["Seaborn und Korrelation","Seaborn erstellt schöne Diagramme. Korrelation ist der Zusammenhang zweier Variablen (von -1 bis 1). Korrelation ist nicht Ursache!"],"138":["Was ist Machine Learning","Ein Modell lernt Muster selbst aus Daten. Arten: überwachtes (mit Antworten) und unüberwachtes (ohne Antworten) Lernen."],"139":["Train/Test-Aufteilung","Wir teilen die Daten in zwei Teile, um das Modell an unbekannten Daten zu prüfen. Sonst ist das Ergebnis trügerisch."],"140":["Erstes Modell","Lineare Regression: Das Modell wird trainiert (fit), sagt dann voraus (predict) und wird bewertet."],"141":["Modellbewertung","Bei Klassifikation: Genauigkeit (accuracy), Precision und Recall. Bei Regression: MAE, RMSE. Nicht nur auf accuracy verlassen."],"142":["Overfitting (Überanpassung)","Das Modell lernt die Trainingsdaten auswendig und arbeitet mit neuen Daten schlecht. Lösung: mehr Daten, einfacheres Modell, Kreuzvalidierung."],"143":["Projekt und Portfolio","Nimm offene Daten von Kaggle, analysiere sie und veröffentliche das Ergebnis mit Erklärung in Jupyter oder auf GitHub. Ethik: persönliche Daten schützen."]}};
